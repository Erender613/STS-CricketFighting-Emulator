        const d = Math.hypot(e.x - this.u.x, e.y - this.u.y);
        if (d < this.p.swingRange) {
          this.swing = this.p.swingTime; this.cd = this.p.swingCd; this.hit = false;
          this.startAng = this.ang;
          /* 只走"最近的那个转向"：直接 lerp 到目标角时差值最大能接近一整圈
             （比如 179° → -179°，本该只转 2°，却要倒着转 358°），
             于是偶尔会出现剑在 0.2 秒内甩过整圈 —— 这就是"挥砍过快"。 */
          this.swingArc = wrapPi(Math.atan2(e.y - this.u.y, e.x - this.u.x) - this.startAng);
          sfx('slash_attack', 0.7, vrand(0.95, 1.05, 'vrand'), 0.02);
        }
      }
    }
    /* 光尘：平均每 0.10s 从剑身随机位置冒一颗。
       位置只按「冒出的那一帧」算一次，之后这颗就不再跟随剑移动 / 旋转。 */
    this.emit += dt;
    while (this.emit >= 0.10) { this.emit -= 0.10; sbMoteAlongBlade(this.pose(), 1); }
  }
  draw(ctx) {
    const p = this.p, u = this.u, P = this.pose();
    const ang = P.ang, sc = P.sc, sx = P.x, sy = P.y;
    /* 出生时一圈金光，交代「这里刚铸成一把剑」 */
    if (this.birth < 0.6) {
      const k = this.birth / 0.6;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = '#ffd58a'; ctx.lineWidth = 4 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(sx, sy, lerp(10, p.orbitR * 1.35, k), 0, TAU); ctx.stroke();
      ctx.restore();
    }
    /* 挥砍残影：从起手角到当前角的一条"风压扇面"，分成 8 小段、越靠近刀越亮 ——
       才像真的拖出来的尾，而不是一块糊在那里的影子。就算这一刀很快，
       有这片扇面也能看出"是挥过去了"，而不是瞬移。 */
    if (this.swing > 0 && Math.abs(this.swingArc) > 0.05) {
      const k3 = clamp(1 - this.swing / p.swingTime, 0, 1);
      const r0 = p.orbitR - 26, r1 = p.orbitR + 96;
      const a0 = this.startAng, a1 = ang;
      const N = 8;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.95 * (1 - k3 * k3 * k3);   // 越到收刀越淡，收完正好散掉
      for (let i = 0; i < N; i++) {
        const f0 = i / N, f1 = (i + 1) / N;
        const seg = ctx.createRadialGradient(u.x, u.y, r0, u.x, u.y, r1);
        seg.addColorStop(0, 'rgba(255,206,132,0)');
        seg.addColorStop(0.5, 'rgba(255,206,132,' + (0.58 * (0.25 + 0.75 * f0)).toFixed(3) + ')');
        seg.addColorStop(1, 'rgba(255,206,132,0)');
        ctx.fillStyle = seg;
        const lo = a0 + (a1 - a0) * f0, hi = a0 + (a1 - a0) * f1;
        ctx.beginPath();
        ctx.arc(u.x, u.y, r1, Math.min(lo, hi), Math.max(lo, hi));
        ctx.arc(u.x, u.y, r0, Math.max(lo, hi), Math.min(lo, hi), true);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

class MechForge {

    world.nums.push(new DmgNum(this.u.x + vrand(-18, 18, 'vrand'), this.u.y - 34, '+' + this.p.bonusPerBounce, 'info'));
    /* 每次反弹 = 在铁砧上锻打一锤：音效与「剑生成」完全一致（同音量、同音高）。
       0.09s 的 minGap 只是防止极快连弹时声音叠起来爆音，不改音色。 */
    sfx('card_smith', 1.0, vrand(0.96, 1.02, 'vrand'), 0.09);
    sfx('heavy_attack', 0.45, 0.62, 0);
    world.effects.push(new Ring(this.u.x, this.u.y, 12, 52, 0.26, 'rgba(255,205,130,.7)', 2.5));

  }

  applyGrowth(g) {

class Meteor extends Effect {
  constructor(x, y, p, owner) {
    super();
    this.tx = x; this.ty = y; this.p = p; this.owner = owner;

    this.y += this.p.fallSpd * dt;

  }

      ctx.globalAlpha = 0.85; ctx.lineWidth = 2;

      ctx.globalAlpha = 0.18; ctx.setLineDash([10, 12]);
      ctx.beginPath(); ctx.moveTo(0, -this.ty); ctx.lineTo(0, 0); ctx.stroke();
      ctx.restore();
      return;

    ctx.save();
    ctx.translate(this.x, this.y);
    const g = ctx.createLinearGradient(0, -190, 0, 10);
    g.addColorStop(0, 'rgba(200,110,240,0)');
    g.addColorStop(0.5, 'rgba(190,90,235,.5)');
    g.addColorStop(1, 'rgba(255,214,150,.9)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(0, -200); ctx.lineTo(20, 0); ctx.closePath(); ctx.fill();
    /* 陨石本体：【与「陨石打击」同一张贴图】（用户口径），
       只是体型明显更小 —— 末日降临是"连发小陨石"，不是一锤定音的那种大陨石。
       （原来这里是程序画的多边形石头。） */
    ctx.rotate(world.t * 4);
    const im = IMG['sp_meteor_rock'];
    const S = 64;
    if (im) ctx.drawImage(im, -S / 2, -S / 2, S, S);
    else {
      ctx.beginPath();
      const R = 23;
      for (let i = 0; i < 9; i++) {
        const a = i / 9 * TAU, rr = R * (0.78 + 0.24 * Math.abs(Math.sin(i * 2.3)));
        if (i) ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = '#3a2242'; ctx.fill();
      ctx.strokeStyle = '#ffb15e'; ctx.lineWidth = 2.4; ctx.stroke();
    }
    ctx.restore();
  }
}
class DoomZone extends Effect {
  constructor(x, y, p, owner) {
    super();
    this.x = x; this.y = y; this.p = p; this.owner = owner;
    this.t = 0; this.life = p.zoneDur;
    this.acc = new Map(); this.drawUnder = true;
  }
  update(dt) {
    this.t += dt;
    if (this.t > this.life) { this.dead = true; return; }
    /* 圈内【所有】敌方单位（含仆从）都叠灾厄 —— 之前用 enemyOf 只取最近一个，
       冲锋召唤仆从后另一个站在圈里也吃不到，看起来像"在圈里却不叠"。 */
    for (const u of world.units) {
      if (u.team === this.owner.team || !u.alive || u.dying || u.finished) continue;
      const d = Math.hypot(u.x - this.x, u.y - this.y);
      /* 判定半径是显式的 doomR（125），不再由画出来的圈 zoneR(106) 推算 —— 两者已解耦：
         想调"能盖到多远"改 doomR，想调"看起来多大"改 zoneR。 */
      if (d < this.p.doomR) {
        u.addDoom(this.p.doomRate * dt);
        const a = (this.acc.get(u) || 0) + dt;
        if (a > 0.5) {
          this.acc.set(u, 0);
          sfx('doom_apply', 0.2, 1.5, 0.35);
          burst(u.x + vrand(-22, 22, 'vrand'), u.y + CFG.R * 0.7, 2, { c: '#a86be0', s0: 10, s1: 50 });
        } else this.acc.set(u, a);
      }
    }
  }
  draw(ctx) {
    const k = this.t / this.life;
    const fade = clamp(Math.min(this.t * 4, (1 - k) * 4), 0, 1);
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = fade * 0.92;
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, this.p.zoneR);
    g.addColorStop(0, 'rgba(120,50,170,.62)');
    g.addColorStop(0.62, 'rgba(86,32,126,.42)');
    g.addColorStop(1, 'rgba(60,16,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, this.p.zoneR, 0, TAU); ctx.fill();
    ctx.globalAlpha = fade * 0.75;
    ctx.rotate(world.t * 0.7);
    ctx.strokeStyle = '#b57bea'; ctx.lineWidth = 2.2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(0, 0, this.p.zoneR * (0.55 + i * 0.19), i * 1.1, i * 1.1 + 2.1);
      ctx.stroke();
    }
    ctx.restore();
  }

function impact(x, y, p, owner) {
  world.effects.push(new DoomZone(x, y, p, owner));
  world.shake = 18;
  world.effects.push(new Ring(x, y, 10, p.zoneR * 1.5, 0.5, '#d9a3ff', 5));
  burst(x, y, 34, { c: '#ffcf8a', s0: 140, s1: 520 });
  burst(x, y, 22, { c: '#b57bea', s0: 100, s1: 380 });
  sfx('heavy_attack', 1.0, 0.72);
  // 落点直伤砸【范围内所有】敌方单位（本体+仆从），不伤自己
  for (const e of world.enemiesOf(owner)) {
    const dx = e.x - x, dy = e.y - y;
    if (Math.hypot(dx, dy) >= p.hitR) continue;
    e.damage(p.dmg, 'hit');
    /* 【陨石直击特例】（用户 2026 口径）这一发把生命值砸进灾厄斩杀线
       （灾厄 ≥ 生命）→ 跳过 3 秒读条、当场结算灾厄。末日降临的终结感就靠这一下：
       不然读条 3 秒里对手可能回血跑掉，"被陨石砸死"就变成了"被陨石擦一下"。
       ⚠ 只在这条直击路径上生效；其它伤害来源（暗黑球 / 刀刃 / 血肉轮盘…）仍走读条。 */
    if (e.doomBlast()) continue;
    /* 强击退：从落点朝外把目标掀开。正好砸在圆心时方向会退化成 (0,0)
       （knock 里 L 退化成 1 → 单位方向为零 → 那张卡会原地定住），兜一个向下。 */
    if (Math.hypot(dx, dy) > 1) e.knock(dx, dy, p.knock, p.knockCap);
    else e.knock(0, 1, p.knock, p.knockCap);
  }
}

/* 发射回弹曲线：u = 发射后经过时间 / 0.26s（0..1）
     0.00 -> 1.00   原尺寸
     0.30 -> 0.56   猛地一缩（出膛挤压）
     0.62 -> 1.44   弹大一点（回弹过冲）
     1.00 -> 1.00   回到原尺寸
   三段各取正弦半波，衔接处连续。 */
function orbPopScale(u) {
  if (u <= 0 || u >= 1) return 1;
  if (u < 0.30) return 1 - 0.44 * Math.sin(Math.PI * 0.5 * (u / 0.30));
  if (u < 0.62) return 0.56 + 0.88 * Math.sin(Math.PI * 0.5 * ((u - 0.30) / 0.32));
  return 1.44 - 0.44 * Math.sin(Math.PI * 0.5 * ((u - 0.62) / 0.38));
}

class Orb extends Effect {
  constructor(owner, ang, p) {

    this.x = owner.x; this.y = owner.y;

    this.vx = 0; this.vy = 0; this.life = 0; this.launched = false; this.zapT = -9;
    this.spd = 0; this.aim = 0;
    this.hold = false;      // 蓄力停摆：为 true 时不再自转环绕
    this.pop = -1;          // 发射回弹计时；-1 = 尚未发射
    this.hitMinions = new Set();   // 已穿过的仆从（弹幕穿过，同一发只打一次）
    /* 注意：这里【故意不设 manual】，让引擎统一 update。
       以前电球是 manual（只由 MechVoltaic 逐个 update），一旦机制换批次把 orbs 数组清空，
       已在飞的电球就再也没人 update —— 于是永久停在空中（滞留 bug）。

      this.x = o.x + Math.cos(this.ang) * p.orbitR;
      this.y = o.y + Math.sin(this.ang) * p.orbitR;
      /* 环绕灼烧对【每个】贴着电球的敌方单位（本体+仆从）都生效 */
      const touching = world.enemiesOf(o).filter(e => {
        const dx = e.x - this.x, dy = e.y - this.y;
        return dx * dx + dy * dy < (CFG.R * 0.95) * (CFG.R * 0.95);
      });
      if (touching.length) {
        this.tickCd -= dt;
        /* 【余量必须累加，不能重置成固定值】。
           原来写的是 `this.tickCd = 1/p.dpsTick` —— 把不足一帧的余量直接丢掉，
           于是实际周期被抬到"整帧数 × dt"：当年 20/s 的间隔是 0.05s＝正好 3 帧，
           但 3 帧的浮点累加会略微超过 0.05 → 第 3 帧不跳、变成每 4 帧一跳，
           实测只有 15 次/秒（45 dps）。改成 += 之后平均周期才真的是 1/dpsTick。
           用 while 兜住"一帧内该跳多次"的极端 dt。 */
        while (this.tickCd <= 0) {
          this.tickCd += 1 / p.dpsTick;
          /* 每秒 dpsTick(10) 次、每次 orbitDmg(3) 点，每个贴着的目标各吃一次。
             这里【不走 e.damage()】是故意的：10 次/秒的数字飘字与音效会刷屏，
             灼烧只做"血在掉"的表现。 */
          for (const e of touching) {
            if (e.guard) continue;                 // 空悲切护体：环绕灼烧也扣不动
            /* 分身/灵魂不能走"直扣 hp"：它们的生命口径不在血条上 ——
               分身挨打 = 当场碎裂反伤（disperse）、灵魂挨打 = 当场消散（kill），
               直扣 hp 会把两条口径全部绕过（实测环绕灼烧打不碎分身、烧不死灵魂）。 */
            if (e.replica) { e.disperse(o, false); continue; }
            if (e.soul) { e.flash = Math.max(e.flash, 0.12); e.kill(); continue; }
            e.hp = Math.max(0, e.hp - p.orbitDmg);
            e.flash = Math.max(e.flash, 0.1);
            if (e.hp <= 0) e.kill();
            world.effects.push(new Zap(this.x, this.y, e.x, e.y));
          }
          if (world.t - this.zapT > 0.07) {
            this.zapT = world.t;
            sfx('lightning_orb_passive', 0.16, vrand(1.1, 1.4, 'vrand'), 0.05);
          }
        }
      }
    } else {
      if (this.delay > 0) { this.delay -= dt; return; }
      if (!this.launched) {
        this.launched = true;
        this.life = 0;
        const e = world.enemyOf(o);
        this.aim = e ? Math.atan2(e.y - this.y, e.x - this.x) : Math.atan2(o.dy, o.dx);
        this.spd = p.shotSpd;
        this.vx = Math.cos(this.aim) * this.spd;
        this.vy = Math.sin(this.aim) * this.spd;
        sfx('lightning_orb_evoke', 0.26, vrand(1.0, 1.3, 'vrand'), 0.02);
        burst(this.x, this.y, 3, { c: '#cdf2ff', s0: 40, s1: 150 });
        this.pop = 0;                     // 启动"一缩再弹大"的发射回弹
      }
      if (this.pop >= 0) this.pop += dt;
      // 速度曲线：ramp 起手冲刺、fall 平滑回落，最终收敛到 shotSpd
      const ramp = 1 - Math.exp(-this.life / p.shotRise);
      const fall = Math.exp(-this.life / p.shotFall);
      this.spd = p.shotSpd + p.shotBoost * ramp * fall;

      /* 出膛方向在发射那一刻定死，之后一路直线 —— 电球不再追踪目标。
         （原来这里每帧朝目标修正 `homeRate` 度，等于自带制导。） */
      this.vx = Math.cos(this.aim) * this.spd;
      this.vy = Math.sin(this.aim) * this.spd;

      this.x += this.vx * dt; this.y += this.vy * dt;
      this.life += dt;
      /* 飞行命中对【每个】敌方单位（本体+仆从）：电球撞到谁都算，不再只看最近的 */
      for (const e of world.enemiesOf(o)) {
        const dx = e.x - this.x, dy = e.y - this.y;
        if (dx * dx + dy * dy < CFG.R * CFG.R) {
          cloneHitBy(e);                 // 打到余像的分身 → 分身碎裂
          /* 击退：小刀同款的 nudge —— 只加速度、【不改方向】。
             knock() 会顺手把 dx/dy 设成飞来方向，等于"命中即转向"的硬控；
             一轮齐射几十发被反复掰方向会显得很鬼畜。cap 仍然封着，
             理由同 knock() 注释 —— 一轮齐射几十发，不封顶就顶到速度上限了。
             现在 10/60：已回退到最原始值。 */
          /* 【弹幕穿过仆从】必须先查 hitMinions 再结算。
             电球与仆从是圆-圆重叠判定，穿透后会连续多帧都满足距离条件，
             少了这道检查就会"一颗电球打同一只仆从好几下"（每帧一下）。 */
          if (e.minion) {
            if (this.hitMinions.has(e)) continue;   // 这颗电球已经打过它了：不结算
            this.hitMinions.add(e);
          }
          e.nudge(p.shotKnock, p.shotKnockCap);
          e.damage(p.shotDmg, 'light', o);
          burst(this.x, this.y, 7, { c: '#a9e8ff', s0: 60, s1: 220 });
          if (e.minion) continue;                    // 穿过仆从：继续飞
          this.dead = true; break;
        }
      }
      if (this.dead) return;
      if (this.x < -40 || this.x > CFG.AW + 40 || this.y < -40 || this.y > CFG.AH + 40 || this.life > 5) this.dead = true;
    }
  }
  draw(ctx) {
    if (this.state !== 'orbit' && this.delay > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.45 * Math.sin(world.t * 30);
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.p.orbR * 0.7, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }
    const im = IMG['sp_lightning_orb'];
    /* 发射回弹（缩→弹大→复原）：让"被弹出去"的加速感看得见 */
    let pop = this.pop >= 0 ? orbPopScale(this.pop / 0.26) : 1;
    /* 蓄力停摆期间轻微呼吸，表明是在蓄力而不是卡住了 */
    if (this.hold && this.state === 'orbit') pop *= 1 + 0.10 * Math.sin(world.t * 16);
    const s = this.p.orbR * 2.4 * pop;
    /* 速度拖尾：长度/亮度跟着当前速度走，让"冲刺→巡航"的曲线看得见 */
    if (this.state !== 'orbit' && this.launched) {
      const p = this.p;
      const k = clamp((this.spd - p.shotSpd) / (p.shotBoost * 0.62), 0, 1);
      if (k > 0.03) {
        const L = Math.hypot(this.vx, this.vy) || 1;
        const ux = this.vx / L, uy = this.vy / L;
        const tl = this.p.orbR * (1.0 + 3.2 * k);
        const tg = ctx.createLinearGradient(this.x, this.y, this.x - ux * tl, this.y - uy * tl);
        tg.addColorStop(0, 'rgba(206,244,255,' + (0.30 + 0.42 * k).toFixed(3) + ')');
        tg.addColorStop(1, 'rgba(110,190,255,0)');
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineCap = 'round';
        ctx.strokeStyle = tg;
        ctx.lineWidth = this.p.orbR * (0.75 + 0.75 * k);
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - ux * tl, this.y - uy * tl);
        ctx.stroke();
        ctx.restore();
      }
    }
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#7fd8ff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.p.orbR * 1.55 * pop, 0, TAU); ctx.fill();
    ctx.restore();
    if (im) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(world.t * 3.4 + this.ang);
      ctx.drawImage(im, -s / 2, -s / 2, s, s);
      ctx.restore();
    } else {
      ctx.save(); ctx.fillStyle = '#cdf07a';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.p.orbR, 0, TAU); ctx.fill(); ctx.restore();
    }
  }
}
class MechVoltaic {
  constructor(u, p) {
    this.u = u; this.p = p;
    this.phase = 'idle'; this.cd = p.first;
    this.count = 1; this.orbs = []; this.timer = 0;
  }
  update(dt) {
    const p = this.p;
    if (this.phase === 'idle') {
      this.cd -= dt;
      if (this.cd <= 0) this.summon();
      return;
    }
    /* 电球本体由引擎统一 update（见 Orb 构造函数注释），
       这里只负责"换批次"和"开火"，不再逐个驱动电球。 */
    this.orbs = this.orbs.filter(o => !o.dead);
    this.timer -= dt;
    if (this.phase === 'firing') {
      this.u.freeze = Math.max(this.u.freeze, 0.04);
      if (this.timer <= 0) this.summon();
    } else if (this.phase === 'charge') {
      /* 停摆蓄力：电球已停止环绕、停在原地，静默 chargeDelay 秒后才齐射 */
      this.u.freeze = Math.max(this.u.freeze, 0.04);
      if (this.timer <= 0) this.launch();
    } else if (this.timer <= 0) {
      this.startCharge();
    }
  }
  /* 环绕结束 → 进入 charge 停摆：电球停在原地蓄力，结束后才 launch() */
  startCharge() {
    const p = this.p;
    this.orbs.forEach(o => { o.hold = true; });
    this.phase = 'charge';
    this.timer = p.chargeDelay;
    this.u.freeze = Math.max(this.u.freeze, p.chargeDelay + 0.05);
    /* 一圈由外向内收束的光环 + 蓄能音，把"0.6 秒停顿"演成蓄力而不是卡住 */
    world.effects.push(new Ring(this.u.x, this.u.y, p.orbitR, 24, p.chargeDelay, '#9fe8ff', 3));
    sfx('lightning_orb_channel', 0.7, 0.86);
  }
  summon() {
    const p = this.p;
    const n = this.count;
    // 只清空"本批次"的记录；已发射在飞的电球仍留在场上自行飞完，不再被遗弃
    this.orbs = this.orbs.filter(o => !o.dead && o.state === 'orbit');
    for (let i = 0; i < n; i++) {
      const o = new Orb(this.u, i / n * TAU, p);
      world.effects.push(o);
      this.orbs.push(o);
    }
    if (n > 1) {
      sfx('lightning_orb_channel', 0.9, vrand(0.97, 1.04, 'vrand'));
      world.effects.push(new Ring(this.u.x, this.u.y, 12, p.orbitR, 0.45, '#9fe8ff', 3));
    } else {
      sfx('lightning_orb_channel', 0.8, 1.0);
    }
    this.count = Math.min(p.maxOrbs, this.count * 2);
    this.phase = 'orbit';
    /* 召唤 → 发射的【总】间隔 = 环绕时长 + 蓄力时长，每次 4~5s 随机。 */
    this.timer = Math.max(0.15, rand(p.gapMin, p.gapMax) - p.chargeDelay);
  }
  launch() {
    const p = this.p;
    const orbiting = this.orbs.filter(o => o.state === 'orbit' && !o.dead);
    const n = orbiting.length;
    if (!n) { this.summon(); return; }
    orbiting.forEach((o, i) => { o.state = 'fire'; o.delay = i * p.shotGap; o.hold = false; });
    sfx('lightning_orb_evoke', 1.0, 0.9);
    this.phase = 'firing';
    /* 发射结束后再空 0.3 秒才进行下一次召唤（postFireGap） */
    this.timer = n * p.shotGap + p.freezeExtra + 0.25 + 0.3;
    this.u.freeze = this.timer;
    this.orbs = orbiting;
  }
  statusText() {
    const n = (this.phase === 'firing') ? 0 : this.orbs.length;
    const label = this.phase === 'idle' ? this.count : (n || this.count);
    return { t: '电球 ' + label, c: '#8fe4ff' };
  }
}
MECHS.voltaic = MechVoltaic;

/* ============================================================
   7.6 新十卡机制（劫掠/暴露/冲锋/血肉戏法/漆黑/完美打击/蛇咬/引导之星/违逆/引雷针）
   ============================================================ */

/* 点到线段的最短距离（暴露的光束判定用） */
function segDist(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay;
  const L2 = vx * vx + vy * vy;
  let t = L2 > 0 ? ((px - ax) * vx + (py - ay) * vy) / L2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
}

/* ---------- 7.6.1 完美打击 ---------- */
/* 每次相撞弹出金色角度数字：与 137.5° 误差 ≤2.5° 时直接显示 137.5°。 */
class AnglePing extends Effect {
  constructor(x, y, deg, exact) {
    super(); this.x = x; this.y = y;
    this.v = exact ? '137.5°' : deg.toFixed(0) + '°';
    this.exact = exact;
    this.t = 0; this.life = exact ? 4.3 : 1.8;   // 黄金夹角额外停留 2.5s
  }
  update(dt) { this.t += dt; this.y -= 30 * dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const k = 1 - this.t / this.life;
    ctx.save();
    ctx.globalAlpha = clamp(k * 1.8, 0, 1);
    ctx.font = `700 ${this.exact ? 30 : 17}px "Segoe UI",system-ui,sans-serif`;   // 黄金夹角数字放大
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = this.exact ? 4.5 : 3.2; ctx.strokeStyle = 'rgba(12,8,20,.9)';
    ctx.strokeText(this.v, this.x, this.y);
    ctx.fillStyle = this.exact ? '#ffd700' : '#d9d9d9';   // 黄金夹角金色，其余灰白
    ctx.fillText(this.v, this.x, this.y);
    ctx.restore();
  }
}
/* 金线：沿双方各自速度方向画出所在直线（贯穿全场，两线夹角即撞击夹角） */
class GoldenLines extends Effect {
  constructor(lines, exact) {
    super(); this.t = 0; this.life = 1.8; this.exact = exact;
    /* lines = [{x, y, dx, dy}]：双方【碰撞前一刻】的位置与速度方向，
       画出来的是"来路"所在直线，不是弹开后的去向。 */
    this.lines = lines;
  }
  update(dt) { this.t += dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const k = this.t / this.life;
    const L = 2000;                                   // 足够长以贯穿全场
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const ln of this.lines) {
      const n = Math.hypot(ln.dx, ln.dy) || 1;
      const ux = ln.dx / n, uy = ln.dy / n;
      ctx.globalAlpha = (1 - k) * 0.85;
      ctx.strokeStyle = this.exact ? '#ffd700' : '#d9d9d9';  // 黄金夹角金线，其余灰白
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ln.x - ux * L, ln.y - uy * L);
      ctx.lineTo(ln.x + ux * L, ln.y + uy * L);
      ctx.stroke();
    }
    ctx.restore();
  }
}
/* 黄金夹角爆发：金色扩散环 + 星芒粒子 + 「黄金夹角」大字 */
class GoldenBurst extends Effect {
  constructor(x, y) {
    super(); this.x = x; this.y = y; this.t = 0; this.life = 0.8;
    for (let i = 0; i < 26; i++) {
      world.effects.push(new Spark(x, y, { c: '#ffd700', s0: 160, s1: 420 }));
    }
    world.nums.push(new DmgNum(x, y - 44, '黄金夹角', 'gold'));
  }
  update(dt) { this.t += dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const k = this.t / this.life;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - k) * 0.9;
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4 * (1 - k * 0.7);
    ctx.beginPath(); ctx.arc(this.x, this.y, 12 + 120 * k, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - k) * 0.5;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, 6 + 74 * k, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}
class MechPerfect {
  constructor(u, p) { this.u = u; this.p = p; this.cd = 0; }
  update(dt) { if (this.cd > 0) this.cd -= dt; }
  onUnitHit(e, preSelf, preOther) {
    if (this.cd > 0 || !e || !e.alive || e.dying) return;
    /* ⚠ 【必须拦掉友方】。引擎的碰撞回调对"仆从（或余像分身）↔ 任何单位"这一对
       都会发，**友方也发**（队友也是实心的，见 stepPhysics 的单位×仆从碰撞段）。
       不拦的话：祭品召唤出来的完美打击会把自己主人当球撞着打
       —— 用户实测就是这个（"祭品被自己召唤的完美打击打了"）。 */
    if (e.team === this.u.team) return;
    this.cd = this.p.hitCd;
    /* 夹角用【碰撞前一刻】的速度方向（引擎在反射前抓好了，第三/四参数传入）。
       回调时的 dx/dy 已被引擎按碰撞法线反射成"弹开方向"，拿它画线画出来的是
       去向、看起来就是碰撞后的夹角（用户 2026-09-24 指正）。
       合成回调（如恶魔之手近战）不带 pre，退回当前方向。 */
    const s = preSelf || this.u, o = preOther || e;
    const sl = Math.hypot(s.dx, s.dy) || 1, ol = Math.hypot(o.dx, o.dy) || 1;
    const dot = clamp((s.dx / sl) * (o.dx / ol) + (s.dy / sl) * (o.dy / ol), -1, 1);
    const deg = Math.acos(dot) * 180 / Math.PI;
    const p = this.p;
    const exact = Math.abs(deg - p.gold) <= p.goldWin; // 误差 2.5° 内显示为 137.5°
    const mx = (this.u.x + e.x) / 2, my = (this.u.y + e.y) / 2;
    world.effects.push(new GoldenLines([
      { x: this.u.x, y: this.u.y, dx: s.dx, dy: s.dy },
      { x: e.x,     y: e.y,     dx: o.dx, dy: o.dy },
    ], exact));
    world.effects.push(new AnglePing(mx, my - 30, deg, exact));
    sfx('dagger_throw', 0.5, 1.35);                   // 每次相撞的清脆音效
    let dmg;
    if (exact) { dmg = p.dmgMax; world.effects.push(new GoldenBurst(mx, my)); sfx('victory', 0.35, 1.6); }
    /* 非黄金夹角：fallPow 次幂衰减、上限 capNon(250)。90° 垂直撞 ~50，0° 同向只有保底 6 */
    else dmg = Math.round(p.dmgMin + (p.capNon - p.dmgMin) * Math.pow(clamp(1 - Math.abs(deg - p.gold) / p.gold, 0, 1), p.fallPow));
    e.damage(dmg, 'hit', this.u);
    if (dmg >= 300) { world.shake = Math.max(world.shake, 9); sfx('heavy_attack', 0.9, 0.7); }
  }
}
MECHS.perfect = MechPerfect;

/* ---------- 7.6.2 劫掠 ---------- */
/* 劫掠变速突进的观感：脚下橙色椭圆环向外扩散淡出（贴地压扁的椭圆，随冲量衰减） */
class DashFx extends Effect {
  constructor(u, dur) { super(); this.u = u; this.t = 0; this.life = dur; }

  draw(ctx) {
    const k = this.t / this.life;

    ctx.translate(this.u.x, this.u.y);

/* 蓄力光环：劫掠（金色）/ 冲锋（橙红）共用的收束环 */
class ChargeGlow extends Effect {
  constructor(u, dur, c) { super(); this.u = u; this.t = 0; this.life = dur; this.c = c; }
  update(dt) { this.t += dt; if (this.t > this.life || !this.u.alive || this.u.dying) this.dead = true; }
  draw(ctx) {
    const k = this.t / this.life;
    ctx.save();

    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(this.u.x, this.u.y, lerp(60, 30, k), world.t * 6, world.t * 6 + 2.2); ctx.stroke();

/* 劫掠瞄准线：蓄力期间显示已锁定的突进方向 —— 橘红色矩形光带，末段渐隐；
   当前伤害越高越明显（更亮更粗），随蓄力进度收束。 */
class ChargeAim extends Effect {
  constructor(u, dx, dy, dur, c) {
    super(); this.u = u; this.dx = dx; this.dy = dy;
    this.t = 0; this.life = dur; this.c = c;
  }
  update(dt) { this.t += dt; if (this.t > this.life || !this.u.alive || this.u.dying) this.dead = true; }
  draw(ctx) {
    const k = this.t / this.life;
    const m = this.u.mech, p = m ? m.p : null;
    const base = p ? p.dmg : 40;
    const dmg = m ? m.dmg : base;
    /* 伤害越高越明显：40 → 基准；每叠一层 +40 就更亮更粗，200+ 封顶 */
    const f = clamp((dmg - base) / (base * 4), 0, 1);
    const alpha = (0.34 + 0.3 * f) * (0.75 + 0.25 * Math.sin(world.t * 14));
    const w = 9 + 7 * f;                             // 矩形宽度
    const n = Math.hypot(this.dx, this.dy) || 1;
    const ux = this.dx / n, uy = this.dy / n;
    const x = this.u.x, y = this.u.y;
    const L = lerp(560, 380, k);                     // 长度随蓄力收束
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(uy, ux));
    /* 矩形光带：起点本体附近，末段 40% 渐隐到透明 */
    const g = ctx.createLinearGradient(46, 0, L, 0);
    g.addColorStop(0, 'rgba(255,92,46,0)');
    g.addColorStop(0.12, 'rgba(255,92,46,' + alpha.toFixed(3) + ')');
    g.addColorStop(0.6, 'rgba(255,92,46,' + (alpha * 0.85).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,92,46,0)');
    ctx.fillStyle = g;
    ctx.fillRect(46, -w / 2, L - 46, w);
    /* 中芯亮条（同样末段渐隐），伤害高时更宽 */
    const g2 = ctx.createLinearGradient(46, 0, L, 0);
    const ca = Math.min(1, alpha + 0.25 + 0.3 * f);
    g2.addColorStop(0, 'rgba(255,190,150,0)');
    g2.addColorStop(0.15, 'rgba(255,190,150,' + (ca * 0.8).toFixed(3) + ')');
    g2.addColorStop(0.7, 'rgba(255,190,150,' + (ca * 0.35).toFixed(3) + ')');
    g2.addColorStop(1, 'rgba(255,190,150,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(46, -w * 0.22, L - 46, w * 0.44);
    ctx.restore();
  }
}
class MechPillage {
  constructor(u, p) {
    this.u = u; this.p = p; this.state = 'idle'; this.cd = p.first;
    this.dmg = p.dmg; this.timer = 0; this.dirx = 1; this.diry = 0;
    this.combo = 0;                                 // 连段数：每次命中 +1，前摇随之 +0.4s
  }
  update(dt) {
    const u = this.u, p = this.p;
    this.ghost = this.state === 'charge';          // 蓄力期间为「幽灵」：敌人可穿过，突进时恢复正常碰撞
    if (this.state === 'idle') {

    } else if (this.state === 'charge') {

         冲量 760 全程积分 ≈ 330px，配合常速部分总位移 ~550px。 */
      u.dx = this.dirx; u.dy = this.diry;

    this.state = 'charge';
    this.timer = this.chargeTime();
    /* 方向在蓄力前确定：瞄当前敌人位置（蓄力期间方向不变，出膛直线突进） */
    const e = world.enemyOf(this.u);
    if (e && e.alive && !e.dying) {
      const L = Math.hypot(e.x - this.u.x, e.y - this.u.y) || 1;
      this.dirx = (e.x - this.u.x) / L; this.diry = (e.y - this.u.y) / L;
    }

    world.effects.push(new ChargeAim(this.u, this.dirx, this.diry, this.timer, '#ffb054'));
    sfx('lightning_orb_channel', 0.55, 0.72);
  }
  startDash() {
    this.state = 'dash'; this.timer = this.p.dashT;

       spdCap —— 否则峰值会被全局 700 钳住，冲量加再多也看不出"更快"。 */
    this.u.spdCap = this.p.spdCap;
    this.u.boost = Math.max(this.u.boost, this.p.dashImpulse);
    world.effects.push(new DashFx(this.u, this.p.dashT));
    sfx('dagger_throw', 0.9, 0.6);
    burst(this.u.x, this.u.y, 18, { c: '#ffb054', s0: 80, s1: 300 });
  }
  miss() {
    this.u.baseSpeed = this.u.card.speed;          // 突进结束恢复常速基底
    this.u.spdCap = undefined;                     // 交还速度上限（回到全局 700）
    this.state = 'idle'; this.cd = this.p.missCd; this.dmg = this.p.dmg;
    this.combo = 0;                                // 落空 → 连段清零，下次回到初始前摇
  }
  onWallHit() {
    /* 撞墙 = 突进立刻中断进冷却（不必等 dashT 跑完） */
    if (this.state === 'dash') this.miss();
  }
  onUnitHit(e) {
    if (this.state !== 'dash' || !e || !e.alive || e.dying) return;

       （引擎的碰撞回调对友方也会发 —— 见 stepPhysics 的约定）。 */
    if (e.team === this.u.team) return;
    e.damage(this.dmg, 'hit', this.u);
    e.knock(this.dirx, this.diry, this.p.knock, this.p.knockCap);
    world.shake = Math.max(world.shake, 8);
    burst(e.x, e.y, 16, { c: '#ffb054', s0: 90, s1: 300 });
    sfx('heavy_attack', 0.85, 0.9);
    this.dmg += this.p.step;                       // 命中 → 下一击叠加
    this.combo++;                                  // 连段 +1 → 下次前摇更长
    /* 【连段之间插入固定冷却】原来是命中后立刻再蓄力；现在先交还速度上限、
       歇 comboCd 秒（走 idle 的 cd），再开始下一轮"蓄力 → 突进"。 */
    this.u.baseSpeed = this.u.card.speed;

  statusText() { return null; }
}
MECHS.pillage = MechPillage;

/* ---------- 7.6.3 暴露 ---------- */
class Beam extends Effect {
  /* 静态几何：发射瞬间算好 4 段折线（无反弹/1/2/3 反弹），持续 3 秒逐段独立判定 */
  constructor(owner, x, y, ang, p) {
    super();
    this.o = owner; this.p = p; this.t = 0; this.life = p.dur;
    this.acc = [0, 0, 0, 0];
    /* dealt：这一炮打出的总伤害（所有段 × 所有敌方单位的实际扣血合计）。
       settled：只结算一次的保险（光束消散 / 主人阵亡都会走到结算）。 */
    this.dealt = 0; this.settled = false;
    const m = 6;                                    // 与场地边框一致的反弹余量
    /* 逐段推进：每段找到撞墙点 → 记下线段 → v' = v - 2(v·n)n 反射进下一段 */
    let px = x, py = y, ux = Math.cos(ang), uy = Math.sin(ang);
    this.segs = [];
    for (let i = 0; i < 4; i++) {
      let tMin = Infinity, nrx = 0, nry = 0;
      if (ux > 0) { const t = (CFG.AW - m - px) / ux; if (t > 0 && t < tMin) { tMin = t; nrx = -1; nry = 0; } }
      if (ux < 0) { const t = (m - px) / ux; if (t > 0 && t < tMin) { tMin = t; nrx = 1; nry = 0; } }
      if (uy > 0) { const t = (CFG.AH - m - py) / uy; if (t > 0 && t < tMin) { tMin = t; nrx = 0; nry = -1; } }
      if (uy < 0) { const t = (m - py) / uy; if (t > 0 && t < tMin) { tMin = t; nrx = 0; nry = 1; } }
      if (!isFinite(tMin)) tMin = 100;
      const bx = px + ux * tMin, by = py + uy * tMin;
      this.segs.push({
        ax: px, ay: py, bx, by, bounces: i,
        dmg: i === 0 ? p.dmgNoBounce : (i === 1 ? p.dmgBounce1 : (i === 2 ? p.dmgBounce2 : p.dmgBounce3))
      });
      px = bx; py = by;
      const dot = ux * nrx + uy * nry;
      ux -= 2 * dot * nrx; uy -= 2 * dot * nry;
    }
    sfx('lightning_orb_channel', 0.9, 0.6);
  }
  /* 光束落幕（自然消散 or 主人阵亡）：把这次的【总伤害】报给主人的机制。
     暴露靠它判断"这一炮是不是打空了" → 打空了就把下次冷却砍掉一截。 */

  update(dt) {

    const es = world.enemiesOf(this.o);
    if (!es.length) return;
    /* 每段独立 5Hz 判定：光束上的【每个】敌方单位（本体+仆从）都吃该段伤害；
       只有前两段（无反弹/1 反弹）附加 1 层易伤，后两段只造成伤害。 */
    for (let i = 0; i < 4; i++) {

        this.acc[i] -= 1;
        for (const e of es) {
          if (segDist(e.x, e.y, s.ax, s.ay, s.bx, s.by) < CFG.R) {
            this.dealt += e.damage(s.dmg, 'light', this.o) || 0;
            if (i < 2) e.vuln++;
            e.slowT = Math.max(e.slowT, 0.3);   // 被光束照射：减速 30%（持续刷新，离开后 0.3s 恢复）
            burst(e.x + vrand(-16, 16, 'vrand'), e.y + vrand(-16, 16, 'vrand'), 3, { c: '#ffe9a8', s0: 30, s1: 130 });
          }
        }
      }
    }
  }
  draw(ctx) {
    const k = this.t / this.life;
    const fade = clamp(Math.min(this.t * 6, (1 - k) * 5), 0, 1);
    const im = IMG['sp_beam_line'];
    ctx.save();

    for (const s of this.segs) {
      const L = Math.hypot(s.bx - s.ax, s.by - s.ay);
      if (L < 2) continue;
      const a = Math.atan2(s.by - s.ay, s.bx - s.ax);

      /* 每多反弹一次【明显】更透明：alpha × (1 - 0.25 × 反弹数)，下限 0.30。
         （2026-09-23 用户要求"每次反射应该增加更多透明度"，原来 0.14 / 下限 0.45
          太温和，肉眼看不出段与段的差别；现在 4 段是 100% → 75% → 50% → 30%。） */
      const bA = Math.max(0.30, 1 - 0.25 * s.bounces);

      ctx.strokeStyle = glow + '0.35)'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();

      if (s.bounces > 0) {
        ctx.globalAlpha = fade * (0.5 + 0.4 * Math.sin(world.t * 20)) * bA;
        ctx.fillStyle = '#fff2c8';
        ctx.beginPath(); ctx.arc(s.ax, s.ay, 6, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
}
class MechExpose {
  constructor(u, p) { this.u = u; this.p = p; this.cd = p.first; }

     冷却不会被砍成负数（砍到 0 就是立刻再放一炮）。
     注：冷却从【发射那一刻】就在倒数，所以这 1.8 秒是从剩余冷却里扣的；

/* ---------- 7.6.4 冲锋（召唤仆从） ---------- */
/* 仆从大脑。【没有状态机、不接管移动】—— 这是 2026-09-23 的"完全重构"：
   仆从就是一个普通单位：以 CFG.SPEED 漂移、撞墙反弹、和别人按体积弹开，
   和场上任何一张卡的行为一致（AI 再也不碰 baseSpeed / dx / dy 的常态）。
   它唯一多做的一件事：
     索敌范围内看到敌人（且冷却好了、当前没有正在冲撞）→ 朝它加一发【冲撞速度】。
   这一发速度由引擎每帧统一衰减（boost *= exp(-dt*1.4)）；撞上之后反弹又加一段。
   两笔都耗完（boost ≤ ramEnd）= "这一下冲撞结束了"，又变回普通单位。
   所以本类里【没有任何计时器去维持某个状态】—— 冲撞的结束时刻完全由物理速度决定。
   伤害：只有"冲撞速度还在"（this.ram）时撞到敌人才结算，且一次冲撞只打一下。 */
class MinionBrain {
  constructor(m, p) {
    this.m = m; this.p = p;
    this.cd = 0;          // 冲撞冷却（秒），从"冲撞开始"计时
    this.ram = false;     // 冲撞速度（含撞击反弹）是否还没耗完
    this.hit = false;     // 这一次冲撞是否已经打出过伤害（一次冲撞只打一下）
  }
  /* 【本体血量 → 仆从加成】本体已损失生命的比例（满血 0，濒死 1）。
     每次发起冲撞 / 结算伤害时实时读取，本体掉血立刻生效。 */
  curBonus() { const o = this.m.o; return 1 - Math.max(0, o.hp) / o.maxHp; }
  /* 当前一击的伤害：满血 = mDmg = 35，本体濒死最高 ×(1+dmgBonus) = ×2 = 70。
      【上限 +100%】（2026-09-23 用户要求"自身血量降低最多令仆从增加100%伤害"，
      此前是 +60% = 濒死 56）—— 加成仍按"已损失生命比例"线性插值，只是倍率上限翻倍。
     【取整】（2026-09-23 用户要求"不要有小数"）—— 四舍五入到整数点。 */
  curDmg() { return Math.round(this.p.mDmg * (1 + this.p.dmgBonus * this.curBonus())); }
  /* 当前冲撞冷却：满血 = ramCd，本体濒死最低 ramCd - cdCut = 1.5s。
     【取整到 0.1s】（用户要求"不要有小数"）—— 冷却本身就有 2.1/1.5 这类一位小数，
     按血量浮动时四舍五入到 0.1s，不会出现 1.743s 这种毛刺。 */
  curCd() { return Math.round((this.p.ramCd - this.p.cdCut * this.curBonus()) * 10) / 10; }
  update(dt) {
    const m = this.m, p = this.p;
    /* 主人阵亡 → 仆从消散。
       【例外】holdAfterOwner = 祭品召唤出来的友军：本体死后它仍继续作战
       （用户明确要求），所以这种情况下不跟着陪葬。 */
    if ((!m.o.alive || m.o.dying) && !m.holdAfterOwner) { if (!m.dying) m.kill(); return; }
    if (this.cd > 0) this.cd -= dt;
    /* 冲撞速度耗完 → 结束"冲撞中"，恢复正常行动。
       判据直接用 boost：冲撞和反弹这两笔速度都只加在 boost 上，引擎每帧都在替
       所有单位衰减 boost，所以 boost 掉回阈值以下就等于"这一下的速度用完了" ——
       不需要任何计时器，也不需要单独记"还剩多少秒"。 */
    if (this.ram && m.boost <= p.ramEnd) this.ram = false;
    if (this.ram || this.cd > 0) return;            // 冲撞中 / 冷却中：不发起新的冲撞
    const e = world.enemyOf(m);
    if (!e || e.dying) return;
    const d = Math.hypot(e.x - m.x, e.y - m.y);
    if (d > p.senseR) return;                       // 索敌范围内才有反应
    const L = d || 1;
    m.dx = (e.x - m.x) / L; m.dy = (e.y - m.y) / L; // 朝敌人
    m.pushBoost(p.ramSpd, p.ramSpdCap);             // 加一发冲撞速度，之后完全交给物理
    /* 冷却按本体已损失生命缩短（最多 cdCut = 0.6s）——
       ⚠ 一定要走 curCd()：直接写 p.ramCd 会让"血量越低冲撞越密"整条加成静默失效。 */
    this.ram = true; this.hit = false; this.cd = this.curCd();
    sfx('dagger_throw', 0.6, 0.8);
  }
  /* 冲撞命中改走引擎的碰撞回调（仆从有实体体积，引擎撞上就会调这里）：
     "冲撞中"命中 → 敌人吃撞击伤害；仆从之间互不伤害。 */
  onUnitHit(e) {
    const m = this.m, p = this.p;
    if (!e || !e.alive || e.dying || e.minion) return;
    /* 友方（自家本体、同伴仆从）现在也会物理相撞了（见引擎的单位×仆从碰撞段），
       但那只该是"挤开"，绝不能结算撞击伤害 —— 这里按队伍拦掉。 */
    if (e.team === m.team) return;

    if (e.team === this.u.team) return;

MECHS.snakebite = MechSnakebite;

/* ---------- 7.6.8 引导之星 ---------- */
/* 辉星配色 = 杀戮尖塔 2 原版的淡蓝。
   出处：反编译 pck-extracted/scenes/vfx/star_gain_vfx.tscn —— 两颗星粒子的
   ParticleProcessMaterial.color = Color(0.77, 0.931, 1) → #c4edff
   （另一颗是 0.592 透明度的同一色）。
   原版星星贴图是纯白 + modulate 上色，所以这里也用 tintTex 给 sp_star_small 染同色，
   而不是只改拖尾 —— 只改拖尾的话辉星本体还是白的。 */
const GU_STAR = '#c4edff';
class Star extends Effect {
  constructor(owner, x, y, delay, p, dir) {
    super();
    this.o = owner; this.p = p;
    this.x = x; this.y = y; this.delay = delay; this.life = 0;
    this.spin = vrand(2, 5, 'vrand');
    this.dir = dir || 1;                       // 螺旋绕向：每波统一（由 MechGuiding 掷定）
    this.hitMinions = new Set();               // 已穿过的仆从（弹幕穿过，同一发只打一次）
  }
  update(dt) {
    if (this.delay > 0) { this.delay -= dt; return; }
    this.life += dt;
    const o = this.o;
    if (!o.alive || o.dying) { this.dead = true; return; }
    /* 螺旋逼近：绕本体边旋转边收半径（半径按 spd 缩短） */
    if (this.r === undefined) {
      this.r = Math.hypot(o.x - this.x, o.y - this.y) || 1;
      this.ang = Math.atan2(this.y - o.y, this.x - o.x);
    }
    const ox = this.x, oy = this.y;
    this.ang += this.dir * 1.5 * dt;           // 螺旋幅度削弱（角速度 2.6 -> 1.5）
    this.r = Math.max(0, this.r - this.p.spd * dt);
    this.x = o.x + Math.cos(this.ang) * this.r;
    this.y = o.y + Math.sin(this.ang) * this.r;
    /* 拖尾光点粒子：沿飞行反方向散开 */
    const tvx = this.x - ox, tvy = this.y - oy;
    const tl = Math.hypot(tvx, tvy) || 1;
    this.trailT = (this.trailT || 0) - dt;
    if (this.trailT <= 0) {
      this.trailT = 0.045;
      for (let i = 0; i < 2; i++) {
        const sp = new Spark(this.x, this.y, { c: '#ffe9a8', s0: 8, s1: 40 });
        sp.vx = -tvx / tl * vrand(50, 150, 'vrand') + vrand(-30, 30, 'vrand');
        sp.vy = -tvy / tl * vrand(50, 150, 'vrand') + vrand(-30, 30, 'vrand');
        sp.life = vrand(0.25, 0.5, 'vrand');
        world.effects.push(sp);
      }
    }
    /* 撞到敌人：对【每个】撞到的敌方单位（本体+仆从）结算，撞到谁都算。
       命中不再产生任何"额外召唤"（2026-09-23 用户要求删除"每命中一颗辉星多召唤一颗"，
       每波的辉星数现在恒为 p.n）。 */
    for (const e of world.enemiesOf(o)) {
      if (Math.hypot(e.x - this.x, e.y - this.y) < CFG.R + 12) {
        /* 【弹幕穿过仆从】先查再打：同一发对同一个仆从只结算一次。
           （原先伤害写在去重检查之前，重叠的每一帧都会重复结算。） */
        if (e.minion) {
          if (this.hitMinions.has(e)) continue;
          this.hitMinions.add(e);
        }
        e.damage(this.p.dmg, 'light', o);
        burst(this.x, this.y, 10, { c: GU_STAR, s0: 70, s1: 260 });
        sfx('lightning_orb_evoke', 0.6, 1.5);
        if (e.minion) continue;                  // 穿过仆从：继续飞（照旧算 1 次命中充能）
        this.dead = true; break;
      }
    }
    if (this.dead) return;
    /* 半径收进脚下：回到本体，回复生命 */
    if (this.r < CFG.R * 0.8) {
      o.heal(this.p.heal);
      burst(o.x, o.y, 8, { c: '#ffe9a8', s0: 40, s1: 160 });
      sfx('card_smith', 0.4, 1.7);
      this.dead = true; return;
    }
    if (this.life > 10) this.dead = true;
  }
  draw(ctx) {
    if (this.delay > 0) return;
    /* 贴图用原版淡蓝染色（等价 Godot 的 modulate，见 GU_STAR 注释） */
    const im = tintTex('sp_star_small', GU_STAR) || IMG['sp_star_small'];
    const s = 80 + 10 * Math.sin(world.t * 9 + this.spin);
    ctx.save();
    if (im) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(world.t * this.spin);
      ctx.globalCompositeOperation = 'lighter';   // 原版加法混合：暗部不显示
      ctx.drawImage(im, -s / 2, -s / 2, s, s);
      ctx.restore();
    }
  }
}
class MechGuiding {
  constructor(u, p) { this.u = u; this.p = p; this.cd = p.first; }

      /* 每波恒为 p.n 颗（原先按上一波的命中数追加，已按用户要求删除） */
      for (let i = 0; i < this.p.n; i++) {

        const a = rand(0, TAU);

        world.effects.push(new Star(this.u, cx, cy, rand(0, this.p.delayMax), this.p, waveDir));
      }
      sfx('lightning_orb_channel', 0.7, 1.5);
      world.effects.push(new Ring(this.u.x, this.u.y, 20, 70, 0.5, GU_STAR, 3));

  statusText() { return null; }

  getGrowth() { return { starDmg: this.p.dmg }; }
  applyGrowth(g) { }

MECHS.guiding = MechGuiding;

/* ---------- 7.6.9 违逆 ---------- */
class Shockwave extends Effect {
  constructor(x, y, owner, p) {
    super();
    this.x = x; this.y = y; this.o = owner; this.p = p;
    this.t = 0; this.life = 0.4; this.hitSet = new Set();
  }
  update(dt) {
    this.t += dt;
    if (this.t > this.life) { this.dead = true; return; }
    const k = this.t / this.life;
    const r = this.p.radius * Math.sqrt(k);          // 冲击波前沿
    /* 半径内的【每个】敌方单位（本体+仆从）各吃一次伤害+虚弱，互不挤占 */
    for (const e of world.enemiesOf(this.o)) {
      if (this.hitSet.has(e)) continue;
      const d = Math.hypot(e.x - this.x, e.y - this.y);
      if (d < r) {
        this.hitSet.add(e);
        const dmg = Math.round(lerp(this.p.dmgNear, this.p.dmgFar, clamp(d / this.p.radius, 0, 1)));
        e.damage(dmg, 'hit', this.o);
        e.weak += this.p.weak;
        e.slamT = this.p.slamT;                      // 摔击窗口：撞墙按速度吃伤害
        e.slamMin = this.p.slamMin; e.slamMax = this.p.slamMax;
        const L = d || 1;
        e.knock((e.x - this.x) / L, (e.y - this.y) / L, this.p.knock, this.p.knockCap);
        world.nums.push(new DmgNum(e.x, e.y - 46, '虚弱+' + this.p.weak, 'info'));
        sfx('heavy_attack', 1.0, 0.75);
      }
    }
  }
  draw(ctx) {
    const k = this.t / this.life;
    const r = this.p.radius * Math.sqrt(k);
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.9;
    ctx.strokeStyle = '#ff9ac8'; ctx.lineWidth = 5 * (1 - k * 0.6);
    ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - k) * 0.4;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, r * 0.8, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}
class MechDefy {
  constructor(u, p) { this.u = u; this.p = p; this.cd = 0; }
  update(dt) { if (this.cd > 0) this.cd -= dt; }

}
MECHS.defy = MechDefy;

/* ---------- 7.6.10 引雷针 ---------- */
class Bolt extends Effect {
  constructor(x, y) {
    super(); this.x = x; this.y = y; this.t = 0; this.life = 0.3;
    world.shake = Math.max(world.shake, 6);
    burst(x, y, 14, { c: '#bff0ff', s0: 100, s1: 360 });
  }
  update(dt) { this.t += dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const k = 1 - this.t / this.life;
    const im = IMG['sp_lightning_strike'];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (im) {
      /* 雷击贴图：从画面顶劈到目标点 */

      const h = this.y - top, w = h * (im.naturalWidth / im.naturalHeight);
      ctx.globalAlpha = k;
      ctx.drawImage(im, this.x - w / 2, top, w, h);
    }
    /* 落点闪光 */
    ctx.globalAlpha = k * 0.9;
    ctx.fillStyle = '#e8f8ff';
    ctx.beginPath(); ctx.arc(this.x, this.y, 16 * k + 5, 0, TAU); ctx.fill();
    ctx.globalAlpha = k * 0.6;
    ctx.strokeStyle = '#bff0ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(this.x, this.y, 30 * (1 - k) + 8, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}
class MechRod {
  constructor(u, p) { this.u = u; this.p = p; this.cd = p.first; }
  interval() {
    const f = this.u.focus;
    return rand(Math.max(this.p.ivFloor, this.p.ivMin - this.p.ivPerFocus * f),
      Math.max(this.p.ivFloor + 0.2, this.p.ivMax - this.p.ivPerFocus * f));
  }
  update(dt) {
    this.cd -= dt;
    if (this.cd <= 0) {
      this.cd = this.interval();
      /* 落雷目标：**只从「自己 + 敌方」里挑，绝不选中友军**（用户 2026 口径）。
         ⚠【自己不算友军】—— 自劈是这张卡的机制（+集中、回血），照旧保留；
           "友军"指的是同队的其它单位（比如祭品这个主人、同伴召唤物）。
         ——祭品会把引雷针当友军召出来，劈到主人就变成"自己人打自己人"。
         另外灵魂（不可被索敌的一次性衍生物）也不选，免得白劈一发。
         选定规则：劈「场上更上方」的单位（y 更小）；同高时优先劈敌人，
         只有场上没有更靠上的敌人时才劈自己。 */
      let tgt = null;
      for (const o of world.units) {
        if (!o.alive || o.dying || o.finished) continue;
        if (o.soul) continue;                              // 灵魂不是可索敌目标
        if (o !== this.u && o.team === this.u.team) continue;   // 友军一律不选
        if (!tgt) { tgt = o; continue; }
        if (o.y < tgt.y) tgt = o;
        else if (o.y === tgt.y && o !== this.u && tgt === this.u) tgt = o;   // 同高：敌人优先
      }
      if (!tgt) return;
      world.effects.push(new Bolt(tgt.x, tgt.y));
      if (tgt === this.u) {
        this.u.focus += this.p.selfFocus;   // 自劈 +2 集中，层数只由状态徽标展示，不飘文字
        this.u.heal(16);                    // 自己被雷劈中回复 16 点生命
        sfx('lightning_orb_evoke', 0.7, 0.7);
      } else {
        tgt.damage(this.p.dmg + this.p.dmgPerFocus * this.u.focus, 'light', this.u);
        sfx('lightning_orb_evoke', 0.9, 1.1);
      }
    }
  }
  /* 集中层数由头顶的状态徽标（pw_focus 图标+数字）展示，不再重复出文字 */
  statusText() { return null; }
  /* 成长进度继承：集中层数（引雷针唯一的累积量；本体字段的携带由 setCarry 兜） */
  getGrowth() { return { focus: this.u.focus }; }
  applyGrowth(g) { if (g && g.focus) this.u.focus = Math.max(this.u.focus, g.focus); }
}
MECHS.rod = MechRod;

/* ============================================================
   7.7 原测试版五卡（祭品 / 余像 / 追踪之刃 / 灵魂风暴 / 陨石打击）
   ------------------------------------------------------------
   五张已于 2026-09-30 转正，正常出现在选卡界面（test 标记摘除、设置开关暂时隐藏）。
   其中「祭品」会把场上的卡牌当友军召唤出来，所以需要两个通用约定：

   ① MECHS.none —— 占位机制。
      祭品随机召来的卡牌里，有些还没写机制（或以后新增的卡漏了 mech），
      Unit 构造器必须拿到一个东西，否则 stepPhysics 里 u.mech.update() 会直接崩。
      这个占位类什么都不做，只保证"这张卡就是一颗普通弹球"。

   ② 成长进度继承 —— Unit.prototype.getGrowth() / applyGrowth()。
      祭品重复召唤同一张卡时，要"继承上次死亡时的成长进度"。
      进度只在【两个地方】产生：
        · 本体随身积累的数值（君王之剑伤害、暗黑球伤害、辉星伤害、集中层数…）
          -> 由各机制的 getGrowth/applyGrowth 提供；
        · 直接写在本体字段上的状态（毒素、灾厄、易伤…）
          -> 由基类默认实现兜住。
      召唤物死亡时把它挂回 owner.mech.growth[cardId]，下次再召同一张卡就灌回去。
   ============================================================ */

/* ---------- 通用：占位机制 / 成长继承 / 分身受击 / 屏幕白线 ---------- */
class MechNone {
  constructor(u, p) { this.u = u; this.p = p; }
  update(dt) { }
  statusText() { return null; }
}
MECHS.none = MechNone;

/* 本体可以随"死亡→再召唤"带走的随身成长值。
   各机制自己声明 getGrowth/applyGrowth（见 7.3 锻打成型、7.6.6 漆黑、
   7.6.8 引导之星、7.6.10 引雷针）；没声明的就只带走下面的 getCarry。
   【注意】不要把这些写成 Unit.prototype 上的同名方法 ——
   那会盖住机制实例自己的 getGrowth，继承就永远拿不到东西。 */
/* 基类兜底：直接写在本体字段上的状态。 */
Unit.prototype.getCarry = function () {
  return { doom: this.doom, poison: this.poison, vuln: this.vuln, weak: this.weak, focus: this.focus };
};
Unit.prototype.setCarry = function (c) {
  if (!c) return;
  this.doom = c.doom || 0; this.poison = c.poison || 0;
  this.vuln = c.vuln || 0; this.weak = c.weak || 0; this.focus = c.focus || 0;
};
/* 新单位登场钩子：stepPhysics 在它进 world.units 后的第一次更新时调一次。
   子类用它把召唤瞬间的朝向/成长值补齐。 */
Unit.prototype.onSpawn = function () { };

/* 敌人打中"余像的分身" → 分身碎裂。
   现在分身是真正的 Unit（会被敌人索敌、会被物理碰撞），绝大多数命中都会自然
   走到 ReplicaUnit.damage()；这个函数是给【不经过 damage()】的那几种攻击兜底
   （灾厄斩杀走 killByDoom；电球的环绕灼烧直接扣 hp，它在 Orb.update 里就地
   处理分身/灵魂，不走这里）。
   必须幂等：同一帧里多枚弹幕同时压上来，只能碎一次。 */
function cloneHitBy(e) {
  if (!e) return;
  for (const c of world.units) {
    if (!c.replica || c.dying || c.cDispersed) continue;
    if (c.team === e.team) continue;
    if (Math.hypot(c.x - e.x, c.y - e.y) > CFG.R * 2) continue;
    c.disperse(e, false);
  }
}
/* 贯穿屏幕的斩击白线（余像分身碎裂的表现）。
   画在分身位置、沿给定角度向两端各延伸 1400px —— 场地只有 660，必定贯穿整屏。
   角度【由调用方给死】：余像传的是"分身被击中时的位置 → 敌方本体位置"这条直线
   （用户 2026 口径，不再随机取角），所以伤害判定也顺着这条线扫（见 disperse）。 */
class WhitePierce extends Effect {
  /* ang 不给才随机（纯观感兜底）；正常情况一定给 ——
     余像的斩击现在固定是"分身位置 ↔ 敌方本体位置"的直线。 */
  constructor(x, y, ang) {
    super();
    this.x = x; this.y = y;
    this.ang = (ang === undefined || ang === null) ? vrand(0, Math.PI, 'vrand') : ang;
    this.t = 0; this.life = 0.42;
    world.shake = Math.max(world.shake, 10);
  }
  update(dt) { this.t += dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const k = clamp(this.t / this.life, 0, 1);
    const a = (1 - k) * (1 - k), L = 1400;
    const ux = Math.cos(this.ang), uy = Math.sin(this.ang);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const w = 9 * (1 - k * 0.75) + 1.5;
    const g = ctx.createLinearGradient(this.x - ux * L, this.y - uy * L, this.x + ux * L, this.y + uy * L);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.42, 'rgba(255,255,255,' + (0.85 * a).toFixed(3) + ')');
    g.addColorStop(0.5, 'rgba(255,255,255,' + a.toFixed(3) + ')');
    g.addColorStop(0.58, 'rgba(255,255,255,' + (0.85 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x - ux * L, this.y - uy * L);
    ctx.lineTo(this.x + ux * L, this.y + uy * L);
    ctx.stroke();
    ctx.restore();
  }
}

/* ============================================================
   7.7.1 祭品 —— 献祭生命召唤随机友军
   ============================================================ */
/* 五角星暗红法阵：法阵半径之外的星尖 + 内接五边形 + 两层暗红光环。
   纯程序绘制（反编译里没有对应精灵，已按前几轮约定"无精灵者程序生成"）。 */
class Pentagram extends Effect {
  constructor(x, y, dur) {
    super();
    this.x = x; this.y = y; this.t = 0; this.life = dur; this.drawUnder = true;
  }
  update(dt) { this.t += dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const k = clamp(this.t / this.life, 0, 1);
    const grow = clamp(this.t * 3.2, 0, 1);            // 展开动画
    const fade = clamp((1 - k) * 3.2, 0, 1);           // 收尾淡出
    const R = 128 * (0.6 + 0.4 * grow);
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(this.x, this.y);
    ctx.rotate(world.t * 0.35);
    ctx.globalCompositeOperation = 'lighter';
    /* 底光：暗红径向渐晕 */
    const g = ctx.createRadialGradient(0, 0, R * 0.08, 0, 0, R * 1.25);
    g.addColorStop(0, 'rgba(150,18,26,.34)');
    g.addColorStop(0.62, 'rgba(96,8,16,.20)');
    g.addColorStop(1, 'rgba(60,0,8,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.25, 0, TAU); ctx.fill();
    /* 五角星：隔点连线（0→2→4→1→3→0），正是倒五芒的暗红法阵 */
    ctx.strokeStyle = 'rgba(255,54,64,.92)';
    ctx.lineWidth = 3.4;
    ctx.shadowColor = 'rgba(255,40,50,.9)'; ctx.shadowBlur = 14;
    ctx.beginPath();
    for (let i = 0; i <= 5; i++) {
      const a = -Math.PI / 2 + (i * 2 % 5) * TAU / 5;
      const px = Math.cos(a) * R, py = Math.sin(a) * R;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
    /* 外接圆（两圈：实线 + 呼吸虚线） */
    ctx.lineWidth = 2.4; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
    ctx.globalAlpha = fade * (0.45 + 0.35 * Math.sin(world.t * 6));
    ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.arc(0, 0, R * 1.12, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    /* 中心一个正在"点亮"的暗红核心：越接近召唤完成越亮 */
    ctx.globalAlpha = fade * (0.2 + 0.6 * k);
    const c = ctx.createRadialGradient(0, 0, 2, 0, 0, R * 0.5);
    c.addColorStop(0, 'rgba(255,120,110,.85)');
    c.addColorStop(0.5, 'rgba(190,24,32,.42)');
    c.addColorStop(1, 'rgba(120,0,10,0)');
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

class MechOffering {
  constructor(u, p) {
    this.u = u; this.p = p;
    this.state = 'idle'; this.cd = p.first; this.timer = 0;
    /* 本次布阵已经扣过几次血（按"下发次数"计数，见 update 里的献祭扣血段） */
    this.tickDone = 0;
    this.marker = null;
    /* 本体阵亡后，法阵与召唤流程一起停下（召唤物仍按自己的规则留在场上） */
    this.dead = false;
  }
  /* 场上是否已经有自己召出来的召唤物（存活中） */
  hasFoe() {
    return world.units.some(o => o.summoned && o.o === this.u && o.alive && !o.dying && !o.finished);
  }
  update(dt) {
    const u = this.u, p = this.p;
    if (!u.alive || u.dying || this.dead) return;
    if (this.state === 'idle') {
      /* 【有召唤物时不布阵】——用户明确要求：已有召唤物就不该展开法阵消耗生命。
         冷却也一并【冻结】（不趁这段时间偷偷攒好），
         等召唤物阵亡后才从 gapMin/gapMax 重新开始计时。 */
      if (this.hasFoe()) { this.cd = rand(p.gapMin, p.gapMax); return; }
      if (u.grabbed > 0) return;                       // 被拎着时不布阵
      this.cd -= dt;
      if (this.cd <= 0) {
        this.state = 'cast'; this.timer = p.castT; this.tickDone = 0;
        const f = new Pentagram(u.x, u.y, p.castT);
        world.effects.push(f); this.marker = f;
        sfx('dark_orb_channel', 0.85, 0.72);
        world.nums.push(new DmgNum(u.x, u.y - 58, '祭品', 'info'));
      }
      return;
    }
    /* 布阵：原地静止 3 秒（freeze 每帧续期，和冲锋/电流相生的蓄力同一套写法） */
    u.freeze = Math.max(u.freeze, 0.05);
    if (this.marker && !this.marker.dead) { this.marker.x = u.x; this.marker.y = u.y; }
    this.timer -= dt;
    /* 献祭扣血：整个 castT 期间【一共 tickRate × castT 次】、每次 hpLoss 点
       （用户 2026 口径："每秒失去 6 次 6 点生命"，3 秒 = 18 次 = 108 点）。
       ⚠ 这里必须用"按下发次数补齐"的写法，不能用原来的 `acc += dt × rate` 累加器：
       倒计时和累加器是两个独立的浮点累加，最后一帧 timer 先归零、acc 还差一点点
       （实测 3 秒只扣了 17 次 = 102 点），"每秒 N 次"就永远少一次。
       现在按下发次数 done 和"应该发生的次数" floor(已过时间 × rate) 对齐：
       每个物理步最多补一次，既不会因为 120Hz 的浮点步长挤掉，也不会重复扣。 */
    const elapsed = clamp(p.castT - Math.max(0, this.timer), 0, p.castT);
    const want = Math.floor(elapsed * p.tickRate + 1e-9);   // elapsed 已夹在 [0, castT]
    while (this.tickDone < want) {
      this.tickDone += 1;
      u.loseHp(p.hpLoss);
      burst(u.x + vrand(-22, 22, 'vrand'), u.y + vrand(-24, 24, 'vrand'), 4,
            { c: '#ff5a5a', s0: 40, s1: 170 });
      if (!u.alive || u.dying) { this.state = 'idle'; return; }
    }
    if (this.timer <= 0) {
      this.state = 'idle';
      /* 召唤物阵亡后才从这里重新开始计时（下一次布阵的间隔就是 gapMin~gapMax） */
      this.cd = rand(p.gapMin, p.gapMax);
      this.summon();
    }
  }
  /* 召唤：从【除自己与对手之外】的全部卡牌里随机挑一张（衍生 token 除外），
     以「冲锋！！」仆从的体型 + 360 点生命作为友军上场。
     同一张卡重复召唤 → 灌回它上次死亡时存下的成长进度。 */
  summon() {
    const u = this.u, p = this.p;
    if (this.hasFoe()) return;                                             // 已有召唤物
    /* 排除名单（用户 2026 口径）：【自己】+【对手的本体卡】。
       对手会跟着场上敌人变（召唤物都排除了，所以拿到的就是对面本体）。
       ⚠ "对手"按【当前场上的敌方本体】现取，不做缓存：
         祭品的本体死了以后召唤物还会继续作战（holdAfterOwner），
         那时再取一遍依然是正确的对面本体。 */
    const e0 = world.enemyOf(u);
    const opp = e0 ? e0.card.id : null;
    const pool = CARDS.filter(c => !c.token && c.id !== u.card.id &&
                                   (opp === null || c.id !== opp));
    if (!pool.length) return;
    const c = pool[Math.floor(rand(0, pool.length)) % pool.length];
    const a0 = e0 ? Math.atan2(e0.y - u.y, e0.x - u.x) : rand(0, TAU);
    const sx = clamp(u.x + Math.cos(a0) * p.spawnDist, 30, CFG.AW - 30);
    const sy = clamp(u.y + Math.sin(a0) * p.spawnDist, 30, CFG.AH - 30);
    const m = new SummonedFoe(u, c, sx, sy, p);
    m.dx = Math.cos(a0); m.dy = Math.sin(a0);
    world.units.push(m);
    world.effects.push(new Ring(u.x, u.y, 12, 88, 0.5, '#ff5a5a', 3.5));
    world.effects.push(new Ring(u.x, u.y, 4, 40, 0.3, '#ffd0a0', 2.5));
    burst(u.x, u.y, 26, { c: '#ff6a5a', s0: 100, s1: 380 });
    sfx('card_smith', 0.95, 0.9);
    sfx('heavy_attack', 0.6, 0.7);
    world.shake = Math.max(world.shake, 9);
    world.nums.push(new DmgNum(u.x, u.y - 58, c.name, 'gold'));
  }
  /* 头顶不显示任何文字（用户 2026 口径：五张测试版卡牌头顶一律不要文字描述）。 */
  statusText() { return null; }
}
MECHS.offering = MechOffering;

/* 祭品召唤出来的友军。与「冲锋！！」的仆从同一套体型（mR=26、0.8 倍卡面），
   但生命值固定 360、自身不带 AI 冲撞 —— 它就是一张普通弹球卡，
   出场时带上原卡的机制（所以随机召到锻打成型就会环绕君王之剑、召到引雷针就会劈雷）。 */
class SummonedFoe extends Unit {
  constructor(owner, card, x, y, p) {
    /* 伪卡：hp 用卡自己的、speed 用卡自己的（保住"每种卡手感不同"），
       mech 先占位，Unit 构造器会 new MECHS.none，随后换成真正的机制。 */
    super({ id: card.id, hp: p.mHp, speed: card.speed, mech: 'none', p: null }, owner.team);
    this.minion = true;
    this.summoned = true;          // 「祭品召唤出来的」标记（渲染/hover 用）
    this.o = owner;
    this.realCard = card;
    this.holdAfterOwner = true;    // 本体死亡后仍继续作战（冲锋的仆从是 false）
    this.rBody = p.mR;             // 碰撞半径与仆从一致（引擎的 rOf 认这个字段）
    /* replicaScale：本召唤物自己召唤出来的「余像分身」的缩放 ——
       必须从【被召唤那张卡】的参数上取（card.p.replicaScale = 0.75），
       不能从 p 上取：p 是「祭品」自己的参数表（mHp/mR/…），里面没有这一项，
       照 p 取会永远落到默认值 1，缩小就白做了。用户 2026 口径：
       "祭品召唤的余像分身也要缩小"。只作用于"身外化身"这一个新单位，
       【不改召唤物自己】—— 所以冲锋的仆从、以及这张召唤物本身的体型都照旧。 */
    const cp = card.p || {};
    this.replicaScale = cp.replicaScale === undefined ? 1 : cp.replicaScale;
    this.imgKey = 'card_' + card.id;
    this.mech = new (MECHS[card.mech] || MechNone)(this, card.p);
    this.x = x; this.y = y;
    /* 继承上次死亡的成长进度（数值成长 + 身上的状态） */
    const g = owner.mech && owner.mech.growth && owner.mech.growth[card.id];
    if (g) {
      if (g.growth && this.mech.applyGrowth) this.mech.applyGrowth(g.growth);
      this.setCarry(g.carry);
    }
    /* 分身淡入（纯观感，在 draw 里推进） */
    this.fade = 0;
    this.spawned = true;
  }
  /* 被攻击（血量真的掉了）→ 触发原生卡自己的"受击"反应。
     例：星体（引导之星）每次被打都回血、并往敌人身上甩一颗辉星。 */
  damage(amount, kind, src) {
    const before = this.hp;
    const v = super.damage(amount, kind, src);
    if (this.hp < before && this.mech && this.mech.onDamaged) this.mech.onDamaged(src);
    return v;
  }
  /* 死亡：把成长进度挂回主人的账本，供下次召唤同一张卡继承 */
  kill() {
    if (this.dying) return;
    if (this.o && this.o.mech) {
      const b = this.o.mech.growth || (this.o.mech.growth = {});
      b[this.realCard.id] = {
        growth: (this.mech.getGrowth && this.mech.getGrowth()) || null,
        carry: this.getCarry()
      };
    }
    this.dying = { t: 0, doom: false };
    world.shake = 8;
    sfx('card_exhaust', 0.85, 0.9);
  }
}

/* ============================================================
   7.7.2 余像 —— 分身反伤 + 保护本体
   ============================================================ */
/* 分身：**和正常卡牌一样有体积、会被索敌**的一个单位。
   它进 world.units，所以：
     · 敌人索敌会选到它（world.enemyOf 按最近优先）；
     · 它会和【敌方】单位正常物理碰撞（圆-圆弹开，见 stepPhysics 的碰撞段）；
     · 能被打（正面吃伤害）。
   但它**不显示血条/徽标**、以半透明卡面呈现，被打到时【原地消散】。
   它额外只做四件事：
     · 出生时继承本体【原先】的运动方向（本体随后朝完全相反的方向走）；
     · 被打到时触发反伤：沿「分身位置 → 敌方本体位置」的直线放一道贯穿白线 +150，
       路线上（垂距够近）的敌人一并吃伤害（见 disperse）；
     · 【15 秒未被攻击】自动消散，同样放出这道斩击（见 MechAfterimage.update）；
     · 消散时本体【立刻失去格挡】，之后 respawn 秒再次分身
       （召唤那一刻本体格挡重置为 20，见 MechAfterimage.spawn）。

   判定"分身受到攻击"只有一条路：
     ① 任何伤害最终都经过 damage() → 在这里挂钩（最可靠，涵盖所有机制）。
       ⚠ 纯物理接触【不算】被打到（用户 2026 口径）——撞上就正常弹开，
       除非对方真的结算了伤害（有碰撞伤害判定的敌人自然会走到 damage()）。 */
class ReplicaUnit extends Unit {
  constructor(owner, p, x, y, dx, dy, scale) {
    /* 伪卡：用本体卡的外观（同一张卡面），血量取 cHp，速度跟本体一致 */
    super({ id: owner.card.id, hp: p.cHp, speed: owner.baseSpeed, mech: 'none', p: null }, owner.team);
    this.replica = true;           // 「余像的分身」标记
    this.o = owner;                // 本体
    this.rp = p;
    this.x = x; this.y = y;
    this.dx = dx; this.dy = dy;    // 继承本体原先的运动方向
    /* scale：卡面/碰撞半径/血量的缩放。本体自己召唤的分身是 1（原尺寸）；
       祭品把「余像」当友军召出来、由【它】分出来的身则用 SummonedFoe.replicaScale
       （= 余像卡 p 里的 0.75）—— 用户 2026 口径"祭品召唤的余像分身也要缩小"。
       冲锋的仆从不受影响：它的体型走 ChargeMinion / drawUnits 的 u.minion 分支。 */
    this.rs = scale || 1;
    this.rBody = p.cR * this.rs;         // 碰撞半径（比本体略小；召唤物再乘一次缩放）
    /* 血量按"面积"缩：同一张卡面的血量厚度不变，被缩小的分身皮也薄一档。
       240 × 0.75² = 135；本体自己用（rs=1）时仍是 240。 */
    this.maxHp = this.hp = Math.max(1, Math.round(p.cHp * this.rs * this.rs));
    this.imgKey = owner.imgKey;
    this.mech = new MechNone(this, p);
    this.cDispersed = false;
    this.fade = 0;                 // 出生淡入（纯观感）
    /* 「多久没挨打就自动消散」的倒计时（秒）+ 上限（p.idleLife = 15）。
       倒计时由 MechAfterimage.update 推进、挨打时归零（见 damage），
       跑满就 disperse(null, false) —— 自动消散【照常放斩击反伤】，不是安静消失。
       头顶的小圆环读条读的就是这两个值（见 drawUnits 的 replica 分支）。 */
    this.idle = 0;
    this.idleMax = p.idleLife === undefined ? 15 : p.idleLife;
  }
  /* 分身的速度：和本体同速，但【消散/冻结期间必须为 0】。
     ⚠ 基类 curSpeed() 里那句 `if (this.freeze > 0 || this.dying) return 0;` 被
     上一版覆盖时漏掉了 —— 于是分身一被打中（disperse → kill → dying）就带着
     击退加速继续往外滑 0.9 秒，用户看到的就是"被击退"而不是"原地消散"。 */
  curSpeed() {
    if (this.freeze > 0 || this.dying) return 0;
    const s = this.baseSpeed + this.boost;
    return this.slowT > 0 ? s * 0.7 : s;
  }
  /* 被打到 / 本体被打到 / 超时 → 反伤（或纯失效）+ 原地消散。
     vanish=true 表示"本体先被打到，分身失效"。
     ⚠ 格挡【不在这里给】：用户 2026 口径"每次分身时把本体格挡重置为 20"（见 spawn()）；
     反过来，用户 2026 口径"分身消失时本体【立刻失去格挡】"—— 就在下面第一件事做掉。 */
  disperse(src, vanish) {
    if (this.cDispersed || this.dying) return;
    this.cDispersed = true;
    /* 【原地消散】：把速度与击退加速全部清零、并冻结在原地 ——
       否则消散动画期间它还会继续飘出去（"被击退"的观感）。 */
    this.dx = 0; this.dy = 0; this.boost = 0; this.freeze = 0.05;
    const o = this.o, p = this.rp;
    /* 【分身一消失，本体立刻失去格挡】（用户 2026 口径）—— 之前格挡是"召唤时给、
       一直挂到挨打才扣"；现在改成"分身在场期间才有这 20 点，分身一走就归零"。
       三路消散（被打碎 / 本体被打 / 超时）都走这里，所以放在最前面、只做一次。
       用 silent 版：掉格挡不弹"格挡 0"、也不放音效（拿格挡才需要反馈）。 */
    if (o.alive && !o.dying) o.setBlock(0, true);
    /* ⚠ 2026 修订（用户口径）：本体受伤与分身被命中【同时发生】时也要反伤
       （典型场景：末日降临 / 陨石打击的【同一次陨石】，落点同时盖住本体与分身）。
       所以判据从"vanish 就不反伤"改成"只要这次失效是被某次攻击打出来的
       （src 非空）就照样反伤"：
         · src 非空 = 有来头（飞刀 / 陨石 / 暗黑球 / 挥剑 / 灵魂碰撞…）→ 一律反伤；
         · src 为空 = 纯失效（本体血量变化触发的 vanish、本体阵亡、收尾清理）
                    → 安静消散，不反伤。
       两种命中顺序（先打分身、先打本体）现在都会反伤，并借 cDispersed 去重 ——
       同一次攻击绝不反两次。因此不需要另外加 0.1 秒宽容判定窗口。 */
    if (vanish && !src) {
      /* 本体先中招、且找不到伤害来源：分身直接消散（无白线、无反伤） */
      burst(this.x, this.y, 14, { c: '#cfe9ff', s0: 70, s1: 240 });
      sfx('card_deal', 0.5, 1.6);
      this.kill();
      return;
    }
    /* 【斩击线 = 分身被击中时的位置 → 敌方本体位置】这条直线（用户 2026 口径：
       不再随机取角）。白线沿这条直线贯穿整屏，伤害判定也跟着线走 ——
       "路径上"的敌人（中心到直线的垂距 ≤ 自身碰撞半径 + 线半宽）一并吃 pierceDmg，
       不再是"分身周围一圈"。敌方本体本身就在这条线上（垂距 0），必定命中。
       ⚠ src（是谁打的我）不再单独放行：旧口径给 src 开了个"无论多远都扫到"的后门，
       新口径只看"在不在线上" —— 打我的仆从若不在线上就不该跟着吃这一刀。 */

    const p = this.p, u = this.u;
    const ca = Math.cos(this.ang), sa = Math.sin(this.ang);
    /* 剑身：从剑格（剑尖反方向 anchorOff()）到剑尖 —— 与画出来的剑身完全一致
       （插墙时剑身有一半在墙外，判定段也同步缩短，绝不出现"看不见的剑伤人"） */
    const off = this.anchorOff();
    const ax = this.x - ca * off, ay = this.y - sa * off;
    for (const e of world.enemiesOf(u)) {
      if (e.dying) continue;
      if (this.hitSet.has(e)) continue;               // 这一趟已经打过它了
      const er = (e.minion && e.rBody) ? e.rBody : CFG.R;
      if (segDist(e.x, e.y, ax, ay, this.x, this.y) > er + p.bladeHalf) continue;
      this.hitSet.add(e);
      e.damage(p.dmg, 'hit', u);
      burst(e.x, e.y, 18, { c: '#cdf6ea', s0: 110, s1: 380 });
      sfx('heavy_attack', 0.85, 1.0);
      world.shake = Math.max(world.shake, 8);
    }
  }
  /* 命中判定的剑身锚点：贴图锚点是【剑格】，剑尖在它前方 anchorOff() 个单位
     （和 draw() 里 drawSovereignBlade 的锚点算法一致）。 */
  bladeAnchor() {
    const off = this.anchorOff();
    return { x: this.x - Math.cos(this.ang) * off,
             y: this.y - Math.sin(this.ang) * off };
  }
  draw(ctx) {
    if (!IMG['sp_sb_blade']) return;
    /* 残影：从上一帧位置到当前位置连画几把半透明的剑。
       锚点同样要往剑尖反方向退 anchorOff() —— 上一版这里写的是 "+110"，
       等于把残影整把推到剑尖前面去（上一版 tipOff 写错的连带问题）。 */
    if (this.state === 'fly' || this.state === 'fly2') {
      const sp = this.state === 'fly' ? this.p.summonSpd : this.p.flySpd;
      const ux = Math.cos(this.ang), uy = Math.sin(this.ang);
      const off = this.anchorOff();
      for (let i = 1; i <= 4; i++) {
        const k = i / 4;
        const bx = this.x - ux * sp * 0.016 * i, by = this.y - uy * sp * 0.016 * i;
        ctx.save();
        ctx.globalAlpha = 0.30 * (1 - k) + 0.06;
        ctx.globalCompositeOperation = 'lighter';
        drawSovereignBlade(ctx, bx - ux * off, by - uy * off, this.ang, 1);
        ctx.restore();
      }
    }
    /* 锚点：贴图锚点是【剑格】，(x,y) 是剑身中点 → 沿剑尖反方向退 anchorOff() 个单位 */
    const A = this.bladeAnchor();
    drawSovereignBlade(ctx, A.x, A.y, this.ang, 1);
    /* 插墙时在碰撞点（= 剑身中点）留一圈微光，交代"钉在这里" */
    if (this.state === 'stuck') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4 + 0.25 * Math.sin(world.t * 7);
      ctx.fillStyle = '#8fe0c0';
      ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

/* ============================================================
   7.7.4 灵魂风暴 —— 召唤灵魂强化风暴
   ============================================================ */
/* 灵魂：与「冲锋！！」仆从同尺寸的小单位（0.8 倍卡面、半径 sR）。
   ⚠ 四条硬口径（用户 2026 修订）：
     · 【不可被对方索敌】—— world.enemyOf 跳过 soul（所以对手的刀/剑不会挑它当目标）；
     · 【没有血条】（drawUnitHUD 跳过 soul）；
     · 【出生 lifeT=4 秒后自动死亡】（不再走"每秒扣血"，也就不需要伤害数字）；
     · 【受到任何攻击波及也直接死亡】（damage() 被覆盖成"挨一下就消散"）。
   另外保留：碰到敌人（体积重叠）→ 造成 touchDmg=30 点伤害后自己直接死亡。 */
class SoulUnit extends Unit {
  constructor(owner, x, y, p) {
    super({ id: 'soul_unit', hp: p.sHp, speed: CFG.SPEED, mech: 'none', p: null }, owner.team);
    this.minion = true;
    this.soul = true;
    this.ghost = true;          // 灵体：与任何单位都不发生碰撞（见引擎的仆从碰撞段）
    this.o = owner;
    this.p = p;
    this.rBody = p.sR;
    this.lifeT = 0;             // 已经活了多久（到 p.lifeT 就自灭）
    /* 灵魂用【完整的卡面】—— 卡框 + 缎带 + 类型铭牌全都烘进去了
       （bake_card2.py 的 TOKENS，assets/baked/card_soul_300.png），
       所以这里直接拿 card_soul，和场上其它卡一样渲染。 */
    this.imgKey = 'card_soul';
    this.x = x; this.y = y;
    this.mech = new MechNone(this, p);
  }
  /* 受到任何伤害 → 直接消散。
     ⚠ 不走 super.damage()：灵魂没有血条，弹伤害数字/扣格挡/记统计都没意义，
     用户口径就是"受到攻击波及也直接死亡"。 */
  damage() {
    if (!this.dying) {
      this.flash = Math.max(this.flash, 0.12);
      this.kill();
    }
    return 0;
  }
  updateSoul(dt) {
    if (!this.alive || this.dying) return;
    /* ① 碰到敌人 → 造成 touchDmg=30 点伤害后【自己直接死亡】。
       灵魂是 ghost（与任何单位都不做物理碰撞），所以这里用【体积重叠】判定；
       撞到的可能是本体也可能是对方的仆从。伤害记在召唤者头上（src = this.o），
       这样对局统计里算的是灵魂风暴这一方的输出。 */
    for (const e of world.enemiesOf(this)) {
      const er = (e.minion && e.rBody) ? e.rBody : CFG.R;
      if (Math.hypot(e.x - this.x, e.y - this.y) > er + this.rBody) continue;
      e.damage(this.p.touchDmg, 'hit', this.o);
      burst(e.x, e.y, 20, { c: '#8ff0dd', s0: 100, s1: 340 });
      sfx('heavy_attack', 0.6, 1.35);
      world.shake = Math.max(world.shake, 6);
      this.kill();
      return;
    }
    /* ② 自灭：出生 lifeT 秒后直接消散（用户口径 4 秒）。 */
    this.lifeT += dt;
    if (this.lifeT >= this.p.lifeT) { this.kill(); return; }
    /* 活着的时候冒一点灵光（纯观感） */
    this.sparkT = (this.sparkT || 0) + dt;
    while (this.sparkT >= 0.22) {
      this.sparkT -= 0.22;
      world.effects.push(new Spark(this.x + vrand(-14, 14, 'vrand'), this.y + vrand(-14, 14, 'vrand'),
                                   { c: '#8ff0dd', s0: 10, s1: 50 }));
    }
  }
  kill() {
    if (this.dying) return;
    this.dying = { t: 0, doom: false };
    world.shake = Math.max(world.shake, 4);
    sfx('card_exhaust', 0.5, 1.25);
    burst(this.x, this.y, 14, { c: '#8ff0dd', s0: 60, s1: 220 });
  }
}

/* 灵魂归巢：灵魂消散处飘出的一缕灵魂粒子，【蜿蜒】飞向风眼。
   用户口径：只有风暴已经开着才走这条路；粒子飞到中心、动画播完，
   风暴才真正强化（所以 +1 挂在 onArrive 回调上，而不是灵魂一死立刻加）。 */
class SoulWispStream extends Effect {
  constructor(x, y, tx, ty, onArrive) {
    super();
    this.x = x; this.y = y; this.tx = tx; this.ty = ty;
    this.cb = onArrive;
    this.t = 0; this.u = 0;
    this.life = 0.62;               // 整段飞行时长（秒）
    /* 蜿蜒的振幅/圈数/相位【只掷一次】（走 vis 流）：路径从一开始就定死，
       放进 draw() 里每帧重掷会抖成一条乱线（同风带的教训）。 */
    const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy) || 1;
    this.nx = -dy / d; this.ny = dx / d;              // 垂直于飞行方向
    this.amp = clamp(d * 0.26, 16, 52);               // 横向摆幅
    this.waves = 1.7 + vrand(0, 1.2, 'vrand');
    this.ph = vrand(0, TAU, 'vrand');
    this.sx = x; this.sy = y;
    this.sparkT = 0;
  }
  /* 蜿蜒路径：u=0 在灵魂消亡处、u=1 在风眼中心；横向摆动用 sin(πu) 包络，
     两端都收成 0 —— 起点终点严丝合缝，中间像蛇一样扭。 */
  _pt(u) {
    const off = this.amp * Math.sin(Math.PI * u) * Math.sin(u * Math.PI * 2 * this.waves + this.ph);
    return [this.sx + (this.tx - this.sx) * u + this.nx * off,
            this.sy + (this.ty - this.sy) * u + this.ny * off];
  }
  update(dt) {
    this.t += dt;
    const prog = Math.min(1, this.t / this.life);
    this.u = 1 - Math.pow(1 - prog, 2);               // 先快后慢：像被风眼吸进去
    /* 沿途洒几粒小灵光（纯观感） */
    this.sparkT += dt;
    while (this.sparkT >= 0.05) {
      this.sparkT -= 0.05;
      const q = this._pt(this.u);
      world.effects.push(new Spark(q[0] + vrand(-3, 3, 'vrand'), q[1] + vrand(-3, 3, 'vrand'),
                                   { c: '#8ff0dd', s0: 4, s1: 34 }));
    }
    /* 飞到了 → 风眼收束一圈光，然后才通知强化（本帧只走一次） */
    if (prog >= 1 && !this.done) {
      this.done = true;
      world.effects.push(new Ring(this.tx, this.ty, 26, 5, 0.34, '#8ff0dd', 3));
      if (this.cb) this.cb();
      this.dead = true;
    }
  }
  draw(ctx) {
    const prog = Math.min(1, this.t / this.life), u = this.u;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    /* 一串灵魂粒子：沿路径往后取样，越往尾越小越淡 */
    const N = 13;
    for (let i = N; i >= 0; i--) {
      const q = u - i * 0.052;
      if (q < 0) continue;
      const k = 1 - i / (N + 1);
      const pt = this._pt(q);
      ctx.globalAlpha = (0.20 + 0.75 * k) * (1 - prog * 0.35);
      ctx.fillStyle = i === 0 ? '#eafff9' : '#8ff0dd';
      ctx.beginPath(); ctx.arc(pt[0], pt[1], 1.2 + 3.4 * k * k, 0, TAU); ctx.fill();
    }
    /* 头部一团柔光 */
    const h = this._pt(u);
    ctx.globalAlpha = 0.55 * (1 - prog * 0.6);
    ctx.fillStyle = 'rgba(168,255,240,.9)';
    ctx.beginPath(); ctx.arc(h[0], h[1], 9 + 5 * prog, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* 灵魂风暴本体：场地中心的一团漩涡。
   两个效果：
     ① 牵引 —— 把敌人的【移动方向】缓缓扭向中心（只改方向、不改速度），
        离中心越近力度越大，上限刻意压得很低（pullMax=0.3 度/秒级），
        只做"轻微位移"，不会把敌人吸死在中心；
     ② 伤害 —— 按距离把频率插值到 tickMin~tickMax 次/秒，越近越密。 */
class SoulStormFx extends Effect {
  constructor(x, y, p) {
    super();
    this.x = x; this.y = y; this.p = p;
    this.bonus = 0;        // 每多死一个灵魂 +1（伤害与牵引各一份）
    this.bonusCap = p.bonusCap;
    this.core = 46;        // 风眼的【当前】半径：朝 46+bonus*2.4 平滑追（见 update）
    this.t = 0;
    /* 诞生过渡：风暴不是"啪"地一下满屏出现，而是用 birthDur 秒从风眼里撑开
       —— 半径、转速、透明度一起从零收敛到常态（见 bornK / draw / update）。
       0.8s 与诞生时那圈扩散光环（onSoulDeath 里的 Ring）对齐，两件事同时收尾。 */
    this.birthT = 0;
    this.birthDur = 0.8;
    this.acc = new Map();
    this.zapT = 0;
    this.drawUnder = true;
    /* 螺旋风带的随机参数只在这里掷【一次】（走观感流）——
       千万别放到 draw() 里：那样每帧都重新掷，风带会疯狂抖动。 */
    this.pool = [];
    for (let i = 0; i < 7; i++) {
      this.pool.push({
        a0: (i / 7) * TAU + vrand(0, 0.7, 'vrand'),
        span: 2.0 + vrand(0, 2.4, 'vrand'),
        r0f: 0.06 + vrand(0, 0.55, 'vrand'),      // 起始半径 = 风眼 + f×(R-风眼)
        widen: 0.30 + vrand(0, 0.5, 'vrand'),
        dir: i % 2 ? 1 : -1,
        w: 1.4 + vrand(0, 2.6, 'vrand'),
        spd: 0.55 + vrand(0, 0.55, 'vrand')
      });
    }
  }
  /* 诞生进度：0 = 刚出现（还没有风墙），1 = 长成常态。
     easeOutCubic：起手快、收尾缓，读起来像一阵风"呼"地撑开再慢慢稳住，
     而不是线性放大。⚠ 这一个系数同时喂给【表现】和【判定】—— 风暴的作用半径
     也按它从 0 长到 p.radius，所以诞生这 0.8s 里"看到的范围"和"打得到的范围"始终一致。 */
  bornK() {
    const k = clamp(this.birthT / this.birthDur, 0, 1);
    return 1 - Math.pow(1 - k, 3);
  }
  draw(ctx) {
    /* 灵魂风暴的表现（用户嫌上一版"太丑"，这里重做）：
       上一版是"一块平铺的青色径向渐变 + 三条圆弧线"，问题在于
       ① 覆盖式的大色块把场地糊住；② 三条圆弧看着像随手画的线。
       现在改成【留出中心的风眼】的一圈风墙：
         风眼空着（敌人/灵魂在里面看得见）→ 内侧一圈柔和薄雾 →
         多层带宽度变化的螺旋风带（每条从头到尾粗细/明暗都变）→
         一圈脉动的边界光带 → 若干向内旋进的亮弧与碎点。
       所有层都用 'lighter' 累加，所以中心不会积成死白。 */
    const p = this.p, t = world.t;
    const g = this.bornK();                        // 诞生进度（0→1）
    const A = g;                                   // 整体透明度随诞生一起淡入
    const R = Math.max(8, p.radius * g);           // 风墙半径：诞生期由中心长到 p.radius
    const core = Math.max(2, this.core * g);       // 风眼半径（越强越大，平滑过渡见 update）
    ctx.save();
    ctx.translate(this.x, this.y);

    /* ① 风眼以外的薄雾：内缘 core 处最淡，靠近边界变亮，最外柔和收掉 */
    const haze = ctx.createRadialGradient(0, 0, core * 0.5, 0, 0, R);
    haze.addColorStop(0, 'rgba(120,235,222,0)');
    haze.addColorStop(0.30, 'rgba(96,222,214,' + (0.10 * A).toFixed(3) + ')');
    haze.addColorStop(0.72, 'rgba(74,198,206,' + (0.17 * A).toFixed(3) + ')');
    haze.addColorStop(1, 'rgba(40,128,150,0)');
    ctx.fillStyle = haze;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();

    ctx.globalCompositeOperation = 'lighter';

    /* ② 螺旋风带：7 条，半径/长度/转向/速度在构造时固定（见 pool），
          整条路径透明度沿长度渐变 —— 看起来像"一缕缕风"而不是硬线。
          诞生期额外快转 (1-g)*1.7：撑开时像被甩出来的，长成后平滑交还给常态转速。 */
    const spin = t * 0.55 + (1 - g) * 1.7;
    for (const b of this.pool) {
      const steps = 22;
      const w = b.w;
      const ra = core + b.r0f * (R - core);
      const rb = ra + Math.max(0, R - 16 - ra) * b.widen;
      for (let i = 0; i < steps; i++) {
        const f0 = i / steps, f1 = (i + 1) / steps;
        const a0 = b.a0 + b.dir * (spin * b.spd + f0 * b.span);
        const a1 = b.a0 + b.dir * (spin * b.spd + f1 * b.span);
        const rr0 = ra + (rb - ra) * f0, rr1 = ra + (rb - ra) * f1;
        ctx.strokeStyle = 'rgba(168,255,240,' + (0.42 * A * Math.sin(Math.PI * f0)).toFixed(3) + ')';
        ctx.lineWidth = w * (0.35 + 0.65 * Math.sin(Math.PI * f0));
        ctx.beginPath();
        ctx.moveTo(Math.cos(a0) * rr0, Math.sin(a0) * rr0 * 0.94);
        ctx.lineTo(Math.cos(a1) * rr1, Math.sin(a1) * rr1 * 0.94);
        ctx.stroke();
      }
    }

    /* ③ 边界光带：两条错开相位的脉动环，把"风暴范围"交代清楚 */
    for (let i = 0; i < 2; i++) {
      const ph = (t * 0.42 + i * 0.5) % 1;
      ctx.globalAlpha = (1 - ph) * 0.30 * A;
      ctx.strokeStyle = '#a8fff0';
      ctx.lineWidth = 2.6 * (1 - ph * 0.5);
      ctx.beginPath(); ctx.arc(0, 0, R * (0.80 + ph * 0.22), 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* ④ 向内旋进的亮弧：三簇，每簇沿螺旋慢慢往里收 */
    for (let i = 0; i < 3; i++) {
      const ph = (t * 0.30 + i / 3) % 1;
      const r = R * (1 - ph * 0.62);
      const a0 = spin * 1.6 + i * TAU / 3;
      ctx.globalAlpha = 0.34 * A * Math.sin(Math.PI * ph);
      ctx.strokeStyle = '#dcfff8';
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(0, 0, r, a0, a0 + 0.85); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* ⑤ 风眼：一圈很淡的内缘环，别让中心显得"什么都空" */
    const ic = ctx.createRadialGradient(0, 0, core * 0.35, 0, 0, core);
    ic.addColorStop(0, 'rgba(210,255,250,' + (0.16 * A).toFixed(3) + ')');
    ic.addColorStop(1, 'rgba(120,235,222,0)');
    ctx.fillStyle = ic;
    ctx.beginPath(); ctx.arc(0, 0, core, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(190,255,245,' + (0.22 * A).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, core, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  update(dt) {
    const p = this.p, u = this.o;
    this.t += dt;
    if (this.birthT < this.birthDur) this.birthT += dt;
    /* 风眼随强化【平滑】扩大：原来是 bonus 一变就跳一档，用户要它缓着长。
       指数逼近（与帧率无关），大约 0.5s 追上目标半径。 */
    this.core = lerp(this.core, 46 + this.bonus * 2.4, 1 - Math.exp(-dt * 4.5));
    /* 出生那一帧 g=0：既不打人也不牵引，等风墙从中心撑开才开始生效（见 bornK）。 */
    const R = p.radius * this.bornK();
    for (const e of world.enemiesOf(u)) {
      if (e.dying) continue;
      const dx = this.x - e.x, dy = this.y - e.y;
      const d = Math.hypot(dx, dy);
      if (d > R) continue;
      /* k = 0（贴着中心）→ 1（风暴边缘） */
      const k = clamp(R > 0 ? d / R : 1, 0, 1);
      const near = 1 - k;
      /* ① 牵引：只把【方向】往中心扭一点，速度大小原样保留。
         强度 = pullMin + (pullMax-pullMin)*near²，再除 18 摊到每一帧；
         成长用 √ 而不是线性，免得"死了几十个灵魂"以后牵引爆掉、把人钉在中心。
         远场几乎无感，近场也只是"慢慢被带向中心"（用户明确要求别做成禁锢）。 */
      const pull = (p.pullMin + (p.pullMax - p.pullMin) * near * near) / 18
                 * Math.min(2.2, 1 + Math.sqrt(this.bonus) * p.pullGain * 4);
      if (d > 1) {
        const nx = dx / d, ny = dy / d;
        const len = Math.hypot(e.dx, e.dy) || 1;
        let ux = e.dx / len + nx * pull, uy = e.dy / len + ny * pull;
        const l2 = Math.hypot(ux, uy) || 1;
        e.dx = ux / l2; e.dy = uy / l2;
      }
      /* ② 伤害：离中心越近，每秒判定次数越多（tickMin ~ tickMax 次/秒） */
      const rate = p.tickMin + (p.tickMax - p.tickMin) * Math.pow(near, 1.5);
      let acc = (this.acc.get(e) || 0) + dt * rate;
      const dmg = p.dmg + this.bonus * p.dmgGain;
      while (acc >= 1) {
        acc -= 1;

           它是这张卡的主输出，该有飘字与音效（音效按帧限流，别糊成一片）。
           ⚠ 用户口径：风暴攻击【不要闪电特效】—— 原来每跳都 push 一条 Zap 电弧，

        e.damage(dmg, 'light', u);

      }
      this.acc.set(e, acc);
    }
  }
}
