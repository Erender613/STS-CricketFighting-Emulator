const SEL = { L: 'dark_embrace', R: 'voltaic' };

function makePanel(el, side) {
  el.innerHTML = '';
  const h = document.createElement('h2');
  h.innerHTML = '<span class="dot"></span>' + (side === 'L' ? '红方 · 卡牌' : '蓝方 · 卡牌');
  el.appendChild(h);
  const big = document.createElement('img'); big.className = 'bigcard'; el.appendChild(big);
  const nm = document.createElement('div'); nm.className = 'cname'; el.appendChild(nm);
  const tg = document.createElement('div'); tg.className = 'ctag'; el.appendChild(tg);
  /* 卡牌介绍现在直接烘焙在卡面的下半部文字区（与官方卡面一致），
     不再在卡牌下方单列一行，避免同一句话重复出现两次。 */
  const th = document.createElement('div'); th.className = 'thumbs'; el.appendChild(th);

  /* list = 本次要显示的卡（设置里开「测试版卡牌」会多出 5 张）。
     按钮的 on 状态按【卡 id】判断，不再按下标 —— 列表长度会随设置变化。 */
  function refresh(list) {
    const c = CARD_BY_ID[SEL[side]] || list[0];
    SEL[side] = c.id;
    big.src = ASSET_MAP.img['card_' + c.id];
    nm.textContent = c.name;
    /* 只留英文名（用户要求：删掉「稀有 ·」「 · HP 1000」这些字样） */
    tg.textContent = c.en;
    Array.prototype.forEach.call(th.children, function (b) {
      b.classList.toggle('on', b.dataset.cid === SEL[side]);
    });
  }
  el.__refresh = function () {
    const list = testList();
    th.innerHTML = '';
    list.forEach(function (c) {
      const b = document.createElement('button');
      const im = document.createElement('img');
      im.src = ASSET_MAP.img['card_' + c.id];
      im.alt = c.name;
      b.appendChild(im);
      b.dataset.cid = c.id;
      b.title = c.name;
      b.onclick = function () { SEL[side] = c.id; resumeAudio(); refresh(testList()); sfx('card_select', 0.6); };
      th.appendChild(b);

}

  const t = e.target;

  /* 设置面板开着时，空格/R 不该穿透到对战去（否则按空格会一边关面板一边开打） */

  if (SERIES.on && seriesMaskIsOpen()) return;

  if (e.key === 's' || e.key === 'S') { recToggle(); return; }

/* ---------- 背景音乐 ----------
   走 Web Audio（和音效同一个 AudioContext），而不是 <audio>：
   AudioBufferSourceNode 的 loop=true 是采样级精确的循环，接缝不会像 <audio> 那样
   多出几十毫秒的空档 —— 这也是 build_bgm.py 要费劲做交叉淡化循环的原因。 */
let bgmGain = null, bgmNode = null, bgmCurId = null;
let bgmOffset = 0, bgmStartAt = 0;
const BGM_BUF = {};
function bgmIds() {
  const out = [];
  BGM_GROUPS.forEach(function (g) {
    g[1].forEach(function (t) { if (ASSET_MAP.bgm && ASSET_MAP.bgm[t[0]]) out.push(t[0]); });
  });
  return out;
}
function bgmPickId() {
  if (SET.bgm === 'random') {
    const ids = bgmIds();
    /* 用 Math.random 而不是 rand()：对战随机流是决定论的，不能被放音乐扰动 */
    return ids.length ? ids[Math.floor(Math.random() * ids.length)] : null;
  }
  if (SET.bgm === 'off') return null;
  return (ASSET_MAP.bgm && ASSET_MAP.bgm[SET.bgm]) ? SET.bgm : null;
}
function bgmApplyVol() {
  if (!bgmGain) return;
  const v = soundOn ? BGM_VOL : 0;
  /* 有淡入斜坡挂着时直接写 .value 会被自动化压住 —— 先取消再写，保证声音开关立即生效 */
  try { if (AC) bgmGain.gain.cancelScheduledValues(AC.currentTime); } catch (e) { }
  bgmGain.gain.value = v;
}
function bgmSpawn(buf, fadeIn) {
  if (!AC || !buf) return;
  if (!bgmGain) {
    bgmGain = AC.createGain(); bgmApplyVol(); bgmGain.connect(masterGain);
  }
  bgmNode = AC.createBufferSource();
  bgmNode.buffer = buf; bgmNode.loop = true;
  try { bgmNode.connect(bgmGain); } catch (e) { }
  bgmStartAt = AC.currentTime;
  try { bgmNode.start(0, buf.duration ? (bgmOffset % buf.duration) : 0); } catch (e) { }
  /* 3 秒淡入：只挂在「换曲起播」（bgmPlay 那条路）上；暂停恢复（bgmResume）不重淡，
     否则每局间隙回来都要先哑 3 秒。循环段曲目起播即全能量中段，淡入避免"一开局就炸"；
     腐化之心（全曲）由 bgmPlay 那边按 id 排除 —— 它自带渐入前奏。 */
  if (fadeIn) {
    try {
      const t0 = AC.currentTime;
      bgmGain.gain.cancelScheduledValues(t0);
      bgmGain.gain.setValueAtTime(0, t0);
      bgmGain.gain.linearRampToValueAtTime(soundOn ? BGM_VOL : 0, t0 + 3);
    } catch (e) { }
  }
}
function bgmKillNode() {
  if (!bgmNode) return;
  try { bgmNode.stop(); } catch (e) { }
  try { bgmNode.disconnect(); } catch (e) { }
  bgmNode = null;
}
function bgmPlay() {
  if (!AC || sfxMute) return;
  const id = bgmPickId();
  if (!id) { bgmStop(); return; }
  if (bgmCurId === id) { bgmResume(); return; }
  bgmKillNode(); bgmCurId = null; bgmOffset = 0;
  const go = function (b) {
    /* 解码是异步的：回来时状态可能已经变了（换局/预演/暂停） */
    if (sfxMute || !world.running || bgmCurId !== null) return;
    /* boss_the_heart（腐化之心）是全曲直出、自带渐入前奏，不做起播淡入；
       其余为循环段曲目（起播即全能量中段），统一 3 秒淡入。 */
    bgmCurId = id; bgmSpawn(b, id !== 'boss_the_heart');
  };
  if (BGM_BUF[id]) { go(BGM_BUF[id]); return; }
  const b64 = ASSET_MAP.bgm[id];
  try {
    AC.decodeAudioData(b64buf(b64), function (b) { BGM_BUF[id] = b; go(b); }, function () { });
  } catch (e) { }
}
function bgmResume() {
  if (!bgmCurId || bgmNode) return;
  if (BGM_BUF[bgmCurId]) bgmSpawn(BGM_BUF[bgmCurId]);
}
function bgmPause() {
  if (!bgmNode) return;
  const d = bgmNode.buffer && bgmNode.buffer.duration;
  if (d) bgmOffset = (bgmOffset + (AC.currentTime - bgmStartAt)) % d;
  bgmKillNode();
}
function bgmStop() { bgmKillNode(); bgmCurId = null; bgmOffset = 0; }

   只有第一局才真正挑选并起播。bgmPickId 每次调用都会重掷"随机"，直接用 bgmPlay
   会在每局开打时随机换曲，听感就是"局局重开"。 */
function bgmSeriesPlay() {
  if (!AC || sfxMute) return;
  if (bgmCurId) { bgmResume(); return; }
  bgmPlay();
}
/* SERIES_BGM_END */
/* 设置里改了曲子：正在打就直接换掉 */
function bgmRestart() { if (world.running && !world.over) { bgmStop(); bgmPlay(); } }

    if (m) m.classList.remove('on');

function setMarkBg() {
  try {
    const grid = document.getElementById('setBgGrid');
    if (!grid || !grid.children) return;
    Array.prototype.forEach.call(grid.children, function (b) {
      if (b.classList) b.classList.toggle('on', b.dataset.bg === SET.bg);
    });
  } catch (e) { }

  }

  if (grid) {
    grid.onclick = function (e) {

  const tb = document.getElementById('setTestBtn');
  if (tb) {

/* ============================================================
   10.2 种子：工具栏「种子」按钮（正式版也有）
   ------------------------------------------------------------
   「指定种子」原来只存在于开发者版的面板里，这里把它下放到正式版并做成按钮：
   点开是一个下拉子界面 ——
     · 输入任意数字/文本 → 「用该种子开战」（留空 = 每局现掷，与以前完全一致）；
       填了内容之后，工具栏的「开始战斗」也会用这个种子（连着点就是同一局，便于对照）。
     · 「显示种子」开关 → 当前对局种子以小字常驻在网页右下角（录制模式时自动隐藏）。
   与开发者版的关系：开发者面板里的种子框仍然保留（批量预演要用它），
   两边同时填了内容时【开发者面板优先】—— 见 startMatch()。
   ============================================================ */
const SEEDIN = { text: '' };            // 输入框内容（空 = 每局现掷）
const elSeedPop = document.getElementById('seedPop');
const btnSeed = document.getElementById('btnSeed');
const elSeedIn = document.getElementById('seedIn');
const elSeedShow = document.getElementById('seedShow');
const btnSeedRnd = document.getElementById('seedRnd');
const btnSeedPlay = document.getElementById('seedPlay');

function seedIsOpen() {
  try { return !!(elSeedPop && elSeedPop.classList && elSeedPop.classList.contains('on')); }
  catch (e) { return false; }
}
/* 下拉定位：贴在按钮左下；窗口右侧放不下就往左挪（窄窗口时按钮可能已经贴边）。 */
function seedPlace() {
  try {
    if (!elSeedPop || !btnSeed || !elSeedPop.style) return;
    const r = btnSeed.getBoundingClientRect();
    const w = elSeedPop.offsetWidth || 320;
    const win = window.innerWidth || 0;
    elSeedPop.style.left = Math.min(0, win - 12 - w - r.left) + 'px';
  } catch (e) { }                       // 假 DOM（无头验证）里没有 getBoundingClientRect
}
function seedOpen(on) {
  try {
    if (!elSeedPop || !btnSeed) return;
    elSeedPop.classList.toggle('on', !!on);
    btnSeed.classList.toggle('on', !!on);
    if (on) seedPlace();
  } catch (e) { }
}
/* 本局要用的种子（没有就返回 undefined → resetMatch 现掷一个新的） */

}

/* ============================================================
   10.3 录制模式（PC 专属，按 S 开关）
   ------------------------------------------------------------
   录屏时只要画面、不要任何按钮：
     · 标题 / 工具栏 / 开发者面板（按钮 + 面板）/ 右下角种子角标 全部隐藏
     · 竞技场放大到几乎占满视口，离边框只留 REC.margin（16px）
     · 两侧按【原来的尺寸】只保留双方卡面 + 中英文名（连面板背板与描边一起去掉）
   隐藏与排布全在 body.rec 那组 CSS；竞技场的尺寸在 fit() 的 REC 分支里算。
   "PC 专属"的判据 = 视口宽 > 900px（与 CSS 里 .grid 三列布局的断点同一处）：
   窄屏根本放不下"两侧卡位 + 正方形竞技场"，这时按 S 不做任何事、并且会自动退出。
   cardW / sidePad 决定两侧带子要多宽（stripW），fit() 用它算竞技场边长的宽度上限；
   卡面的实际宽度交给 CSS 的 --rec-card（由 fit() 写入），两处不会各写一份。 */
const REC = { on: false, margin: 16, cardW: 232, sidePad: 10, stripW: 252 };
function recSupported() {
  try {
    if (window.matchMedia) return !window.matchMedia('(max-width:900px)').matches;
  } catch (e) { }
  return (window.innerWidth || 0) > 900;
}
function recApply(on) {
  REC.on = !!on;
  try {
    if (document.body && document.body.classList) document.body.classList.toggle('rec', REC.on);
  } catch (e) { }
  fit();                      // 立刻按新模式重算竞技场尺寸
  seedTagTick(true);          // 角标跟着立刻显示/消失
}
/* 返回切换后的状态（false = 窗口太窄开不了 / 刚关掉） */
function recToggle() {
  if (SERIES.on) return REC.on;         // 系列赛的布局没有录制形态，先禁用
  if (!REC.on && !recSupported()) return false;
  recApply(!REC.on);
  return REC.on;
}
function recOnResize() {
  if (REC.on && !recSupported()) recApply(false);   // 缩到窄屏：自动退出，别留一个挤坏的布局
}

/* ============================================================
   10.4 系列赛（PvE / AI vs AI）—— 角色系统 + 三局两胜
   ------------------------------------------------------------
   流程：模式 → 角色 → 抽卡组（每方 3 套 × 3 张，对应两套无相同卡）→
   铁甲战士烧牌 → 静默猎手重随机 → 双方各套挑 1 张（互相保密）→ 揭示 →

   正式开打 → 三局两胜。

   【确定性】系列层的一切随机（抽卡、AI 决策、随机角色、重掷链）都走
   SERIES.rng = mulberry32(SERIES.seed)，与战斗的 RNG.sim / RNG.vis 彻底分开

   【PvP 接缝】双方选牌只是纯数据 SERIES.picks = {L:[id,id,id], R:[...]} ——
   以后做 PvP 只要把"AI 出牌"换成"对方玩家的出牌"，其余流程全部复用。

   每种状态上限 6 层（引擎每秒自然衰减 1 层，不设上限会随碰撞次数无界增长）。 */

const AI_EPS = 0.15;
const AI_REROLL_BELOW = 0.45;

const SERIES = {
  on: false,              // 系列赛进行中（引擎战斗效果钩子的总闸）
  screen: 'off',          // off/mode/char/draft/reveal/battle/roundend/end

  human: { L: true, R: false },
  seed: 0,                // 系列种子（seedHash 归一后的 32 位整数，可整场复现）

  burned: null,           // {L:[id...], R:[id...]}：被烧毁的卡（键 = 卡的原主人）
  rerollsLeft: null,      // {L, R}：静默猎手的剩余重随机次数
  picks: null,            // {L:[id×3], R:[id×3]}：每套出战卡（锁定后不可改）
  pickSel: null,          // 玩家在选牌 UI 里点选但未确认的 {L:[id|null ×3]}
  burnSel: [],            // 玩家铁甲在烧牌阶段点选的 {i, id}
  draftStage: 'pick',     // 当前选牌阶段：reroll（静默换牌）→ burn（铁甲烧牌）→ pick（选牌）

  stageTimer: null,       // 纯 AI 阶段的自动推进定时器（点了「继续」就取消）

     胜局就按 50 局一档加码，至多 250 局），取最精彩的玩家胜局种子出战。 */
  destinyEnabled: false,
  destiny: false,         // 是否已激活（输过至少一局）
  destinyTimer: null,
  round: 0,               // 当前局（0..2）
  score: { L: 0, R: 0 },
  roundWinners: [],       // [{win:'L'|'R', name}] 供结算回顾
  battleSeeds: [null, null, null],   // 预演落定的每局种子
  battleRetry: 0,         // 本局预演重掷了几次（只展示）
  battleDone: false,      // 本局已结算（防止 seriesFrame 重复推进）
  battleWait: 0,          // 战斗结束后等结算横幅播完的秒表
  aiLog: []               // AI 在选牌阶段的可见动作（重随机/烧牌）
};

function sideName(side) { return side === 'L' ? '红方' : '蓝方'; }
function foeOf(side) { return side === 'L' ? 'R' : 'L'; }

/* ---------- 系列 RNG 与种子派生 ---------- */
function seriesShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(SERIES.rng() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* 局种子：把 (系列种子, 局号, 第几掷) 混成 32 位整数。预演撞上超时/同死平局
   就 k+1 换一颗（与 tools/bake_winrate.js 的烘焙口径同一条规矩）。 */
function seriesBattleSeed(r, k) {
  let h = SERIES.seed >>> 0;
  const s = 'series|' + SERIES.seed + '|' + r + '|' + k;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 0x846CA68B) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}

/* ---------- 胜率「常识」查询（AI 专用，玩家不可见） ----------
   数据只存整数胜场（win = 字典序靠前一方的胜场），胜率运行时现算。
   数据缺失（探针直跑 src / 数据没烘焙）→ 一律 0.5，AI 退化为不看数据。 */
function wrRate(xId, yId) {
  if (!WR_DATA || !WR_DATA.wins) return 0.5;
  const a = xId < yId ? xId : yId, b = xId < yId ? yId : xId;
  const e = WR_DATA.wins[a] && WR_DATA.wins[a][b];
  if (!e || !e.games) return 0.5;
  return (xId === a ? e.win : e.games - e.win) / e.games;
}

/* ---------- 抽卡组 / 重随机 / 烧牌 ----------
   抽取结构（用户口径）：每方各抽 3 套；己方 9 张互不重复；
   【对应两套】之间不得出现相同卡（红 i 套 ∩ 蓝 i 套 = ∅，保证永远没有同卡对决）；
   不同序号允许重复。 */
function seriesDrawSets() {
  const pool = testList().map(c => c.id);
  const all = seriesShuffle(pool);
  SERIES.sets = { L: [all.slice(0, 3), all.slice(3, 6), all.slice(6, 9)], R: [[], [], []] };
  const usedR = [];
  for (let i = 0; i < 3; i++) {
    const banned = new Set(SERIES.sets.L[i].concat(usedR));
    SERIES.sets.R[i] = seriesShuffle(pool.filter(id => !banned.has(id))).slice(0, 3);
    for (const id of SERIES.sets.R[i]) usedR.push(id);
  }
  SERIES.burned = { L: [], R: [] };
  SERIES.picks = { L: [null, null, null], R: [null, null, null] };
  SERIES.pickSel = { L: [null, null, null] };
  SERIES.burnSel = [];
}
/* 静默猎手重随机自己的第 i 套：候选 = 全池 − 己方其他套 − 敌方对应套 − 当前这套
   （当前这套也禁掉，保证"重随机必换出新卡"）。每次消耗 1 次机会。 */
function seriesRerollSet(side, i) {
  if (SERIES.rerollsLeft[side] <= 0) return false;
  const pool = testList().map(c => c.id);
  const banned = new Set();
  SERIES.sets[side].forEach((s, j) => { if (j !== i) s.forEach(id => banned.add(id)); });
  SERIES.sets[foeOf(side)][i].forEach(id => banned.add(id));
  SERIES.sets[side][i].forEach(id => banned.add(id));
  const cand = seriesShuffle(pool.filter(id => !banned.has(id)));
  if (cand.length < 3) return false;
  SERIES.sets[side][i] = cand.slice(0, 3);
  SERIES.rerollsLeft[side]--;
  return true;
}
/* 铁甲战士烧牌：burner 侧从 owner 侧的 9 张里烧掉 id（每套最多被烧 2，不会烧空）。 */
function seriesBurnCard(owner, id) {
  if (!SERIES.burned[owner].includes(id)) SERIES.burned[owner].push(id);
}

/* ---------- AI（简单难度；依据内置胜率数据） ---------- */
function aiSetScore(side, i, c) {
  /* 这张卡打"敌方对应套还活着的卡"的平均胜率 */
  const foe = SERIES.sets[foeOf(side)][i].filter(id => !SERIES.burned[foeOf(side)].includes(id));
  if (!foe.length) return 0.5;
  let s = 0;
  for (const e of foe) s += wrRate(c, e);
  return s / foe.length;
}
function aiPickSet(side, i) {
  const cands = SERIES.sets[side][i].filter(id => !SERIES.burned[side].includes(id));
  const scored = cands.map(c => ({ c, s: aiSetScore(side, i, c) })).sort((a, b) => b.s - a.s);
  /* 少数派行为：15% 概率不选最优（防每套永远同解），从次优往后的里随机挑一张 */
  if (scored.length > 1 && SERIES.rng() < AI_EPS) {
    return scored[1 + Math.floor(SERIES.rng() * (scored.length - 1))].c;
  }
  return scored[0].c;
}
function aiPicks(side) {
  for (let i = 0; i < 3; i++) SERIES.picks[side][i] = aiPickSet(side, i);
}
function aiSilentRerolls(side) {
  /* 哪套的"最优卡均分"最差就换哪套；均分都过得去就省着 */
  for (let n = 0; n < 2; n++) {
    let worst = -1, ws = 1;
    for (let i = 0; i < 3; i++) {
      const cands = SERIES.sets[side][i].filter(id => !SERIES.burned[side].includes(id));
      const s = cands.length ? Math.max(...cands.map(c => aiSetScore(side, i, c))) : 1;
      if (s < ws) { ws = s; worst = i; }
    }
    if (worst < 0 || ws >= AI_REROLL_BELOW) break;
    if (seriesRerollSet(side, worst)) {
      SERIES.aiLog.push(sideName(side) + ' [静默猎手] 重随机了第 ' + (worst + 1) + ' 套卡组');
    }
  }
}
function aiIroncladBurns(side) {
  /* 烧掉对"我"威胁最大的 2 张敌方卡：威胁 = 敌卡 e 对我对应套最优候选的胜率。
     ⚠ 铁甲整场只能烧 2 张（一次性的选牌阶段能力）：按已有烧毁数扣配额，
       绝不能把对方一整套烧空。 */
  const foe = foeOf(side);
  const quota = 2 - SERIES.burned[foe].length;
  if (quota <= 0) return;
  const threats = [];
  for (let i = 0; i < 3; i++) {
    for (const e of SERIES.sets[foe][i]) {
      if (SERIES.burned[foe].includes(e)) continue;
      let best = 0;
      for (const c of SERIES.sets[side][i]) {
        if (SERIES.burned[side].includes(c)) continue;
        best = Math.max(best, 1 - wrRate(c, e));
      }
      threats.push({ i, e, t: best });
    }
  }
  threats.sort((a, b) => b.t - a.t);
  const names = [];
  for (const th of threats.slice(0, quota)) {
    seriesBurnCard(foe, th.e);
    names.push(CARD_BY_ID[th.e].name);
  }
  if (names.length) {
    SERIES.aiLog.push(sideName(side) + ' [铁甲战士] 烧毁了 ' + sideName(foe) + '的 ' + names.join('、'));
  }
}

/* ---------- 角色战斗效果（resetMatch 之后挂到两张本体上） ---------- */
function seriesApplyCharFx() {
  world.units.forEach((u, idx) => {
    const ch = SERIES.chars[idx === 0 ? 'L' : 'R'];
    u.fxNecro = !!ch && ch.id === 'necrobinder';
    u.fxDefect = !!ch && ch.id === 'defect';
    u.fxRegent = !!ch && ch.id === 'regent';
    u.necroPend = false; u.necroT = 0; u.necroDoomPath = false;
    u.regentCd = 0;
  });
}
/* 储君撞击叠 debuff（球球碰撞段双向调用）：0.5s 触发间隔 + 上限 6 层 */
function seriesRegentHit(self, other) {
  if (!self.fxRegent || !other || !other.alive || other.dying) return;
  if (other.team === self.team) return;          // 碰撞回调对友方也会发，自己拦
  if (self.regentCd > 0) return;
  self.regentCd = REGENT.cd;
  other.weak = Math.min(REGENT.cap, other.weak + REGENT.stacks);
  other.vuln = Math.min(REGENT.cap, other.vuln + REGENT.stacks);
  world.nums.push(new DmgNum(other.x, other.y - 46, '虚弱+易伤', 'info'));
  burst(other.x, other.y, 10, { c: '#d090ff', s0: 70, s1: 240 });
  sfx('doom_apply', 0.55, 1.25);
}
/* 每步结算（stepPhysics 的死亡结算之前调用）：储君冷却 + 亡灵契约倒计时 */
function seriesTickFx(dt) {
  for (const u of world.units) {
    if (!u.alive || u.dying) continue;
    if (u.regentCd > 0) u.regentCd -= dt;
    if (u.necroPend) {
      u.necroT -= dt;
      if (u.necroT <= 0) {
        const doomPath = u.necroDoomPath;
        u.necroPend = false; u.necroDoomPath = false;
        u.fxNecro = false;                        // 摘掉契约：续死这一下不再被拦截
        if (doomPath) u.killByDoom(); else u.kill();
      }
    }
  }
}

/* 从角色选择进入正赛：掷系列种子、落定角色、抽卡组、AI 起手 */
function seriesBegin() {
  SERIES.seed = seedHash(makeSeed());
  SERIES.rng = mulberry32(SERIES.seed);
  const resolve = (side) => {
    let id = SERIES.charSel[side];
    if (!id || id === '_random') id = CHARACTERS[Math.floor(SERIES.rng() * CHARACTERS.length)].id;
    SERIES.chars[side] = CHAR_BY_ID[id];
  };
  resolve('L'); resolve('R');
  SERIES.score = { L: 0, R: 0 };
  SERIES.round = 0;
  SERIES.roundWinners = [];
  SERIES.aiLog = [];
  SERIES.battleSeeds = [null, null, null];
  seriesDrawSets();
  SERIES.rerollsLeft = {
    L: SERIES.chars.L.id === 'silent' ? 2 : 0,
    R: SERIES.chars.R.id === 'silent' ? 2 : 0
  };
  /* 组建卡组的阶段序列（用户 2026-10 口径：静默猎手的换牌在铁甲战士的烧牌【之前】，
     换牌看不见烧牌、烧牌可以针对换完的卡组出手）。按双方角色生成，没有就只剩选牌。 */
  SERIES.stages = [];
  if (SERIES.chars.L.id === 'silent' || SERIES.chars.R.id === 'silent') SERIES.stages.push('reroll');
  if (SERIES.chars.L.id === 'ironclad' || SERIES.chars.R.id === 'ironclad') SERIES.stages.push('burn');
  SERIES.stages.push('pick');
  SERIES.stageIdx = 0;
  SERIES.stageTimer = null;
  SERIES.destiny = false;                 // 天意加身每场重新计（输一局才激活）
  seriesDrawSets();
  SERIES.rerollsLeft = {
    L: SERIES.chars.L.id === 'silent' ? 2 : 0,
    R: SERIES.chars.R.id === 'silent' ? 2 : 0
  };
  SERIES.screen = 'draft';
  seriesEnterStage();
}
/* 进入当前阶段：AI 侧动作在阶段开场就做完（公开信息），玩家侧动作等待操作；
   纯 AI 阶段渲染完自动推进（定时器 + 「继续」按钮都指向同一个 seriesAdvanceStage）。 */
function seriesEnterStage() {
  const S = SERIES;
  const stage = S.stages[S.stageIdx];
  S.draftStage = stage;
  S.fxStage = true;                       // 本次 render 播"进入新阶段"的入场动画
  S.burnSel = [];
  if (stage === 'reroll') {
    for (const side of ['L', 'R']) {
      if (!S.human[side] && S.chars[side].id === 'silent') aiSilentRerolls(side);
    }
  } else if (stage === 'burn') {
    for (const side of ['L', 'R']) {
      if (!S.human[side] && S.chars[side].id === 'ironclad') aiIroncladBurns(side);
    }
  }
  seriesRender();
  /* 玩家在这个阶段没事可做（没角色 / 双 AI）→ 自动推进 */
  if (!seriesStageWantsPlayer(stage)) {
    if (S.stageTimer) clearTimeout(S.stageTimer);
    S.stageTimer = setTimeout(seriesAdvanceStage, 1500);
  }
}
/* 这个阶段玩家有没有事要做 */
function seriesStageWantsPlayer(stage) {
  const S = SERIES;
  if (stage === 'reroll') return S.human.L && S.chars.L.id === 'silent';
  if (stage === 'burn') return S.human.L && S.chars.L.id === 'ironclad';
  return S.human.L;                       // pick：玩家选牌（AI vs AI 除外）
}
function seriesAdvanceStage() {
  const S = SERIES;
  if (S.stageTimer) { clearTimeout(S.stageTimer); S.stageTimer = null; }
  if (!S.on || S.screen !== 'draft') return;
  S.stageIdx++;
  if (S.stageIdx < S.stages.length) seriesEnterStage();
  else seriesConfirmPicks();              // pick 是最后一个阶段 → 揭示
}
/* 阶段推进的统一入口（定时器 / 「继续」按钮共用） */
function seriesConfirmReroll() { seriesAdvanceStage(); }
/* 玩家铁甲确认烧牌（玩家侧动作；AI 侧已在阶段开场做完） */
function seriesConfirmBurn() {
  for (const b of SERIES.burnSel) seriesBurnCard('R', b.id);
  if (SERIES.burnSel.length) {
    SERIES.aiLog.push('红方 [铁甲战士] 烧毁了 蓝方的 ' +
      SERIES.burnSel.map(b => CARD_BY_ID[b.id].name).join('、'));
  }
  SERIES.burnSel = [];
  SERIES.fxBurn = true;                   // 烧毁卡闪一下火光
  seriesAdvanceStage();
}
/* 玩家确认出战 → 补上 AI 选牌（保密）→ 揭示 */
function seriesConfirmPicks() {
  for (let i = 0; i < 3; i++) SERIES.picks.L[i] = SERIES.pickSel.L[i];
  if (!SERIES.human.L) aiPicks('L');
  if (!SERIES.human.R) aiPicks('R');
  SERIES.screen = 'reveal';
  seriesRender();
}
/* 第 r 局：先无头预演定种子，再正式开打。
   天意加身已激活（PvE 输过一局）→ 改走 seriesDestinySearch：推演至多 50 局取最精彩的
   玩家胜局；50 局内找不到就按 50 局一档加码、至多 250 局；实在找不到 → 退回普通预演。 */
function seriesStartRound(r) {
  SERIES.round = r;
  SERIES.screen = 'battle';
  SERIES.battleDone = false;
  SERIES.battleWait = 0;
  seriesMaskShow(false);
  seriesBarShow(true);
  seriesUpdatePanels();
  const useDestiny = SERIES.mode === 'pve' && SERIES.destinyEnabled && SERIES.destiny;
  seriesBarBuild(useDestiny ? '第 ' + (r + 1) + ' 局 · 天意加身 · 推演中…' : '第 ' + (r + 1) + ' 局 · 预演中…');
  if (useDestiny) {
    /* 让"推演中…"先上屏，再开始分片推演（每片 50 局之间让出主线程刷进度） */
    setTimeout(function () { seriesDestinySearch(r); }, 30);
    return;
  }
  /* 让"预演中…"先上屏再动引擎（预演是同步阻塞的，一局约 0.1~0.3 秒） */
  setTimeout(function () {
    const seed = seriesPrerollSeed(r);
    SERIES.battleSeeds[r] = seed;
    seriesBeginBattle();
  }, 30);
}
/* 无头预演一局：超时/同死平局就换种子重掷，直到分出胜负（玩家要求 2）。
   makeHeadless 静音 + 假画布；跑完 endHeadless 取回真画布，正式对局用同种子
   重演 —— 引擎决定论保证两遍一模一样。 */
function seriesPrerollSeed(r) {
  const cl = CARD_BY_ID[SERIES.picks.L[r]], cr = CARD_BY_ID[SERIES.picks.R[r]];
  makeHeadless();
  let seed = null, k = 0;
  for (; ;) {
    seed = seriesBattleSeed(r, k);
    runFullMatch(cl, cr, seed);
    const o = world.over;
    if (o && (o.win === 0 || o.win === 1)) break;
    k++;
    if (k > 50) { break; }               // 兜底（烘焙数据口径下超时本就罕见）
  }
  endHeadless();
  SERIES.battleRetry = k;
  return seed;
}
/* ---------- 天意加身（PvE 专属，输了才生效） ----------
   「最精彩」的口径与开发者面板的筛选功能同源：
   ① 命中的精彩标签数（collectTags 同一份 tags）为主；
   ② 逆转幅度（behind，面板的「逆转」指标）与胜者最低血量（minHp，越低越险）为辅。
   只存整数胜场没这条的事——这里比较的是整场对局的质量，允许用加权分数。 */
function destinyScore(rec) {
  let s = (rec.tags ? rec.tags.length : 0) * 100;
  s += Math.round((rec.behind ? rec.behind[rec.win] || 0 : 0) * 100);   // 逆转幅度 0~1
  s += Math.round((1 - (rec.minHp ? rec.minHp[rec.win] : 1)) * 50);     // 胜者越残越险
  return s;
}
/* 同步推演一段种子区间 [k0, k1)：返回其中"玩家获胜"的对局（{seed, rec, sc}）。
   超时/同死（win===-1）自动跳过 —— 它们既不是胜局也打不出结果。 */
function seriesDestinyScan(r, k0, k1) {
  const cl = CARD_BY_ID[SERIES.picks.L[r]], cr = CARD_BY_ID[SERIES.picks.R[r]];
  makeHeadless();
  const wins = [];
  for (let k = k0; k < k1; k++) {
    const seed = seriesBattleSeed(r, 1000 + k);    // 1000 起步：与普通预演的种子空间错开
    runFullMatch(cl, cr, seed);
    const rec = matchRecord(seed);
    if (rec.win === 0) wins.push({ seed, rec, sc: destinyScore(rec) });
  }
  endHeadless();
  return wins;
}
/* 分片推演：每片 50 局（约 1.5~2 秒），片与片之间让出主线程刷进度。
   某一片扫完只要已有玩家胜局就收手；扫满 250 局仍无胜局 → 返回 null（调用方退回普通预演）。 */
function seriesDestinySearch(r) {
  const CHUNK = 50, MAX = 250;
  let k = 0, wins = [];
  const step = () => {
    if (!SERIES.on || SERIES.screen !== 'battle') { endHeadless(); return; }  // 中途退出系列赛就停
    wins = wins.concat(seriesDestinyScan(r, k, Math.min(k + CHUNK, MAX)));
    k = Math.min(k + CHUNK, MAX);
    seriesBarBuild('第 ' + (r + 1) + ' 局 · 天意加身 · 已推演 ' + k + ' 局 · 你的胜局 ' + wins.length);
    if (wins.length || k >= MAX) {
      if (!wins.length) {                          // 天意未应：退回普通预演兜底
        SERIES.battleSeeds[r] = seriesPrerollSeed(r);
        seriesBeginBattle();
        return;
      }
      wins.sort((a, b) => b.sc - a.sc);
      SERIES.battleSeeds[r] = wins[0].seed;
      SERIES.battleRetry = -1;                     // 比分条用 -1 标记"天意加身"局
      seriesBeginBattle();
      return;
    }
    SERIES.destinyTimer = setTimeout(step, 0);
  };
  step();
}
function seriesBeginBattle() {
  const cl = CARD_BY_ID[SERIES.picks.L[SERIES.round]];
  const cr = CARD_BY_ID[SERIES.picks.R[SERIES.round]];
  resetMatch(cl, cr, SERIES.battleSeeds[SERIES.round]);
  world.autoStop = true;                 // 打完自动停（结算横幅 + 局间推进）
  world.running = true;
  SERIES.screen = 'battle';
  SERIES.battleDone = false;
  SERIES.battleWait = 0;
  btnStart.disabled = true; btnPause.disabled = false; btnPause.textContent = '暂停';
  seedTagTick(true);
  sfx('battle_start_1', 0.85);
  playIntro();
  bgmSeriesPlay();                           // 整场系列赛同一首曲子连续播（已在放就续播）
  seriesBarBuild();
}
/* 战斗结束（seriesFrame 等结算横幅播完后调）→ 计分 → 下一局或结算。
   ⚠ BGM 不在这里停 —— 一整场系列赛连续播同一首（seriesExit 才停）。 */
function seriesRoundEnd() {
  const w = world.over ? world.over.win : -1;
  world.running = false;
  btnPause.disabled = true;
  if (w === 0 || w === 1) {
    const side = w === 0 ? 'L' : 'R';
    SERIES.score[side]++;
    SERIES.roundWinners.push({ win: side, name: CARD_BY_ID[SERIES.picks[side][SERIES.round]].name });
    /* 天意加身：PvE 里只要输了一局，之后的每一局都推演（激活后不关） */
    if (SERIES.mode === 'pve' && SERIES.destinyEnabled && side === 'R' && !SERIES.destiny) {
      SERIES.destiny = true;
      SERIES.aiLog.push('【天意加身】已应验：后续每局将为你暗中推演最优胜局');
    }
  } else {
    /* 理论上被预演兜住了；真发生就同种子重打，绝不带着平局往下走 */
    seriesBeginBattle();
    return;
  }
  if (SERIES.score.L >= 2 || SERIES.score.R >= 2) {
    SERIES.screen = 'end';
  } else {
    SERIES.screen = 'roundend';
  }
  seriesRender();
  seriesMaskShow(true);
}

function seriesReplayRound() {

  seriesBeginBattle();

/* 空格：战斗结束等待期间 = 跳过等待立刻结算；其余 = 暂停/继续 */
function seriesSpace() {
  if (SERIES.screen !== 'battle') return;
  if (world.over && !SERIES.battleDone) {
    SERIES.battleDone = true;
    seriesRoundEnd();

    pauseToggle();

}
/* 每帧（frame() 调）：战斗结束后等结算横幅播完再推进 */
function seriesFrame(raw) {
  if (!SERIES.on) return;
  if (SERIES.screen === 'battle' && !SERIES.battleDone && world.over) {
    SERIES.battleWait += raw;
    if (SERIES.battleWait >= 2.3) {

/* ============================================================
   11. 主循环
   ============================================================ */
/* 固定步长累加器：真实时间 → 若干个 SIM_DT。
   raw 上限放宽到 0.5s：4× 倍速时一帧要推进 4 倍步数，卡帧后也能追上。 */
let lastT = 0, accT = 0;                  // accT = 待推进的真实时间（秒）
function frame(ts) {
  /* lastT < 0 = 刚开新局（resetMatch 置的），这一帧只对表、不推进：
     否则上一局/暂停期间攒下的时间差会在开局瞬间灌进来，同一个种子就跑出不同结果。 */
  if (lastT < 0) lastT = ts;
  const raw = Math.min(0.5, Math.max(0, (ts - lastT) / 1000 || 0));
  lastT = ts;
  if (world.running && !world.over) {
    accT += raw * world.speedMul;
    /* 该走几步 = floor(累计时间 × 120)，加容差抹掉浮点灰尘；
       accT 只减掉"整步"，不足一步的零头留到下一帧，所以每帧步数可能 1/2 跳动，
       但累计步数严格等于 floor(累计时间 × 120) —— 与帧率、抖动都无关。 */
    let want = Math.floor(accT * SIM_HZ + ACC_DUST);
    if (want > MAX_STEPS_PER_FRAME) { want = MAX_STEPS_PER_FRAME; accT = 0; }   // 追不上就丢掉积压
    for (let i = 0; i < want && !world.over; i++) { accT -= SIM_DT; stepOnce(); }
  } else accT = 0;
  if (world.shake > 0) world.shake = Math.max(0, world.shake - raw * 60);
  tickIntro(raw);              // 战斗开始过场按【真实时间】走，不受倍速影响
  tickOver(raw);               // 结算横幅的入场演出（同样按真实时间）
  /* SERIES_HOOK_START */
  seriesFrame(raw);            // 系列赛：局间推进/比分条（内部第一行就判 SERIES.on，经典模式零开销）
  /* SERIES_HOOK_END */
  drawArena();
  drawOverlayBanner();
  drawStartIntro();
  if (typeof devFrame === 'function') devFrame();                  // 开发者模式：批量预演/重现进度
  seedTagTick();                                                   // 右下角种子角标（内容变了才写 DOM）
  requestAnimationFrame(frame);
}
