/* ============================================================
   7.7.5 陨石打击 —— 收集等离子球降下陨石重击
   ============================================================ */
/* 等离子充能球。
   state: idle（原地悬停，等本体靠近）
          attract（本体进入 grabR → 被吸过去）
          orbit（围着本体转：按槽位均匀分布，缓慢整体旋转）
          scatter（陨石轰击后从落点崩出来，速度衰减 + 撞墙反弹，减速后回到 idle）
   ⚠ 收集方式按用户口径：**球不动，本体移动到球附近才把它吸过来**。
     上一版写成了"球自己朝本体飞"，方向正好反了。
   ⚠ 入轨不能"瞬移"（用户 2026 修订"过渡要更平滑"）：
     半径从当前距离沿 orbitEase 指数收敛到 orbitR，角度从当前方位缓和到槽位角，
     于是被吸过来是【螺旋滑进轨道】的，而不是到点直接跳到轨道半径上。 */
class PlasmaOrb extends Effect {
  constructor(owner, x, y, p) {
    super();
    this.o = owner; this.p = p;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.state = 'idle'; this.ang = rand(0, TAU);
    this.scale = 1; this.life = 0; this.spin = 2.6;
    this.trailT = 0;
    this.x0 = x; this.y0 = y;                     // 悬停时的锚点（停住后一动不动）
    this.tmp = false;                             // 是否属于"本轮收集"（集齐即消耗的那三颗）
    /* 出生演出（用户 2026 口径："初始等离子球出现太突兀，处理得自然一点"）：
       bornDelay > 0 时球【完全不存在于画面】（连光环都没有）；
       倒计时走完 → bornT 从 0 涨到 bornDur，球从 0 号弹性放大到正常大小（轻微过冲），
       浮现瞬间补一圈收敛光环 + 一声短音。开局那一波由 spawnInitial 给三颗球
       错开 bornDelay，一颗接一颗浮现，而不是同时蹦出来。
       默认 bornT = 1 ≥ bornDur = 0.45 → 陨石崩出来的球不走这套（本来就有散开动作）。 */
    this.bornDelay = 0; this.bornT = 1; this.bornDur = 0.45; this.bornPitch = 1.0;
    /* 环绕队形用的四个量（由 MechMeteorStrike 每帧发下来）：
       oAng 当前位置角、oR 当前半径、slot 槽位序号、orbitN 球总数、orbitBase 队形基准角 */
    this.oAng = 0; this.oR = 0;
    this.slot = 0; this.orbitN = 1; this.orbitBase = 0;
  }
  /* 本球所属的"陨石打击"机制（延迟取：构造这台机制时 owner.mech 还没赋值完）。 */
  mech() {
    const m = this.o && this.o.mech;
    return (m && m.orbitOrbs) ? m : null;
  }
  update(dt) {
    const p = this.p, o = this.o;
    /* 出生演出还没轮到：这颗球完全不出现在画面上，也【不会被本体吸走】
       （update 在这里直接跳过，下面的 grab 判定根本不会跑）。 */
    if (this.bornDelay > 0) {
      this.bornDelay -= dt;
      if (this.bornDelay <= 0) {
        this.bornDelay = 0;
        /* 浮现瞬间：一圈收敛光环 + 几粒光点 + 一声短音（音高逐颗升高） */
        world.effects.push(new Ring(this.x, this.y, 3, 40, 0.35, '#8ff0e0', 2.2));
        burst(this.x, this.y, 5, { c: '#8ff0e0', s0: 30, s1: 110 });
        sfx('plasma_orb_channel', 0.4, this.bornPitch, 0.04);
      }
      return;
    }
    /* 浮现中：bornT 涨到 bornDur 为止（draw 里据此算放大曲线） */
    if (this.bornT < this.bornDur) this.bornT = Math.min(this.bornDur, this.bornT + dt);
    this.life += dt;
    this.ang += this.spin * dt;
    const alive = o.alive && !o.dying;
    const dist = Math.hypot(o.x - this.x, o.y - this.y);
    if (this.state === 'idle') {
      /* 原地悬停 —— 【完全静止】。
         ⚠ 2026 修订：原来这里有一句"悬停呼吸"（x0 + sin(t) × 26 × 0.35，参数 hoverR），
         于是【速度为 0】的等离子球会在锚点上来回晃（用户报的就是这个）。
         现在坐标恒等于锚点：球一旦停下来就定死在那，只保留自转（this.ang）
         和拖尾光点，位置不再抖动。本体一进 grabR 就被吸走。 */
      this.x = this.x0; this.y = this.y0;
      if (alive && dist < p.grabR) {
        this.state = 'attract';
        sfx('plasma_orb_channel', 0.5, 1.25, 0.04);
        burst(this.x, this.y, 8, { c: '#8ff0e0', s0: 50, s1: 180 });
      }
    } else if (this.state === 'attract') {
      /* 被吸过来：朝本体飞；到 orbitR+enterPad 就【入轨】（不是直接贴上去）。
         ⚠ 入轨方位必须用【非零的位移】算：被吸到与本体几乎重合时
         Math.atan2(0, 0) 在某些实现里返回 NaN，一旦写进角度就永远修不回来
         （orb.x = o.x + cos(NaN)*R = NaN），整张卡直接报废 —— 踩过。 */
      if (!alive) { this.dead = true; return; }
      const dx = o.x - this.x, dy = o.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d <= p.orbitR + p.enterPad) {
        this.state = 'orbit';
        const ux = this.x - o.x, uy = this.y - o.y;
        this.oAng = (Math.abs(ux) + Math.abs(uy) > 1e-3) ? Math.atan2(uy, ux) : rand(0, TAU);
        this.oR = Math.max(1, d);
        sfx('plasma_orb_channel', 0.32, 1.4, 0.05);
        burst(this.x, this.y, 7, { c: '#8ff0e0', s0: 44, s1: 160 });
      } else {
        const step = Math.min(d, p.enterSpd * dt);
        this.x += dx / d * step;
        this.y += dy / d * step;
      }
    } else if (this.state === 'orbit') {
      if (!alive) { this.dead = true; return; }
      if (!isFinite(this.oAng)) this.oAng = rand(0, TAU);
      if (!isFinite(this.oR)) this.oR = p.orbitR;
      /* 队形：槽位角 = 基准角 + slot/n×360°（2 颗 180°、3 颗 120°），
         半径与角度都指数收敛 —— 平滑入轨 + 平滑换位。 */
      const n = Math.max(1, this.orbitN);
      const tgt = this.orbitBase + (this.slot % n) / n * TAU;
      const k = Math.min(1, dt * p.orbitEase);
      this.oAng += wrapPi(tgt - this.oAng) * k;
      this.oR += (p.orbitR - this.oR) * k;
      this.x = o.x + Math.cos(this.oAng) * this.oR;
      this.y = o.y + Math.sin(this.oAng) * this.oR;
      /* 蓄势（集齐三颗、原地等一会儿再吸收）：球体轻轻脉动，读起来像"在充能" */
      const m = this.mech();
      this.scale = (m && m.state === 'hold') ? 1 + 0.18 * Math.sin(world.t * 11) : 1;
      /* ⚠ 环绕的等离子球【不造成任何伤害】（用户 2026 口径）。
         上一版这里有一层"贴身灼伤"（orbDrain，180/s 扣 2%），环绕球擦到敌人就悄悄掉血，
         既看不清来源、也和"收集球"的定位冲突 —— 整段连同 orbDrain 参数一起删掉。 */
    } else {
      /* 逸散：速度指数衰减 + 撞墙反弹；慢下来之后就地悬停，等本体过来吸。 */
      const dr = Math.exp(-dt / p.scatterDecay);
      this.vx *= dr; this.vy *= dr;
      this.x += this.vx * dt; this.y += this.vy * dt;
      const r = 14;
      let bounced = false;
      if (this.x < r) { this.x = r; this.vx = Math.abs(this.vx); bounced = true; }
      else if (this.x > CFG.AW - r) { this.x = CFG.AW - r; this.vx = -Math.abs(this.vx); bounced = true; }
      if (this.y < r) { this.y = r; this.vy = Math.abs(this.vy); bounced = true; }
      else if (this.y > CFG.AH - r) { this.y = CFG.AH - r; this.vy = -Math.abs(this.vy); bounced = true; }
      if (bounced) sfx('blunt_attack', 0.18, 1.5, 0.06);
      /* ⚠ 逸散途中【也能被收集】（用户 2026 口径："只要一被生成出来就能被收集"）——
         上一版必须等它减速到 <26 变成 idle 才认，陨石刚崩出来的那几颗要等一会儿。 */
      if (alive && Math.hypot(o.x - this.x, o.y - this.y) < p.grabR) {
        this.state = 'attract';
        sfx('plasma_orb_channel', 0.5, 1.25, 0.04);
        burst(this.x, this.y, 8, { c: '#8ff0e0', s0: 50, s1: 180 });
      } else if (Math.hypot(this.vx, this.vy) < 26) {
        /* 停下来了 → 变成一颗"待收集"的悬停球 */
        this.state = 'idle';
        this.x0 = this.x; this.y0 = this.y;
      }
    }
    /* 拖尾光点 */
    this.trailT -= dt;
    if (this.trailT <= 0) {
      this.trailT = 0.05;
      world.effects.push(new Spark(this.x, this.y, { c: '#8ff0e0', s0: 6, s1: 34 }));
    }
    /* 兜底：任何一个环节把坐标算成 NaN/Infinity 都直接判死，
       绝不让它污染 MechMeteorStrike 的收集计数（上一版就是这么卡死的）。 */
    if (!isFinite(this.x) || !isFinite(this.y) || !isFinite(this.ang)) this.dead = true;
  }
  draw(ctx) {
    const p = this.p, im = IMG['sp_plasma_orb'];
    /* 出生演出还没轮到 → 一根线都不画 */
    if (this.bornDelay > 0) return;
    /* 浮现曲线：easeOutBack 轻微过冲（长到约 1.09 倍再落回 1），比线性放大自然 */
    const bk = clamp(this.bornT / this.bornDur, 0, 1);
    const c1 = 1.70158, c3 = c1 + 1;
    const bornS = Math.max(0, 1 + c3 * Math.pow(bk - 1, 3) + c1 * Math.pow(bk - 1, 2));
    const s = p.orbR * 2.6 * this.scale * bornS;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 青绿色外辉光
    const fade = this.state === 'scatter' ? clamp(1 - this.life / p.scatterLife, 0.15, 1) : 1;
    ctx.globalAlpha = 0.38 * fade * bk;
    ctx.fillStyle = '#7fe8d8';
    ctx.beginPath(); ctx.arc(this.x, this.y, p.orbR * 1.7 * bornS, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = fade * bk;
    if (im) {
      ctx.translate(this.x, this.y);
      ctx.rotate(this.ang);
      ctx.drawImage(im, -s / 2, -s / 2, s, s);
    } else {
      ctx.fillStyle = '#7fe8d8';
      ctx.beginPath(); ctx.arc(this.x, this.y, p.orbR, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* 巨型陨石：从斜上方一定范围内的随机角度落下，落点提前预警。 */
class BigMeteor extends Effect {
  constructor(tx, ty, sx, sy, p, owner) {
    super();
    this.tx = tx; this.ty = ty; this.p = p; this.owner = owner;
    this.x = sx; this.y = sy;
    const d = Math.hypot(tx - sx, ty - sy) || 1;
    this.ux = (tx - sx) / d; this.uy = (ty - sy) / d;
    this.ang = Math.atan2(this.uy, this.ux);
    this.t = -p.warn;
    this.rot = vrand(0, TAU, 'vrand');
    this.landed = false;
  }
  update(dt) {
    this.t += dt;
    if (this.t < 0) return;
    const sp = this.p.fallSpd;
    this.x += this.ux * sp * dt;
    this.y += this.uy * sp * dt;
    this.rot += dt * 3.2;
    this.emit(dt);
    if ((this.x - this.tx) * this.ux + (this.y - this.ty) * this.uy >= 0 ||
        Math.hypot(this.tx - this.x, this.ty - this.y) < sp * dt + 6) {
      this.x = this.tx; this.y = this.ty;
      this.land();
    }
  }
  emit(dt) {
    this.eAcc = (this.eAcc || 0) + dt;
    while (this.eAcc > 0.02) {
      this.eAcc -= 0.02;
      const sp = new Spark(this.x - this.ux * 30, this.y - this.uy * 30, { c: '#ffb06a', s0: 30, s1: 160 });
      world.effects.push(sp);
    }
  }
  land() {
    if (this.landed) return;
    this.landed = true; this.dead = true;
    meteorImpact(this.tx, this.ty, this.p, this.owner);
    /* 落地这一刻通知机制（「陨石打击」靠它在【陨石落地时】才生成下一批等离子球，
       见 MechMeteorStrike.onMeteorLand）。 */
    const m = this.owner && this.owner.mech;
    if (m && m.onMeteorLand) m.onMeteorLand(this.tx, this.ty);
  }
  draw(ctx) {
    /* 前摇：落点预告圈 + 一条从落点指向来袭方向的虚线 */
    if (this.t < 0) {
      const k = 1 + this.t / this.p.warn;
      ctx.save();
      ctx.translate(this.tx, this.ty);
      ctx.globalAlpha = 0.45 + 0.4 * Math.sin(world.t * 16);
      ctx.strokeStyle = '#9ff0dc'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, this.p.hitR * (0.35 + 0.65 * k), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 0.75; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, this.p.hitR, 0, TAU); ctx.stroke();
      const L = 220;
      ctx.globalAlpha = 0.25;
      ctx.setLineDash([14, 12]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-this.ux * L, -this.uy * L); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.9; ctx.fillStyle = '#d8fff4';
      ctx.beginPath(); ctx.arc(0, 0, 6 + 3 * k, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }
    /* 飞行中的巨石 + 长长的火焰拖尾 */
    const im = IMG['sp_meteor_rock'];
    const g = ctx.createLinearGradient(this.x, this.y, this.x - this.ux * 300, this.y - this.uy * 300);
    g.addColorStop(0, 'rgba(255,190,120,.75)');
    g.addColorStop(0.45, 'rgba(220,110,60,.32)');
    g.addColorStop(1, 'rgba(160,60,40,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(this.x + this.uy * 34, this.y - this.ux * 34);
    ctx.lineTo(this.x - this.ux * 330 + this.uy * 16, this.y - this.uy * 330 - this.ux * 16);
    ctx.lineTo(this.x - this.ux * 330 - this.uy * 16, this.y - this.uy * 330 + this.ux * 16);
    ctx.lineTo(this.x - this.uy * 34, this.y + this.ux * 34);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    const S = 128;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    if (im) ctx.drawImage(im, -S / 2, -S / 2, S, S);
    else { ctx.fillStyle = '#6b4038'; ctx.beginPath(); ctx.arc(0, 0, S / 2, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

/* 陨石落点结算：范围伤害（中心 300 → 边缘 200）+ 强击退 + 烟尘。 */
function meteorImpact(x, y, p, owner) {
  world.shake = 22;
  world.effects.push(new Ring(x, y, 16, p.hitR * 1.5, 0.62, '#9ff0dc', 6));
  world.effects.push(new Ring(x, y, 8, p.hitR * 0.72, 0.42, '#ffe2b0', 4));
  burst(x, y, 54, { c: '#ffc98a', s0: 160, s1: 620 });
  burst(x, y, 34, { c: '#8ff0e0', s0: 120, s1: 460 });
  world.effects.push(new MeteorSmoke(x, y, p.hitR));
  sfx('heavy_attack', 1.0, 0.55);
  sfx('doom_apply', 0.8, 0.6);
  for (const e of world.enemiesOf(owner)) {
    if (e.dying) continue;
    const dx = e.x - x, dy = e.y - y;
    const d = Math.hypot(dx, dy);
    if (d >= p.hitR) continue;
    /* 伤害随"离中心的距离"从 dmgMax 线性衰减到 dmgMin */
    const k = clamp(d / p.hitR, 0, 1);
    const dmg = Math.round(p.dmgMax + (p.dmgMin - p.dmgMax) * k);
    e.damage(dmg, 'hit', owner);
    if (d > 1) e.knock(dx, dy, p.knock, p.knockCap);
    else e.knock(0, 1, p.knock, p.knockCap);
  }
}

/* 轰击烟尘：原版 vfx_rock_shatter_smoke 是一张 8 帧横排翻页图（每帧 384 宽）。 */
class MeteorSmoke extends Effect {
  constructor(x, y, hitR) {
    super();
    this.x = x; this.y = y;
    this.t = 0; this.life = 0.72;
    this.r = hitR;
    this.drawUnder = false;
  }
  update(dt) { this.t += dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const im = IMG['sp_meteor_smoke'];
    const k = clamp(this.t / this.life, 0, 1);
    const a = (1 - k) * 0.85;
    if (im) {
      const fw = im.naturalWidth / 8, fh = im.naturalHeight;
      const f = Math.min(7, Math.floor(k * 8));
      const w = this.r * 2.1, h = w * (fh / fw);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.drawImage(im, f * fw, 0, fw, fh, this.x - w / 2, this.y - h / 2, w, h);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = '#8a6a52';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r * (0.5 + k), 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

class MechMeteorStrike {
  constructor(u, p) {
    this.u = u; this.p = p;
    /* ⚠ 只有【一本账】：all = 本机制造出来的所有球（开局撒的 + 每次陨石落地崩的）。
       用户 2026 口径"等离子球只要一被生成出来就能被收集" ——
       所以不再分 collect/field 两本账、也不需要 promote() 把流浪球提上来：
       任何一颗活着的球都能被吸、都能算进"集齐三颗"。
       环绕队形的槽位按 all 的顺序发（顺序稳定 → 球不会互相抢位置）。 */
    this.all = [];
    this.orbitBase = 0;              // 队形基准角：所有环绕球共用、缓慢旋转
    this.state = 'collect';
    this.timer = 0;
    this.batchCd = 0;
    this.aim = { x: CFG.AW / 2, y: CFG.AH / 2 };
    /* 开局第一波球的浮现倒计时（用户 2026 口径："三颗初始等离子球改为在战斗开始后
       1 秒才浮现"）。倒计时走完才真的撒球 —— 之前是构造器里直接 spawnInitial()，
       战斗开始那一帧球就杵在场地上了。
       ⚠ 只延迟【开局这一波】：陨石落地崩出来的球照旧在落地那一刻立刻生成
         （onMeteorLand），补球兜底 craterBatch 也不受它影响。 */
    this.orbDelay = p.spawnDelay;
  }
  /* 正在环绕本体飞的球（创建顺序，稳定）。 */
  orbitOrbs() {
    return this.all.filter(o => !o.dead && o.state === 'orbit' && o.o === this.u);
  }
  /* 还活着的球（悬停 / 被吸 / 环绕 / 逸散都算）。 */
  liveOrbs() { return this.all.filter(o => !o.dead); }
  /* 开战延迟 orbDelay 秒后，在随机位置撒 orbN 颗
     （**只有开局这一波是随机的、也只有这一波是延迟的**）。
     ⚠ 浮点步长别把这一秒挤掉：用减法累加器（和祭品/电球同一套写法）——
       120Hz 下 SIM_DT 累加 120 次正好 ≈ p.spawnDelay，减法式不会被抖掉。 */
  spawnInitial() {
    const p = this.p, u = this.u, m = 90;
    for (let i = 0; i < p.orbN; i++) {
      const x = rand(m, CFG.AW - m), y = rand(m, CFG.AH - m);
      const o = new PlasmaOrb(u, x, y, p);
      o.tmp = true;
      /* 出生演出：三颗球【错开浮现】（间隔 spawnStagger），一颗接一颗凝聚出来，
         不再同时凭空蹦出。光环/光点/音效都挪到球真正浮现的那一刻播放
         （见 PlasmaOrb.update 的 bornDelay 段）—— 倒计时刚起步时不响不闪。 */
      o.bornDelay = i * p.spawnStagger;
      o.bornT = 0;
      o.bornPitch = 0.95 + i * 0.16;
      world.effects.push(o);
      this.all.push(o);
    }
  }
  update(dt) {
    const p = this.p, u = this.u;
    /* 开局第一波：倒计时走完才浮现（本体已阵亡就干脆不撒了） */
    if (this.orbDelay > 0) {
      this.orbDelay -= dt;
      if (this.orbDelay <= 0) {
        this.orbDelay = 0;
        if (u.alive && !u.dying) this.spawnInitial();
      }
    }
    this.all = this.all.filter(o => !o.dead);
    /* 环绕队形（用户 2026 修订）：基准角缓慢自转，槽位按顺序发下去 ——
       球因此自动【均匀分布】（2 颗 180°、3 颗 120°）；
       中途有球退出/消失时，剩下的球会自动重新排开。 */
    this.orbitBase += p.orbitSpin * dt;
    const orbs = this.orbitOrbs();
    for (let i = 0; i < orbs.length; i++) {
      orbs[i].slot = i; orbs[i].orbitN = orbs.length; orbs[i].orbitBase = this.orbitBase;
    }
    if (this.state === 'collect') {
      if (!u.alive || u.dying) return;
      /* ⚠ 开局那 1 秒的浮现倒计时里 `all` 必然是空的 —— 绝不能在这里判定
         "场上没球了"而触发兜底补球（craterBatch 的 batchCd 初值就是 0，
         不加这道闸门会在第一帧立刻崩出一批 scatter 球，倒计时也就白等了）。 */
      if (this.orbDelay > 0) return;
      if (this.all.length === 0) {
        /* 场上真的一颗球都不剩（理论上不会） → 过一会儿从最近的落点崩一批 */
        this.batchCd -= dt;
        if (this.batchCd <= 0) { this.batchCd = p.batchGap; this.craterBatch(); }
        return;
      }
      /* 环绕轨上有 orbN 颗 → 先原地蓄势 holdT 秒，再吸收 */
      if (orbs.length >= p.orbN) this.beginHold();
      return;
    }
    if (this.state === 'hold') {
      /* 蓄势：本体原地静止，三颗球围着它轻轻脉动转一小会儿，
         然后才被吸收（用户口径："收集到三颗时原地等一会再让球被吸收"）。 */
      u.freeze = Math.max(u.freeze, 0.05);
      this.timer -= dt;
      if (this.timer <= 0) this.beginStrike();
      return;
    }
    if (this.state === 'cast') {
      u.freeze = Math.max(u.freeze, 0.05);        // 原地静止
      /* 蓄力期间持续跟踪敌人的【当前位置】——陨石在"发射那一刻"才锁定落点。
         这张卡要打中才有意义：1.6 秒前锁死位置的话，对手 150px/s 一走就基本全空。 */
      const e0 = world.enemyOf(u);
      if (e0) { this.aim.x = e0.x; this.aim.y = e0.y; }
      this.timer -= dt;
      if (this.timer <= 0) this.launch();
      return;
    }
    if (this.state === 'recover') {
      this.timer -= dt;
      if (this.timer <= 0) this.reset();
    }
  }
  /* 兜底补球：从最后一处落点（没有就用场地中心）崩出 orbN 颗 */
  craterBatch() {
    const p = this.p, u = this.u;
    const bx = this.aim.x, by = this.aim.y;
    for (let i = 0; i < p.orbN; i++) {
      const a = rand(0, TAU);
      const o = new PlasmaOrb(u, bx, by, p);
      o.state = 'scatter';
      o.vx = Math.cos(a) * rand(p.scatterMin, p.scatterMax);
      o.vy = Math.sin(a) * rand(p.scatterMin, p.scatterMax);
      world.effects.push(o);
      this.all.push(o);
    }
    sfx('plasma_orb_evoke', 0.7, 1.2);
  }
  /* 集齐三颗 → 原地蓄势：本体静止 holdT 秒，球在身周脉动，
     之后才被吸收、进入陨石蓄力。 */
  beginHold() {
    const p = this.p, u = this.u;
    this.state = 'hold'; this.timer = p.holdT;
    world.effects.push(new Ring(u.x, u.y, 14, p.orbitR + 44, 0.5, '#8ff0e0', 3.4));
    world.nums.push(new DmgNum(u.x, u.y - 62, '等离子集齐', 'info'));
    sfx('plasma_orb_evoke', 0.9, 0.9);
    sfx('dark_orb_channel', 0.5, 1.0);
  }
  beginStrike() {
    const p = this.p, u = this.u;
    /* 吸收【所有正在环绕的球】（= 集齐的那几颗）：球原地炸成光点 + 往本体吸一道光。
       场上还有别的球（比如那批没被捡的）就留着，下一轮照样能收。 */
    for (const o of this.orbitOrbs()) {
      o.dead = true;
      burst(o.x, o.y, 10, { c: '#8ff0e0', s0: 60, s1: 220 });
    }
    this.state = 'cast'; this.timer = p.castT;
    const e = world.enemyOf(u);
    if (e) { this.aim.x = e.x; this.aim.y = e.y; }
    else { this.aim.x = u.x; this.aim.y = u.y; }
    world.effects.push(new Ring(u.x, u.y, 20, 150, 0.6, '#8ff0e0', 4));
    world.effects.push(new Ring(u.x, u.y, 8, 90, 0.34, '#ddfff6', 3));
    sfx('plasma_orb_evoke', 0.9, 1.06);
    sfx('dark_orb_channel', 0.7, 0.9);
  }
  launch() {
    const p = this.p, u = this.u;
    /* 从斜上方一定范围内随机角度落下：
       取 [50°,130°]（以 +x 为 0°、y 向下，90° 即正上方），
       起点放在屏幕外，飞行方向指向落点。 */
    const a = (50 + rand(0, 80)) * Math.PI / 180;
    const D = 520;
    const sx = this.aim.x - Math.cos(a) * D, sy = this.aim.y - Math.sin(a) * D;
    world.effects.push(new BigMeteor(this.aim.x, this.aim.y, sx, sy, p, u));
    this.state = 'recover'; this.timer = 0.9;
    sfx('doom_apply', 0.6, 0.85);
  }
  /* 陨石【落地的那一刻】从坑里崩出三颗等离子球（速度不等、撞墙反弹）。
     用户 2026 口径："等离子球应该在陨石落地时才生成" ——
     上一版是等 recover 结束、reset() 时才撒，画面上会看到陨石先砸完、
     隔将近 1 秒坑里才冒出球来。
     这一批同样进 all —— 它们一冒出来就能被收集（用户 2026 口径）。 */
  onMeteorLand(x, y) {
    const p = this.p, u = this.u;
    for (let i = 0; i < p.orbN; i++) {
      const a = rand(0, TAU);
      const sp = rand(p.scatterMin, p.scatterMax);
      const o = new PlasmaOrb(u, x, y, p);
      o.state = 'scatter';
      o.vx = Math.cos(a) * sp; o.vy = Math.sin(a) * sp;
      o.spin = rand(2.0, 5.0);
      world.effects.push(o);
      this.all.push(o);
    }
    sfx('plasma_orb_evoke', 0.8, 1.1);
  }
  reset() {
    /* ⚠ 这里【不再】生成等离子球：球在陨石落地那一瞬间就生成了（见 onMeteorLand）。 */
    this.state = 'collect';
    this.batchCd = this.p.batchGap;
  }
  /* 头顶不显示任何文字（用户 2026 口径：五张测试版卡牌头顶一律不要文字描述 ——
     原来的"等离子 0/3"就在这里）。 */
  statusText() { return null; }
}
MECHS.meteor_strike = MechMeteorStrike;

/* ============================================================
   8. 引擎
   ============================================================ */
/* 固定步长累加器：真实时间 → 若干个 SIM_DT。
   累加的是【整数微步】而不是浮点秒数：真实帧间隔常常正好是 SIM_DT 的整数倍
   （60Hz = 2×、120Hz = 1×、30Hz = 4×），浮点误差会让"2×SIM_DT"有时刚好差一点点不够，
   于是一帧该走 2 步却只走 1 步 —— 同一个种子就会因为帧率/抖动跑出不同结果。
   改成整数计数后，步数严格等于 floor(累计真实时间 / SIM_DT)，与帧率抖动无关。
   注意 floor 前要加一个极小容差：60Hz 的帧间隔是 1000/60 ms，浮点表示会略小于
   理论值，"正好 2×SIM_DT" 会算成 1.999999… 而被 floor 成 1 步 —— 一帧少一步，
   几分钟下来就整局跑偏。加 1e-9 秒的容差把这点灰尘抹掉。 */
const SIM_HZ = 120;
const SIM_DT = 1 / SIM_HZ;
const ACC_DUST = 1e-9;                 // 抹掉时间戳浮点灰尘的容差（秒）
const MAX_STEPS_PER_FRAME = 2400;      // 防御：单帧最多推进 20 秒游戏时间

/* 开始一局。seed 传 undefined = 现掷一个新的（真人玩：每局都不一样）；
   传具体值 = 重现该种子（开发者模式的"种子重现"）。 */
function resetMatch(cardL, cardR, seed) {
  world.units = []; world.effects = []; world.nums = [];
  world.t = 0; world.over = null; world.shake = 0;
  world.decideHp = null; world.decideT = undefined;   // 上一局的"分出胜负那一刻"快照作废
  graceClear();                // 任何新局都把上一局残留的「空悲切」护体状态清掉
  /* 清掉主循环的"时间欠账"：accT 是上局/暂停期间攒下的时间，
     不清的话新开一局的前几帧会一口气补跑几十步 —— 同一个种子跑出来的对局
     就会因为"攒了多少欠账"而不同（这是"同种子结果不一样"的真正原因）。
     lastT 也置 -1：让新一局的第一帧只用来对表、不产生时间差。 */
  accT = 0; lastT = -1;
  /* 【不传种子 = 现掷一个新的，而且新种子必须真的灌进对战随机流】
     原来这里写成三目：不传种子时只算 makeSeed() 赋值给 world.seed，却【没有】调
     setSimSeed —— 于是对战流根本没被重置，整批对局共用一条"从 mulberry32(1) 一直流
     下去"的序列。后果三个（都实测过）：
       · 换 SEED 跑平衡，结果一字不差（种子参数形同虚设）；
       · 网页每次刷新之后的第一局永远一模一样；
       · 普通对局记下的 world.seed 是装饰品，拿它"种子重现"复现不出原局。
     setSimSeed 的返回值是散列后的 32 位种子，存它才是"真能重现的那个数"。 */
  world.seed = setSimSeed((seed === undefined || seed === null) ? makeSeed() : seed);
  resetVisualRng(world.seed);
  world.stats = [world.newStats(), world.newStats()];
  world.onDamage = null;
  INTRO.on = false;            // 任何新局都先把上一局的"战斗开始"过场掐掉（是否播由 startMatch 决定）
  world.units.push(new Unit(cardL, 0), new Unit(cardR, 1));
  /* 系列赛：按双方角色把战斗效果挂到本体上（经典模式 SERIES.on = false，零开销） */
  if (SERIES.on) seriesApplyCharFx();
  return world.seed;
}

/* 胜负已定的那一刻，给双方血量拍一张快照（用户 2026 口径）。
   ⚠ 为什么不能等到 finalizeMatch 再读 hp：world.over 是 endCheck() 置上的，
   而 endCheck 要等败者的【死亡动画跑满】（0.9s / 灾厄 1.7s）才被调用。
   这近一秒里冻结的只是败者，胜者照常挨打 —— 残留的毒、电球、风暴、仆从、
   还在飞的陨石都会继续掉血。于是"剩余血量 / 残血获胜 / 碾压 / 优势未胜"
   这些统计读到的都是【死亡动画播完之后】的血，会比真正分出胜负那一刻低一截。
   现在改为：谁先进入 dying（致命一击落下 / 灾厄处决）就记下那一步的双方血量，
   只记第一次；平局（超时）没有 dying，finalizeMatch 退回到当场读数。 */
function markDecided(u) {
  const a = world.units;
  if (world.decideHp || !a || a.length < 2 || (u !== a[0] && u !== a[1])) return;
  world.decideHp = [a[0].hp, a[1].hp];
  world.decideT = world.t;
}
/* 结束一局并汇总指标：胜负之外还要算出"爆发 / 残血 / 翻盘 / 优势"这些标签，
   开发者模式的精彩对局筛选全靠这里。 */
function finalizeMatch() {
  if (world.over && !world.over.done) {
    world.over.done = true;
    const win = world.over.win;
    world.over.t = world.t;
    world.over.reason = world.over.reason || (win < 0 ? 'timeout' : 'kill');
    /* 【分出胜负那一刻的血量】而不是现在（死亡动画播完）的血量 —— 见 markDecided。
       快照没记到（平局/超时）就退回当场读数。 */
    world.over.hp = world.decideHp
      ? [world.decideHp[0], world.decideHp[1]]
      : [world.units[0].hp, world.units[1].hp];
    /* decideT = 真正分出胜负的时刻（快照那一步）；没有快照就用结算时刻 */
    world.over.decideT = world.decideT === undefined ? world.t : world.decideT;
    world.over.margin = world.over.hp[win < 0 ? 0 : 1 - win] /
                        world.units[win < 0 ? 0 : 1 - win].maxHp;
    /* 败者挨到致命一击的时刻（不是 over.t —— 那个要等死亡动画播完）。
       空悲切分析要从这一刻起给败者续命（见 8.2）。 */
    world.over.deathT = world.units[win < 0 ? 0 : 1 - win].dieT;
    world.over.tags = collectTags(world);
  }
  if (world.autoStop) stopLive();
}

/* 固定步长推进一步。返回 true = 这一局已经结束。 */
function stepOnce() {
  if (world.over) return true;
  world.t += SIM_DT;
  graceTick();                 // 空悲切：到点给败者挂护体（必须在 stepPhysics 之前）
  stepPhysics(SIM_DT);
  if (world.over && world.over.reason === undefined) world.over.reason = 'kill';
  if (!world.over && world.t > CFG.MAX_TIME) { world.over = { win: -1, reason: 'timeout' }; sfx('deny', 0.9); }
  if (world.over) { world.t = Math.min(world.t, CFG.MAX_TIME); finalizeMatch(); return true; }
  return false;
}

/* 整局跑到结束（不渲染）。batch / 重现都用它，同一个种子结果完全一致。 */
function runFullMatch(cardL, cardR, seed, maxSteps) {
  resetMatch(cardL, cardR, seed);
  const cap = maxSteps || Math.ceil((CFG.MAX_TIME + 40) / SIM_DT);
  let n = 0;
  while (!stepOnce() && ++n < cap) { }
  return world.over;
}

/* ============================================================
   8.1 对局指标 / 标签（开发者模式）
   ============================================================ */
/* 判定这一局带哪些"精彩"标签。阈值都在这里，想调只改这一处。 */
const TAG_RULES = {
  burstHit: 150,    // 【单次爆发】一次命中就打掉这么多血（陨石/恶魔之手/叠起来的君王之剑）
  burstWin: 380,    // 【短时间爆发】3 秒滑窗内累计打出这么多伤害
  clutchMin: 0.45,  // 获胜方全程最低血量 <= 45% = 赢得艰难（"险胜"）
  comeback: 0.35,   // 翻盘：胜者曾被压到 35% 以下
  lowHp: 0.20,      // 残血获胜：结束时胜者 <= 20%
  shortT: 25,       // 速战速决：整局 <= 25 秒
  longT: 150,       // 久战：整局 >= 150 秒
  dominate: 0.85,   // 碾压：胜者结束时仍 >= 85%
  heavyMul: 1.6     // 拉锯：胜方总输出 >= 自身血量的这个倍数
};
function collectTags(w) {
  const out = [];
  const win = w.over.win;
  const t = w.over.t;
  /* 「剩余血量」一类的判据（残血获胜 / 碾压 / 优势未胜）统统用【分出胜负那一刻】
     的快照，不用 w.units[i].hp —— 后者已经被死亡动画期间的多余伤害拉低过。 */
  const hp = w.over.hp || [w.units[0].hp, w.units[1].hp];
  if (win < 0) {
    /* 平局：只标"超时"，并记下超时瞬间谁血更多（压倒性的一方没赢下来） */
    out.push('timeout');
    const ra = hp[0] / w.units[0].maxHp, rb = hp[1] / w.units[1].maxHp;
    if (Math.abs(ra - rb) > 0.3) out.push('lead');
    return out;
  }
  const W = w.units[win], sw = w.stats[win], sl = w.stats[1 - win];
  const whp = hp[win] / W.maxHp;
  /* 两种爆发分开标：单次（一下多疼）与短时间（一小段里打多密） */
  if (sw.hit >= TAG_RULES.burstHit) out.push('burst1');
  if (sw.burst >= TAG_RULES.burstWin) out.push('burst');
  if (sw.comeback) out.push('comeback');
  if (whp <= TAG_RULES.lowHp) out.push('lowhp');
  if (W.stat.minHp <= TAG_RULES.clutchMin) out.push('clutch');
  if (t <= TAG_RULES.shortT) out.push('short');
  if (t >= TAG_RULES.longT) out.push('long');
  if (whp >= TAG_RULES.dominate) out.push('dominate');
  if (sl.hit >= TAG_RULES.burstHit) out.push('burst1L');      // 输的一方也曾打出单次爆发
  if (sl.burst >= TAG_RULES.burstWin) out.push('burstL');     // 输的一方也曾短时间爆发
  if (W.stat.dealt >= W.maxHp * TAG_RULES.heavyMul) out.push('heavy');  // 拉锯
  return out;
}
const TAG_TEXT = {
  burst1: '单次爆发', burst: '短时爆发',
  burst1L: '对手单次爆发', burstL: '对手短时爆发',
  comeback: '逆境反杀', lowhp: '残血获胜', clutch: '险胜',
  short: '速战', long: '久战', dominate: '碾压',
  heavy: '拉锯', timeout: '超时', lead: '优势未胜',
  /* 空悲切专用：collectTags 不会自己产出它 —— 只有开发者模式的
     「空悲切」开关把这一局重放过、确认败者续命 1 秒能反杀时才会打上（见 8.2）。 */
  chess: '棋差一招'
};
function tagText(k) { return TAG_TEXT[k] || k; }

/* 一局的完整记录（表格 / 导出用） */
function matchRecord(seed) {
  const w = world, o = w.over || {};
  return {
    seed: w.seed,
    seedIn: seed === undefined ? w.seed : seed,
    a: w.units[0].card.id, b: w.units[1].card.id,
    aName: w.units[0].card.name, bName: w.units[1].card.name,
    win: o.win, reason: o.reason, t: o.t,
    /* 败者挨到致命一击的时刻（空悲切分析用；平局 / 没记到就是 null） */
    deathT: o.deathT === undefined ? null : o.deathT,
    /* 真正分出胜负的时刻（= 致命一击那一步；平局/超时 = 结算时刻）。
       与 t 的差就是死亡动画那段时长（0.9~1.7s）。 */
    decideT: o.decideT === undefined ? null : o.decideT,
    tags: o.tags || [],
    /* hp = 【分出胜负那一刻】的剩余血量（不是死亡动画播完后的，见 markDecided）。 */
    hp: o.hp ? [o.hp[0], o.hp[1]] : [w.units[0].hp, w.units[1].hp],
    /* behind[i] = i 方本局被对手拉开过的最大血量差（比例，0~1）；
       胜者的那一项就是"逆转血量差"的幅度。 */
    behind: [w.stats[0].behindMax, w.stats[1].behindMax],
    maxHp: [w.units[0].maxHp, w.units[1].maxHp],
    dealt: [w.stats[0].dealt, w.stats[1].dealt],
    taken: [w.stats[0].taken, w.stats[1].taken],
    healed: [w.stats[0].healed, w.stats[1].healed],
    minHp: [w.units[0].stat.minHp, w.units[1].stat.minHp],
    /* 两种爆发口径分别导出：burst* = 3 秒滑窗累计，hit* = 单次命中最大 */
    burst: [w.stats[0].burst, w.stats[1].burst],
    burstAt: [w.stats[0].burstAt, w.stats[1].burstAt],
    hit: [w.stats[0].hit, w.stats[1].hit],
    hitAt: [w.stats[0].hitAt, w.stats[1].hitAt],
    lowAt: [w.stats[0].lowAt, w.stats[1].lowAt]
  };
}

/* ============================================================
   8.2 空悲切（开发者模式 · 预演分析）
   ------------------------------------------------------------
   用户口径：一局预演跑完之后，按记录把【败者】在"即将阵亡"那一刻起设为无敌、
   续命 1 秒（灾厄也不能反杀）。如果败者在这 1 秒里先把对手打死，
   这局就算「棋差一招」—— 也就是"两边几乎同时要死，败者只差一招"。

   做法（同一个种子必然同一局，所以能"重放"）：
     ① 预演那一局给出：败者是谁（loseSide）+ 它挨到致命一击的时刻 deathT（Unit.dieT）；
     ② 用同一颗种子、同一对卡牌从头再跑一遍，只是这一次在那一致命微步之前
        给败者挂上护体（u.guard = 免伤 + 免灾厄斩杀 + 免毒素…），
        然后数着微步再放它活 GRACE_LIFE 秒：
          · 这一秒里对手先被打死 → 反杀成功 → 'chess'（棋差一招）
          · 这一秒里没人死     → 差得不止一招
   ⚠ 护体必须在 deathT 那一【微步】之前挂上：致死伤害正是在 t = deathT 这一步结算的
     （stepOnce 先 world.t += SIM_DT 再 stepPhysics，所以 armAt 取 deathT 略往前一点）。
   ⚠ 续命时长用【微步计数】而不是时间比较：world.t 是一步步加出来的，
     到 endAt 那一步会差几个 1e-15，用 `world.t >= endAt` 收尾会多跑一步 ——
     而护体一摘，败者身上攒着的灾厄/毒素就会当场把它处决（实测 5/120 假红）。
   ⚠ 窗口内护体只免疫致死来源，不改败者的输出 —— 这一秒里败者照常打人。
   ============================================================ */
const GRACE_LIFE = 1.0;      // 续命时长（秒）。用户口径：1.5s 有点长 → 1s。
const GRACE = { on: false, side: -1, armAt: 0 };

function graceClear() { GRACE.on = false; GRACE.side = -1; }
/* 每微步开头调一次（stepOnce）：到点就把护体挂上，挂上就一直挂着
   （什么时候摘由 runGraceMatch 数微步决定，免得踩浮点误差）。 */
function graceTick() {
  if (!GRACE.on) return;
  const u = world.units[GRACE.side];
  if (!u) { graceClear(); return; }
  if (!u.guard && world.t >= GRACE.armAt) u.guard = true;
}
/* 空悲切分析：deathT = 原局败者【挨到致命一击】的时刻（Unit.dieT）。
   返回 { flip, win, t, reason, hp } —— flip = 败者在续命窗口里把对手先打死了。
   ⚠ 判定"反杀"看的是【对手进入 dying】的那一刻，不是 world.over：
     对手也要播完 0.9s（灾厄 1.7s）的阵亡动画才会 endCheck 置 over，
     等它就等于把窗口白白拉长近一秒。 */
function runGraceMatch(cardL, cardR, seed, loseSide, deathT, life) {
  resetMatch(cardL, cardR, seed);
  const span = (life === undefined) ? GRACE_LIFE : life;
  const dT = (deathT === null || deathT === undefined) ? 0 : deathT;   // 平局/没记到就从头护着
  const u = world.units[loseSide], foe = world.units[1 - loseSide];
  GRACE.on = true; GRACE.side = loseSide;
  /* 半步提前：保证 t = deathT 这一步的致死伤害落下来时护体已经挂上 */
  GRACE.armAt = dT - SIM_DT * 0.5;
  const hold = Math.max(0, Math.round(span / SIM_DT));    // 续命多少微步
  const cap = Math.ceil((dT + span + 1) / SIM_DT);
  let n = 0, flip = false, left = hold + 1;   // +1 = 连"挨到致命一击"那一步一起保下来
  while (n++ < cap) {
    if (stepOnce()) break;                    // 窗口内已经分出胜负（超时或对手的动画播完）
    if (foe.dying) { flip = true; break; }     // 对手先倒下 = 反杀成功
    if (u.guard) { if (--left <= 0) break; }   // 续命微步数完了还没反杀 → 不是棋差一招
  }
  const o = world.over;
  if (u) u.guard = false;
  const out = { flip: flip, win: o ? o.win : -2, t: world.t, reason: o ? o.reason : null,
                hp: [world.units[0].hp, world.units[1].hp] };
  graceClear();
  return out;
}

/* ---------- 无渲染对战（批量预演 / 重现都用它） ----------
   预演期间把 cv 换成假 canvas、cx 置空：drawArena() 第一句就会 return，
   一帧都不用画，2000 局也不会卡界面。
   顺带把音效也静音（sfxMute）：预演没有画面，几十局连着的打击音只会变成噪声。
   这一对函数是预演的唯一进出口，所以静音开关挂在这里，不会漏。 */
function makeHeadless() {
  const fake = {
    width: CFG.AW, height: CFG.AH, style: {},
    parentElement: { clientWidth: CFG.AW + 16 },
    getContext: function () { return null; }
  };
  cv = fake; cx = null; SCALE = 1; DPR = 1;
  sfxMute = true;                                       // 预演期间不出声
}
/* 退出无渲染模式。【必须把真 canvas 和它的 2D 上下文取回来】——
   以前这里只把 cv / cx 置 null 就完事，结果预演结束后 drawArena() 会一直
   在 `if (!cx) return` 上提前返回：对局照跑（有音效），但画面永远停在预演前那一帧，
   看起来就是"点重现只有声音、画面不动"。 */
function endHeadless() {
  sfxMute = false;                                      // 先解静音：下面有一条提前 return 的分支
  const el = (typeof document !== 'undefined') && document.getElementById('cv');
  if (!el || typeof el.getContext !== 'function') { cv = null; cx = null; SCALE = 1; DPR = 1; return; }
  cv = el;
  DPR = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  SCALE = cv.width / CFG.AW || 1;
  cx = cv.getContext('2d');
  if (cx) {
    cx.imageSmoothingEnabled = true;
    if (cx.imageSmoothingQuality) cx.imageSmoothingQuality = 'high';
  }
}

function stepPhysics(dt) {
  const units = world.units;

  /* 3 秒滑窗伤害统计（"单次高爆发"标签）—— 只记登场双方的，仆从不参评 */
  if (world.stats) { world.burstTick(dt); world.onDamage = world.onDamageHook; }
  /* 逆转血量差（预演筛选的排序指标）：每步记"这一方落后对手多少"的峰值。
     按血量【比例】算（两张卡 maxHp 未必相同）；只有两边都活着时才比较 ——
     一方进入 dying 之后差距已经定格，再比没有意义、还会被死亡动画干扰。 */
  if (world.stats && units.length >= 2) {
    const u0 = units[0], u1 = units[1];
    if (u0.alive && !u0.dying && u1.alive && !u1.dying) {
      const d = u0.hp / u0.maxHp - u1.hp / u1.maxHp;   // >0 红领先，<0 蓝领先
      if (-d > world.stats[0].behindMax) world.stats[0].behindMax = -d;
      if (d > world.stats[1].behindMax) world.stats[1].behindMax = d;
    }
  }

  for (const u of units) {
    if (u.alive && !u.dying) { const hp = u.hp / u.maxHp; if (hp < u.stat.minHp) u.stat.minHp = hp; }
    /* 灾厄读条（用户 2026 口径）：灾厄值【追平生命值】不再当场处决，
       而是开始读书 DOOM_CHANNEL=3 秒，读满才 killByDoom。
       读条期间一切照常（照走、照打、照挨打），只是头顶血条换成读条环；
       中途回血到灾厄之上（heal）就把进度清零 —— 这就是被斩杀前 3 秒的活命窗口。
       ⚠ 陨石直击是唯一的例外：它走 Unit.doomBlast() 当场结算，不经过这里。 */
    if (u.alive && !u.dying) {
      if (u.doom > 0 && u.doom >= u.hp) {
        u.doomT += dt;
        if (u.doomT >= DOOM_CHANNEL) u.killByDoom();
      } else if (u.doomT) u.doomT = 0;
    }
    /* 新登场单位的一次性钩子（祭品召唤出来的友军靠它补朝向/成长值，
       灵魂靠它把"消散"回报给灵魂风暴）。 */
    if (!u.__spawned) { u.__spawned = true; if (u.onSpawn) u.onSpawn(); }
    if (u.flash > 0) u.flash -= dt;
    if (u.bouncePop > 0) u.bouncePop -= dt * 3.2;
    if (u.dying) u.freeze = 1;
    if (u.freeze > 0) u.freeze -= dt;
    if (u.invulT > 0) u.invulT -= dt;              // 无敌帧倒计时
    if (u.slowT > 0) u.slowT -= dt;                // 减速倒计时（光束照射）
    if (u.boost) u.boost *= Math.exp(-dt * 1.4);   // 击退加速自然衰减
  }
  for (const u of units) {
    if (!u.alive) continue;
    const sp = u.curSpeed();
    u.x += u.dx * sp * dt;
    u.y += u.dy * sp * dt;
  }
  // 撞墙
  for (const u of units) {
    // 被恶魔之手抓着时没有碰撞体积：直接穿墙，也不触发 onWallHit（不会因此又伸出一只手）
    if (!u.alive || u.dying || u.grabbed > 0) continue;
    const pdx = u.dx, pdy = u.dy;                     // 入射方向（反射前）
    let hit = false, nx = 0, ny = 0, px = u.x, py = u.y;
    if (u.x - CFG.R < 0) { u.x = CFG.R; u.dx = Math.abs(u.dx); nx = 1; ny = 0; hit = true; px = 3; py = u.y; }
    else if (u.x + CFG.R > CFG.AW) { u.x = CFG.AW - CFG.R; u.dx = -Math.abs(u.dx); nx = -1; ny = 0; hit = true; px = CFG.AW - 3; py = u.y; }
    else if (u.y - CFG.R < 0) { u.y = CFG.R; u.dy = Math.abs(u.dy); nx = 0; ny = 1; hit = true; px = u.x; py = 3; }
    else if (u.y + CFG.R > CFG.AH) { u.y = CFG.AH - CFG.R; u.dy = -Math.abs(u.dy); nx = 0; ny = -1; hit = true; px = u.x; py = CFG.AH - 3; }
    if (hit) {
      /* 垂直滞留检测：入射角（速度与墙面的夹角）连续三次落在 83~97° ≈ 撞了原路弹回，
         单位会卡在两墙之间来回弹。第三次命中时大幅偏转反弹方向把它甩开。 */
      const vDotN = Math.abs(pdx * nx + pdy * ny);
      const inc = 90 - Math.acos(clamp(vDotN, 0, 1)) * 180 / Math.PI;
      const inRange = inc >= 83 && inc <= 97;
      const stuck = inRange && u.wa1 >= 83 && u.wa1 <= 97 && u.wa2 >= 83 && u.wa2 <= 97;
      if (inRange) { u.wa2 = u.wa1; u.wa1 = inc; } else { u.wa1 = -1; u.wa2 = -1; }
      if (stuck) {
        /* 【必须走对战随机流】这里是"撞墙卡死"的解卡偏转，直接决定球的运动方向。
           以前写成 vchance(0.5)（观感流）+ rand(...)（对战流）混用：
           偏转的正负号来自观感流 —— 而观感流是被"这一帧跑了多少步/画了多少次"影响的，
           于是同一颗种子在 60Hz 与 144Hz（或不同步数/帧）下会往不同方向偏，
           整局走向彻底分叉。这就是"同种子结果不一样、重现结果与记录不符"的根因。 */
        const a = Math.atan2(u.dy, u.dx) + (rand(0, 1) < 0.5 ? -1 : 1) * rand(0.7, 1.1);   // 偏转 40~63°
        u.dx = Math.cos(a); u.dy = Math.sin(a);
        u.wa1 = -1; u.wa2 = -1;                       // 偏转后重新计数
        world.effects.push(new Ring(px, py, 6, 52, 0.34, 'rgba(255,170,90,.75)', 3));
        burst(px, py, 10, { c: '#ffb054', s0: 60, s1: 220 });
        sfx('blunt_attack', 0.3, 0.8, 0.05);
      }
      u.bouncePop = 1;
      sfx('blunt_attack', 0.16, vrand(1.25, 1.45, 'vrand'), 0.05);
      world.effects.push(new Ring(px, py, 4, 34, 0.28, 'rgba(220,200,255,.5)', 2.5));
      /* 摔击（违逆的冲击波把人拍出去后获得 slamT 窗口）：
         窗口内撞墙按【当前速度】吃额外伤害，越快越疼（slamMin~slamMax 线性）。 */
      if (u.slamT > 0) {
        u.slamT = 0;
        const spd = u.curSpeed();
        const lo = u.slamMin, hi = u.slamMax;
        const d = Math.round(lo + (hi - lo) * clamp((spd - 150) / 380, 0, 1));
        u.damage(d, 'hit');
        world.shake = Math.max(world.shake, 11);
        burst(px, py, 18, { c: '#ffb0d0', s0: 100, s1: 340 });
        sfx('heavy_attack', 0.8, 0.8);
      }
      if (u.mech.onWallHit) u.mech.onWallHit(nx, ny, px, py);
      if (u.mech.onBounce) u.mech.onBounce('wall');
    }
  }
  // 球-球碰撞（units[0]/[1] 恒为两张本体卡；仆从 appended 在后面，不参与本体碰撞）
  if (units.length >= 2) {
    const a = units[0], b = units[1];
    if (a.alive && b.alive && !a.dying && !b.dying && a.grabbed <= 0 && b.grabbed <= 0) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy), minD = CFG.R * 2;
      if (d < minD && d > 0.0001) {
        /* 抓一份【反射之前】的双方方向，原样传给 onUnitHit（第三/四参数 = 自己/对方
           的碰撞前方向）。需要"碰撞前一刻夹角"的机制（完美打击）用它，
           别用回调时的 dx/dy —— 那已经是弹开后的方向了。ghost 穿过时没反射，
           pre 就是当时方向本身，照传不误。 */
        const preA = { dx: a.dx, dy: a.dy }, preB = { dx: b.dx, dy: b.dy };
        /* ghost（劫掠突进）：穿过敌人 —— 跳过物理弹开，命中回调照常触发 */
        const ghost = (a.mech && a.mech.ghost) || (b.mech && b.mech.ghost);
        if (!ghost) {
          const nx = dx / d, ny = dy / d;
          const push = (minD - d) / 2 + 0.5;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
          const dA = a.dx * nx + a.dy * ny, dB = b.dx * nx + b.dy * ny;
          a.dx -= 2 * dA * nx; a.dy -= 2 * dA * ny;
          b.dx -= 2 * dB * nx; b.dy -= 2 * dB * ny;
          a.bouncePop = 1; b.bouncePop = 1;
          world.shake = 5;
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          world.effects.push(new Ring(mx, my, 6, 46, 0.3, 'rgba(255,230,190,.7)', 3));
          burst(mx, my, 9, { c: '#ffe2b0', s0: 70, s1: 240 });
          sfx('blunt_attack', 0.35, vrand(1.0, 1.15, 'vrand'), 0.05);
        }
        if (a.mech.onUnitHit) a.mech.onUnitHit(b, preA, preB);
        if (b.mech.onUnitHit) b.mech.onUnitHit(a, preB, preA);
        /* 第二个参数 = 撞到的那个单位。想区分"撞本体 / 撞仆从 / 撞墙"的机制
           （比如锻打成型：撞仆从不算一锤）就看它。 */
        if (a.mech.onBounce) a.mech.onBounce('unit', b);
        if (b.mech.onBounce) b.mech.onBounce('unit', a);
        /* 储君（系列赛角色）：撞击敌人时给对方叠 3 层虚弱+易伤
           （触发间隔/层数上限见 seriesRegentHit；比例走引擎现成乘区）。 */
        if (SERIES.on) { seriesRegentHit(a, b); seriesRegentHit(b, a); }
      }
    }
  }
  // 单位 × 仆从碰撞：仆从有实体体积（半径 mR），可被劫掠/蛇咬等突进命中，
  // 也会把对方物理弹开。本体-本体的结算仍走上面的专用段。
  /* 【友方也实心】这里原来有一句 `if (a.team === b.team) continue;`，于是
     本体和自己的仆从、以及同一方的两只仆从，会直接对穿过去 —— 观感很假。
     现在取消了队友过滤：只要这一对里至少有一个是仆从，无论敌友都按体积弹开。
     本体的两个球永远是敌对双方，所以它们仍只由上面的专用段结算，不会重复。
     ⚠ 机制侧的约定：命中回调 onUnitHit 现在可能收到【友方】单位，
       凡是要结算伤害/挂 debuff 的机制，必须自己按队伍拦掉（见 MinionBrain.onUnitHit）。
     另外仆从也和任何单位一样正常碰撞（2026-09-23 起冲锋的仆从不再有"冲撞期间穿透"）。 */
  {
    const rOf = u => (u.minion && u.p && u.p.mR) ? u.p.mR : (u.rBody || CFG.R);
    for (let i = 0; i < units.length; i++) {
      for (let j = i + 1; j < units.length; j++) {
        const a = units[i], b = units[j];
        /* 本体-本体已单独结算。余像的【分身】虽然不在两个本体槽位上，但它和正常
           单位一样有体积（用户口径"会被敌人索敌和碰撞"）—— 所以这里放它进来，
           与【敌方】单位按圆-圆弹开；与自己一方的单位（本体/友方仆从）互相穿过，
           否则刚出生时和本体完全重叠，第一帧就会被弹开、连"反向分身"都做不出来。 */
        if (!a.minion && !b.minion) {
          if (!(a.replica || b.replica)) continue;
          if (a.team === b.team) continue;
        }
        /* 灵体（灵魂风暴的灵魂）：体积只用于被命中判定，不与任何单位发生碰撞 ——
           灵魂是"飘"的，撞不动别人也不被别人撞开（否则几只灵魂会把敌人按在墙角）。 */
        if (a.ghost || b.ghost) continue;
        if (!a.alive || !b.alive || a.dying || b.dying || a.grabbed > 0 || b.grabbed > 0) continue;
        const ra = rOf(a), rb = rOf(b);
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy), minD = ra + rb;
        if (d < minD && d > 0.0001) {
          /* 同上：抓【反射之前】的方向传给 onUnitHit（第三/四参数 = 自己/对方碰撞前方向） */
          const preA = { dx: a.dx, dy: a.dy }, preB = { dx: b.dx, dy: b.dy };
          /* ghost（劫掠突进）：穿过仆从 —— 跳过物理弹开，命中回调照常触发。
             ghostOn(other)：动态版，由机制自己按"撞到的是谁"决定要不要穿。
             冲锋的仆从以前也用它（冲撞期间穿友方/敌方仆从），2026-09-23 重构后
             仆从和所有卡一样正常碰撞，不再声明穿透。 */
          const ghost = (a.mech && a.mech.ghost) || (b.mech && b.mech.ghost)
            || (a.mech && a.mech.ghostOn && a.mech.ghostOn(b))
            || (b.mech && b.mech.ghostOn && b.mech.ghostOn(a));
          if (!ghost) {
            const nx = dx / d, ny = dy / d;
            const push = (minD - d) / 2 + 0.5;
            a.x -= nx * push; a.y -= ny * push;
            b.x += nx * push; b.y += ny * push;
            const dA = a.dx * nx + a.dy * ny, dB = b.dx * nx + b.dy * ny;
            a.dx -= 2 * dA * nx; a.dy -= 2 * dA * ny;
            b.dx -= 2 * dB * nx; b.dy -= 2 * dB * ny;
            a.bouncePop = 1; b.bouncePop = 1;
            world.shake = Math.max(world.shake, 3);
            const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
            world.effects.push(new Ring(mx, my, 5, 34, 0.26, 'rgba(255,225,190,.6)', 2.4));
            sfx('blunt_attack', 0.3, vrand(1.05, 1.2, 'vrand'), 0.06);
          }
          if (a.mech.onUnitHit) a.mech.onUnitHit(b, preA, preB);
          if (b.mech.onUnitHit) b.mech.onUnitHit(a, preB, preA);
          /* 这一对里至少有一方是仆从（或余像的分身），所以第二个参数就是那个
             "非本体"的单位 —— 机制可以据此区分"撞的是本体还是仆从"
             （锻打成型撞仆从不算一锤）。
             ⚠ 这里【不再】补单位级 onUnitHit：余像的分身被敌人撞到只按圆-圆弹开，
             不算"被打到"（用户 2026 口径），所以引擎不需要那条通路。 */
          if (a.mech.onBounce) a.mech.onBounce('unit', b);
          if (b.mech.onBounce) b.mech.onBounce('unit', a);
        }
      }
    }
  }
  // 效果
  for (const e of world.effects) if (!e.dead && !e.manual) e.update(dt);
  /* 移除效果时给一次 onDead 回调：恶魔之手靠它兜底解禁"被抓"的对手，
     防止因为某条没覆盖到的判死路线让对手永久失去碰撞。 */
  world.effects = world.effects.filter(e => { if (e.dead && e.onDead) e.onDead(); return !e.dead; });
  // 伤害数字
  for (const n of world.nums) if (!n.dead) n.update(dt);
  world.nums = world.nums.filter(n => !n.dead);
  // 状态结算：易伤/虚弱每秒减 1 层；毒素每 2.5 秒结算一次；摔击窗口倒计时
  for (const u of units) {
    if (!u.alive || u.dying) continue;
    if (u.vuln > 0) { u.vulnT += dt; if (u.vulnT >= 1) { u.vulnT -= 1; u.vuln--; } } else u.vulnT = 0;
    if (u.weak > 0) { u.weakT += dt; if (u.weakT >= 1) { u.weakT -= 1; u.weak--; } } else u.weakT = 0;
    if (u.slamT > 0) u.slamT -= dt;
    if (u.poison > 0) {
      u.poisonT += dt;
      if (u.poisonT >= 2.5 && !u.guard) {      // 空悲切护体：毒素结算也跳过（血不许掉）
        u.poisonT -= 2.5;
        /* 每 2.5 秒扣一次 = 当前毒素值的血，然后毒素 -30。直伤不走 damage()：
           毒素是 DoT，不吃虚弱/易伤，也不发声（飘字用毒绿色）。 */
        const d = Math.max(1, Math.floor(u.poison));
        u.hp = Math.max(0, u.hp - d);
        u.flash = Math.max(u.flash, 0.12);
        world.nums.push(new DmgNum(u.x + vrand(-12, 12, 'vrand'), u.y - 26, String(d), 'poison'));
        if (u.hp <= 0) u.kill();
        u.poison = Math.max(0, u.poison - 25);   // 每次扣血后毒素衰减 25（原 30）
      }
    } else u.poisonT = 0;
  }
  // 机制
  for (const u of units) if (u.alive && !u.dying) u.mech.update(dt);
  /* 系列赛角色效果的每步结算（储君撞击冷却 / 亡灵契约倒计时）：
     放在死亡结算【之前】—— 倒计时到点当场开死，同一步的死亡结算就接得住。 */
  if (SERIES.on) seriesTickFx(dt);
  // 死亡结算
  for (const u of units) {
    if (!u.dying || u.finished) continue;
    u.dying.t += dt;
    if (u.dying.doom) {
      /* 灾厄斩杀：黑洞动画在原地播放，不再把单位拉向对手（原版会边播放边滑过去） */
      if (u.dying.t < dt * 1.5) world.effects.push(new DoomHole(u));
    }
    if (u.dying.t > (u.dying.doom ? 1.7 : 0.9)) {
      u.finished = true; u.alive = false;
      endCheck();
      /* 灵魂散去 → 回报给召唤它的「灵魂风暴」：
         满 3 个开风暴，之后每多死一个就让风暴的牵引与伤害各 +1
         （会先从消亡处飞一缕灵魂粒子到风眼，飞到了才 +1）。 */
      if (u.soul && u.o && u.o.mech && u.o.mech.onSoulDeath) u.o.mech.onSoulDeath(u.x, u.y);
    }
  }
}

function endCheck() {
  if (world.over) return;
  const a = world.units[0], b = world.units[1];
  /* 【胜负按"挨到致命一击的先后"判，不能按阵亡动画播完的先后】
     alive 要到阵亡动画播满（普通 0.9s / 灾厄处决 1.7s）才翻 false，而两种动画
     时长不同，先死的一方反而可能后翻 false —— 用 alive 判定就会把胜负判反。
     实测种子 1587360793（蛇咬 vs 末日降临）：蛇咬先在 t=37.72 被陨石直击处决
     （灾厄动画 1.7s），末日降临 t=38.03 被毒杀（动画 0.9s）——末日降临先播完，
     旧逻辑只看到 b 已死就判 a 胜，可真正先归零的是 a，胜者应是末日降临。
     dieT = 进入 dying（生命归零 / 灾厄处决）那一刻的 world.t，用它比较才是真正的
     死亡先后；同一微步归零（world.t 相同）才算同时，按规则判平局。
     ⚠ 只看两张本体卡：dieT 由基类 Unit.kill()/killByDoom() 写入（仆从、余像分身、
       灵魂这些子类重写了 kill()、不写 dieT，但它们不参与胜负判定）。 */
  const da = a.dieT, db = b.dieT;          // null = 还没挨到致命一击
  if (da === null && db === null) return;  // 谁都没死（不该走到这里）
  if (da === null) world.over = { win: 0 };          // 只有 b 死 → a 胜
  else if (db === null) world.over = { win: 1 };     // 只有 a 死 → b 胜
  else if (da === db) world.over = { win: -1 };      // 同一微步 = 同时归零
  else world.over = { win: da < db ? 1 : 0 };        // 先归零的一方败
  if (world.over) sfx(world.over.win < 0 ? 'deny' : 'victory', 1.0);
}

/* ============================================================
   9. 渲染
   ============================================================ */
let cv = null, cx = null, DPR = 1, SCALE = 1;
function fit() {
  if (!cv || !cv.parentElement || !cv.getContext) return;   // 无渲染对战时不做布局
  const host = cv.parentElement;
  /* 普通模式：老规矩 —— 不超过视口高的 74%，两边留 16px。
     录制模式：竞技场盯住 REC.margin（上下留空），同时给两侧的卡面留出
     REC.stripW = 卡面 + 两侧留白 的带子；两个上限取小的那个。
     ⚠ 录制模式的高度取【舞台自己的 clientHeight】，不用 window.innerHeight 推算：
     舞台在录制模式下就是视口高，量它是"所见即所得"，画布居中后上下留空按定义相等
     （曾经用 innerHeight 推算，遇上开发者版版本条把 #app 顶下去 37px，就成了
      顶部留空 53px、底部切掉 21px —— 见 body.rec #app 那段注释）。
     ⚠ 录制模式的宽度取【文档视口宽】，因为竞技场边长要先定下来才能写进 --rec-arena
     （grid 的中间列就是它，两侧 1fr 再平分剩下的 —— 卡面因此永远居中）。 */
  const viewW = (document.documentElement && document.documentElement.clientWidth) ||
    window.innerWidth || 0;
  const hostH = host.clientHeight || 0;
  const avail = host.clientWidth - (REC.on ? 0 : 16);
  let cap;
  if (REC.on) {
    const byH = (hostH > 0 ? hostH : (window.innerHeight || 0)) - REC.margin * 2;
    const byW = viewW ? (viewW - REC.stripW * 2) : Infinity;
    cap = Math.min(byH, byW);
  } else {
    cap = Math.min(avail, Math.round(window.innerHeight * 0.74));
  }
  const cssW = Math.max(240, Math.round(cap));
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * DPR);
  cv.height = Math.round(cssW * DPR);
  cv.style.maxWidth = cssW + 'px';
  SCALE = cv.width / CFG.AW;
  cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = true;
  if (cx.imageSmoothingQuality) cx.imageSmoothingQuality = 'high';
  /* 录制模式的排布全靠这两个变量（CSS 里 grid 的中间列 / 卡面封顶宽度）：
     竞技场边长与卡面宽度只有这一处来源，不写死两份。 */
  try {
    if (REC.on && document.documentElement && document.documentElement.style) {
      const st = document.documentElement.style;
      st.setProperty('--rec-arena', cssW + 'px');
      st.setProperty('--rec-card', REC.cardW + 'px');
    }
  } catch (e) { }
}

function drawArena() {
  if (!cx) return;                     // 无渲染对战（批量预演）时不做任何绘制
  const W = CFG.AW, H = CFG.AH;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.clearRect(0, 0, cv.width, cv.height);
  if (world.shake > 0) cx.translate(vrand(-world.shake, world.shake, 'vrand') * DPR * 0.5, vrand(-world.shake, world.shake, 'vrand') * DPR * 0.5);
  cx.scale(SCALE, SCALE);

  /* 底色。选了原版布景时画布【故意不铺底色】（clearRect 之后保持透明），
     让正后方的 #sceneBg 透出来 —— 竞技场里看到的就是页面同一张底图的同一处，
     边界天然对齐。这时只盖一层半透明暗色，保证卡牌/血条在亮背景上也看得清。 */
  const sceneOn = !!(ASSET_MAP.bg && ASSET_MAP.bg[SET.bg]);
  const g = cx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.78);
  if (sceneOn) {
    /* 只盖"纯黑半透明"，不要带紫 —— 底图是什么颜色就让它透出什么颜色 */
    g.addColorStop(0, 'rgba(0,0,0,.26)');
    g.addColorStop(0.55, 'rgba(0,0,0,.36)');
    g.addColorStop(1, 'rgba(0,0,0,.54)');
  } else {
    g.addColorStop(0, '#16161a'); g.addColorStop(0.55, '#0c0c0e'); g.addColorStop(1, '#000');
  }
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);

  /* 背景网格（原来每 60px 一条的淡紫网格线）已按需求去掉：
     现在只有径向底色 + 外框，画面干净些。 */

  cx.save();
  cx.strokeStyle = 'rgba(200,170,110,.30)'; cx.lineWidth = 3;
  cx.strokeRect(1.5, 1.5, W - 3, H - 3);
  cx.strokeStyle = 'rgba(255,255,255,.18)'; cx.lineWidth = 1;
  cx.strokeRect(7.5, 7.5, W - 15, H - 15);
  /* 四角那对"折线"（原来每角画一条 L 形亮金线）已按需求去掉：只留内外两层方框。 */
  cx.restore();

  /* 开发者版的水印（正式版没有这个钩子 —— typeof 为 undefined，等于零开销）。
     画在这里 = 竞技场底色与边框之上、**所有单位/特效/血条之下**：
     它是背景水印，不会遮住卡牌、仆从、血条、伤害数字这些东西。
     （不能更早画：再往前就是底色填充，会被直接盖掉。钩子由 src/dev.js 注册。） */
  if (typeof devWmDraw === 'function') devWmDraw(cx);

  for (const e of world.effects) if (e.drawUnder && !e.dead) e.draw(cx);
  drawUnits();
  for (const e of world.effects) if (!e.drawUnder && !e.dead) e.draw(cx);

  cx.save();
  const vg = cx.createRadialGradient(W / 2, H / 2, W * 0.34, W / 2, H / 2, W * 0.78);
  /* 有布景时暗角收一点：底图和"半透明暗色"已经在压亮度了，再加 0.55 会糊成黑块 */
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, sceneOn ? 'rgba(0,0,0,.38)' : 'rgba(0,0,0,.55)');
  cx.fillStyle = vg; cx.fillRect(0, 0, W, H);
  cx.restore();

  /* 血条 / 状态文字单独一层，画在所有特效之上：
     不然电球、陨石、飞刀飞过时会盖住血条（遮挡 bug） */
  drawUnitHUD();
  for (const n of world.nums) n.draw(cx);
}

function drawUnits() {
  for (const u of world.units) {
    if (!u.alive && !u.dying) continue;
    let scale = 1, alpha = 1, offY = 0, grey = false;
    if (u.dying) {
      const dur = u.dying.doom ? 1.7 : 0.9;
      const k = clamp(u.dying.t / dur, 0, 1);
      if (u.dying.doom) {
        grey = k > 0.06;
        if (k > 0.55) { const kk = (k - 0.55) / 0.45; scale = 1 - kk * 0.92; alpha = 1 - kk; offY = kk * 30; }
      } else { alpha = 1 - k; scale = 1 + k * 0.14; }
    }
    const pop = u.bouncePop > 0 ? 1 + u.bouncePop * 0.05 : 1;
    const ms = u.minion ? 0.8 : 1;                 // 仆从卡面比正常卡牌小一些
    /* 余像分身自己的缩放（rs）：祭品召出来的余像，其分身再缩到 0.75。
       本体自己用余像时 rs === 1，画出来和以前一样大。
       乘在 ms 之外：分身不属于 minion 分支，两者不会互相污染。 */
    const rs = u.replica ? (u.rs || 1) : 1;
    const w = CFG.CARD_W * scale * pop * ms * rs, h = CFG.CARD_H * scale * pop * ms * rs;
    const yy = u.y + offY;
    /* 余像的分身：半透明 + 略提亮的"影子"卡面。
       ⚠ 分身不在 world.effects 里（它是 Unit），所以卡面【统一在这里画】——
       它的 draw() 根本不会被调用（上一版就是这么把"半透明"写成了死代码，
       实际画出来还是全不透明的一张卡）。透明度和用图都由这里施加。 */
    const rep = u.replica ? u.alphaMul() : 1;

    cx.save();
    cx.globalAlpha = alpha * rep;
    const src = u.replica ? (u.tintSrc() || IMG[u.imgKey])
              : grey ? (GREY[u.imgKey] || IMG[u.imgKey]) : IMG[u.imgKey];
    if (src) cx.drawImage(src, u.x - w / 2, yy - h / 2, w, h);
    else {
      cx.fillStyle = u.team ? '#2b4a6b' : '#6b2b2b';
      rrPath(cx, u.x - w / 2, yy - h / 2, w, h, 8); cx.fill();
    }
    if (u.flash > 0) {
      const wht = WHITE[u.imgKey];
      cx.globalAlpha = alpha * rep * clamp(u.flash / 0.16, 0, 1) * 0.85;
      if (wht) cx.drawImage(wht, u.x - w / 2, yy - h / 2, w, h);
      else { cx.fillStyle = '#fff'; rrPath(cx, u.x - w / 2, yy - h / 2, w, h, 8); cx.fill(); }
    }
    /* 亡灵契约师的死亡延迟期（系列赛）：整张卡罩一层呼吸的紫色"幽灵化"，
       加一圈同色描边 —— 一眼能看出"这颗球已经死了、正在等契约到期"。 */
    if (u.necroPend) {
      cx.globalAlpha = alpha * (0.34 + 0.08 * Math.sin(world.t * 6));
      cx.fillStyle = '#7a5fd0';
      rrPath(cx, u.x - w / 2, yy - h / 2, w, h, 8); cx.fill();
      cx.globalAlpha = alpha * 0.85;
      cx.strokeStyle = '#b9a0ff'; cx.lineWidth = 2.5;
      rrPath(cx, u.x - w / 2, yy - h / 2, w, h, 8); cx.stroke();
    }
    /* 仆从冲撞时的橙色光圈（判据 = 冲撞速度还没耗完，见 MinionBrain.ram） */
    if (u.minion && u.mech && u.mech.ram && !u.dying) {
      cx.globalAlpha = alpha * 0.5;
      cx.strokeStyle = '#ffb054'; cx.lineWidth = 2.4;
      cx.beginPath();
      cx.arc(u.x, yy, w / 2 + 6 + 3 * Math.sin(world.t * 20), 0, TAU);
      cx.stroke();
    }
    cx.restore();

    /* 余像分身的「15 秒未被攻击」倒计时：卡面上方一枚小圆环读条
       （用户 2026 口径：和 1.5 个字差不多大）。轨道是暗环，亮弧随存活时间
       顺时针填满（-90° 起步），填满的那一刻分身就自动消散放斩击 ——
       所以它同时也是"这颗分身还能站多久"的预判。消散/濒死期间不画。 */
    if (u.replica && !u.dying && !u.cDispersed && u.idleMax > 0) {
      const R = 10, k = clamp((u.idle || 0) / u.idleMax, 0, 1);
      const cy = yy - h / 2 - R - 7;
      cx.save();
      cx.globalAlpha = alpha * 0.9;
      cx.lineWidth = 3.2; cx.lineCap = 'round';
      cx.strokeStyle = 'rgba(120,150,180,.42)';
      cx.beginPath(); cx.arc(u.x, cy, R, 0, TAU); cx.stroke();
      cx.strokeStyle = '#dceeff';
      cx.beginPath(); cx.arc(u.x, cy, R, -Math.PI / 2, -Math.PI / 2 + TAU * k); cx.stroke();
      cx.restore();
    }

    /* 卡牌下方不再绘制投影椭圆与队伍色椭圆环（按需求去除）。
       卡名已经烘焙在卡面顶部的缎带上（与官方一致），这里不再重复绘制。
       对战双方卡名见左右两侧信息面板。 */
  }
}

/* 头顶那一列状态徽标（格挡/易伤/虚弱/毒素/集中）。
   ⚠ 【正常单位与召唤物必须共用这一份】—— 以前两个分支各写一遍，
   于是祭品把牌召成友军（.minion）以后漏掉了「集中」：
   用户实测报的就是"祭品召唤的引雷针不显示集中"。以后加/改状态徽标只改这里。 */
function statusBadges(u) {
  const out = [];
  if (u.block > 0) out.push({ icon: 'pw_block', t: String(Math.ceil(u.block)), c: '#9fd4ff' });
  if (u.vuln > 0) out.push({ icon: 'pw_vulnerable', t: String(u.vuln), c: '#ff9a6a' });
  if (u.weak > 0) out.push({ icon: 'pw_weak', t: String(u.weak), c: '#9ab0ff' });
  if (u.poison > 0) out.push({ icon: 'pw_poison', t: String(Math.floor(u.poison)), c: '#a8e05f' });
  if (u.focus > 0) out.push({ icon: 'pw_focus', t: String(u.focus), c: '#ffd76a' });
  /* 亡灵契约师的死亡延迟倒计时（系列赛）：借灾厄图标显示剩余秒数 */
  if (u.necroPend) out.push({ icon: 'pw_doom', t: Math.max(0, Math.ceil(u.necroT)) + 's', c: '#b9a0ff' });
  return out;
}

/* 单位头顶的 HUD 层（血条 + 状态行 + 灾厄徽标）：
   统一在最后绘制，并自动判断"上方有没有空间"，没有就翻到卡牌下方，避免出界或被人挡住。 */
function drawUnitHUD() {
  for (const u of world.units) {
    if ((!u.alive && !u.dying) || u.finished) continue;
    /* 余像的分身 / 灵魂风暴的灵魂：不画任何 HUD（十字血条 / 状态行 / 徽标都不画）——
       用户口径："分身不显示血条"、"召唤出的灵魂不要血条"。 */
    if (u.replica || u.soul) continue;
    let alpha = 1, offY = 0, scale = 1;
    if (u.dying) {
      const dur = u.dying.doom ? 1.7 : 0.9;
      const k = clamp(u.dying.t / dur, 0, 1);
      if (u.dying.doom) {
        if (k > 0.55) { const kk = (k - 0.55) / 0.45; scale = 1 - kk * 0.92; alpha = 1 - kk; offY = kk * 30; }
      } else { alpha = 1 - k; scale = 1 + k * 0.14; }
    }
    if (alpha <= 0.02) continue;
    const pop = u.bouncePop > 0 ? 1 + u.bouncePop * 0.05 : 1;
    const h = CFG.CARD_H * scale * pop;
    const yy = u.y + offY;

    const gap = 54, half = CFG.CROSS / 2, badgeH = 18;

    /* 仆从：十字血条 0.75 倍（与正常单位同款），贴卡面上方；无状态行/徽标 */
    if (u.minion) {
      const h = CFG.CARD_H * 0.8 * scale * pop;
      const mflip = (yy - h / 2 - 44) < 4;
      const mhY = mflip ? (yy + h / 2 + 22) : (yy - h / 2 - 22);
      const chan = doomChanneling(u);
      cx.save();
      cx.translate(u.x, mhY);
      cx.scale(0.75, 0.75);
      /* 灾厄读条时血条撤掉、改画读条环（仆从一样处理，只是整体 0.75 倍） */
      if (chan) drawDoomChannel(0, 0, u, alpha);
      else drawCrossHP(0, 0, u.hp / u.maxHp, u.hp, u.doom || 0, u.maxHp, alpha, u.poison, u.block);
      cx.restore();
      /* 灾厄徽标 + 状态徽标（格挡/易伤/虚弱/毒素/集中），0.8 倍 —— 与正常单位同款排版 */
      let mby = 0;
      if (!u.dying) {
        const base = mflip ? (mhY + half * 0.75 + badgeH / 2 + 3) : (mhY - half * 0.75 - badgeH / 2 - 3);
        if (u.doom > 0) drawDoomBadge(u.x, base, u.doom, alpha);
        const badges = statusBadges(u);
        mby = base + (u.doom > 0 ? (badgeH + 4) * (mflip ? 1 : -1) : 0);
        for (const b of badges) {
          cx.save();
          cx.translate(u.x, mby);
          cx.scale(0.8, 0.8);
          drawStatusBadge(0, 0, b, alpha);
          cx.restore();
          mby += (badgeH + 4) * (mflip ? 1 : -1);
        }
        /* ⚠ 没有徽标时要把 mby 归零：上面那句无条件赋了 base，
           状态文字若直接用它就会和"第一个徽标位"重合。
           归零 → 下面落到 fallback（= base 本身），正好是第一个位置。 */
        if (!badges.length) mby = 0;
      }
      /* ⚠ 机制的状态文字【仆从也要画】。
         原来这一段只写在"非仆从"分支里，于是祭品把牌召成友军（.minion）以后，
         那些卡自己的状态全都不显示 —— 用户实测报的就是"祭品召唤的蛇咬蛰伏时
         不显示积攒毒数量"。受影响的还有：刀刃陷阱「插墙刀 N」、锻打成型「君王之剑 N」、
         电流相生「电球 N」、冲锋！！「仆从 N/2」。
         （漆黑原来也在这条路上显示「暗黑球 N」，2026 用户口径已去掉 —— 见 MechDarkness.statusText。）
         排版与正常单位一致：血条/徽标那一列【外侧】再往外一格、0.8 倍。 */
      const mst = u.mech.statusText ? u.mech.statusText() : null;
      if (mst && !u.dying) {
        /* mby 是"下一个空位"：有徽标时徽标循环已经把它推到外侧，没有则归零走 fallback。 */
        const ty = mby || (mflip ? (mhY + half * 0.75 + badgeH / 2 + 3)
                                : (mhY - half * 0.75 - badgeH / 2 - 3));
        cx.save();
        cx.globalAlpha = alpha * 0.95;
        cx.font = '700 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
        cx.textAlign = 'center'; cx.textBaseline = 'middle';
        if (mst.icon && IMG[mst.icon]) {
          const tw = cx.measureText(mst.t).width, iw = 14, ig = 4;
          const ix = u.x - (iw + ig + tw) / 2;
          cx.drawImage(IMG[mst.icon], ix, ty - 7, iw, iw);
          ctxStrokeText(mst.t, ix + iw + ig + tw / 2, ty + 0.5, 'rgba(0,0,0,.75)', 3, mst.c);
        } else {
          ctxStrokeText(mst.t, u.x, ty, 'rgba(0,0,0,.75)', 3, mst.c);
        }
        cx.restore();
      }
      continue;
    }

    const need = gap + half + (u.doom > 0 ? badgeH + 4 : 0) + 4;   // 血条上方所需高度
    const flip = (yy - h / 2 - need) < 4;                          // 贴顶 → 整体翻到卡牌下方
    const hbY = flip ? (yy + h / 2 + gap) : (yy - h / 2 - gap);

    /* 灾厄读条时血条撤掉、改画读条环（用户 2026 口径）；否则照常画十字血条 */
    if (doomChanneling(u)) drawDoomChannel(u.x, hbY, u, alpha);
    else drawCrossHP(u.x, hbY, u.hp / u.maxHp, u.hp, u.doom, u.maxHp, alpha, u.poison, u.block);

    if (u.doom > 0 && !u.dying) {
      const by = flip ? (hbY + half + badgeH / 2 + 3) : (hbY - half - badgeH / 2 - 3);
      drawDoomBadge(u.x, by, u.doom, alpha);
    }

    const st = u.mech.statusText ? u.mech.statusText() : null;
    if (st && !u.dying) {
      const ty = flip ? (hbY - half - 12) : (yy - h / 2 - 9);
      cx.save();
      cx.globalAlpha = alpha * 0.95;
      cx.font = '700 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      cx.textAlign = 'center'; cx.textBaseline = 'middle';
      if (st.icon && IMG[st.icon]) {
        /* 带图标的状态文字：小图标 + 数值，整体居中 */
        const tw = cx.measureText(st.t).width, iw = 14, ig = 4;
        const ix = u.x - (iw + ig + tw) / 2;
        cx.drawImage(IMG[st.icon], ix, ty - 7, iw, iw);
        ctxStrokeText(st.t, ix + iw + ig + tw / 2, ty + 0.5, 'rgba(0,0,0,.75)', 3, st.c);
      } else {
        ctxStrokeText(st.t, u.x, ty, 'rgba(0,0,0,.75)', 3, st.c);
      }
      cx.restore();
    }

    /* 状态徽标行：格挡/易伤/虚弱/毒素/集中（灾厄徽标独占第一格，这些往外排） */
    if (!u.dying) {
      const badges = statusBadges(u);
      if (badges.length) {
        let by = flip ? (hbY + half + badgeH / 2 + 3) : (hbY - half - badgeH / 2 - 3);
        if (u.doom > 0) by += (badgeH + 4) * (flip ? 1 : -1);
        for (const b of badges) {
          drawStatusBadge(u.x, by, b, alpha);
          by += (badgeH + 4) * (flip ? 1 : -1);
        }
      }
    }
  }
}

/* 灾厄值徽标：紫色小胶囊 = 反编译的灾厄图标 + 当前灾厄数值。
   用户 2026 口径：不要"灾厄 66"这种文字，改成图标（和状态徽标同款排版，
   只是更大一号、描边会呼吸）。缺图标时退化成紫色圆点，和 drawStatusBadge 一致。 */
function drawDoomBadge(x, y, doom, alpha) {
  const txt = ' ' + Math.floor(doom);
  cx.save();
  cx.globalAlpha = alpha;
  cx.font = '700 11px "Segoe UI",system-ui,sans-serif';
  cx.textAlign = 'left'; cx.textBaseline = 'middle';
  const tw = cx.measureText(txt).width;
  const w = 20 + tw + 8, h = 18;
  const pulse = 0.5 + 0.5 * Math.sin(world.t * 7);
  rrPath(cx, x - w / 2, y - h / 2, w, h, 9);
  cx.fillStyle = 'rgba(36,10,56,.88)';
  cx.fill();
  cx.lineWidth = 1.5;
  cx.strokeStyle = 'rgba(196,124,255,' + (0.55 + 0.4 * pulse).toFixed(3) + ')';
  cx.stroke();
  const im = IMG['pw_doom'];
  if (im) cx.drawImage(im, x - w / 2 + 4, y - 6.5, 13, 13);
  else { cx.fillStyle = '#c07ff0'; cx.beginPath(); cx.arc(x - w / 2 + 10.5, y + 0.5, 4, 0, TAU); cx.fill(); }
  ctxStrokeText(txt, x - w / 2 + 18, y + 0.5, 'rgba(10,0,18,.8)', 2.4, '#e6c2ff');
  cx.restore();
}
function ctxStrokeText(t, x, y, sc, sw, fc) {
  cx.lineWidth = sw; cx.strokeStyle = sc; cx.strokeText(t, x, y);
  cx.fillStyle = fc; cx.fillText(t, x, y);
}

/* 状态徽标（易伤/虚弱/毒素/集中）：小胶囊 = 反编译图标（毒素无图标用色点）+ 层数。
   与灾厄徽标同款式，排在灾厄徽标外侧一列纵队。 */
function drawStatusBadge(x, y, b, alpha) {
  cx.save();
  cx.globalAlpha = alpha;
  cx.font = '700 11px "Segoe UI",system-ui,sans-serif';
  cx.textAlign = 'left'; cx.textBaseline = 'middle';
  const txt = ' ' + b.t;
  const tw = cx.measureText(txt).width;
  const w = 20 + tw + 8, h = 17;
  rrPath(cx, x - w / 2, y - h / 2, w, h, 8.5);
  cx.fillStyle = 'rgba(16,12,26,.85)';
  cx.fill();
  cx.lineWidth = 1.4;
  cx.strokeStyle = b.c;
  cx.stroke();
  const iy = y + 0.5;
  if (b.icon && IMG[b.icon]) {
    cx.drawImage(IMG[b.icon], x - w / 2 + 4, y - 6.5, 13, 13);
  } else {
    cx.fillStyle = b.c;
    cx.beginPath(); cx.arc(x - w / 2 + 10.5, iy, 4, 0, TAU); cx.fill();
  }
  ctxStrokeText(txt, x - w / 2 + 18, iy, 'rgba(10,0,18,.8)', 2.4, b.c);
  cx.restore();
}

/* 十字血条：半血以上白底黑字，半血以下红底白字；血条自底部向上生长，掉血即"从上往下扣"。
   灾厄（末日降临）会自底部向上把对应比例的条身染成紫色 —— 这是"正在逼近斩杀线"的预告；
   一旦灾厄追平生命值就进入 3 秒读条，那时整条血条会被【灾厄读条环】取代（drawDoomChannel），
   不再是"整条变紫即被处决"。
   位置由 drawUnitHUD 计算（会自动翻到卡牌下方避让边界）。 */
function drawCrossHP(x, y, ratio, hp, doom, maxHp, alpha, poison, block) {
  ratio = clamp(ratio, 0, 1);
  const S = CFG.CROSS, t = S * 0.36, s = S / 2;
  const p = crossPath(S, t);
  const above = ratio > 0.5;
  const dr = clamp((doom || 0) / (maxHp || 1), 0, 1);
  cx.save();
  cx.translate(x, y);
  cx.globalAlpha = alpha;
  cx.fillStyle = above ? 'rgba(10,8,16,.84)' : 'rgba(46,9,10,.88)';
  cx.fill(p);
  cx.save();
  cx.clip(p);
  const g = cx.createLinearGradient(0, s, 0, -s);
  if (above) { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dcd6e8'); }
  else { g.addColorStop(0, '#ff6a4d'); g.addColorStop(1, '#c22b1c'); }
  cx.fillStyle = g;
  /* 血量自底部向上生长：掉血就是从上往下扣（顶端随生命值下降） */
  cx.fillRect(-s, -s + S * (1 - ratio), S, S * ratio);

  /* 灾厄侵蚀：自底部向上把对应比例染紫（灾厄值必然 ≤ 当前生命，所以不会盖出生命填充之外） */
  if (dr > 0.001) {
    const dh = S * Math.min(dr, Math.max(ratio, dr));
    const yTop = -s + S - dh;
    const dg = cx.createLinearGradient(0, s, 0, yTop);
    dg.addColorStop(0, '#5b1f96');
    dg.addColorStop(0.45, '#8b34d8');
    dg.addColorStop(0.82, '#b866f5');
    dg.addColorStop(1, '#e8bcff');
    cx.fillStyle = dg;
    cx.fillRect(-s, yTop, S, dh);
    // 侵蚀前沿的一道亮边，让"推进"看得见
    cx.fillStyle = 'rgba(240,222,255,.92)';
    cx.fillRect(-s, yTop, S, 1.7);
    // 缓慢流动的暗纹
    cx.globalAlpha = alpha * 0.3;
    cx.fillStyle = '#2a0a44';
    for (let i = 0; i < 4; i++) {
      const oy = ((world.t * 22 + i * 17) % (dh + 12)) - 6;
      if (oy > -2 && oy < dh - 2) cx.fillRect(-s, -s + S - oy - 2.2, S, 2.2);
    }
    /* 中毒侵蚀：自底部向上把「毒素/最大生命」对应比例染绿（毒结算每 2s 一次，绿条预告即将毒掉的血量） */
    const pr = clamp((poison || 0) / (maxHp || 1), 0, 1);
    if (pr > 0.001) {
      const ph = S * Math.min(pr, Math.max(ratio, pr));
      const py0 = -s + S - ph;
      const pg = cx.createLinearGradient(0, s, 0, py0);
      pg.addColorStop(0, '#3f7a1e');
      pg.addColorStop(0.55, '#6fb83a');
      pg.addColorStop(1, '#b6f07c');
      cx.fillStyle = pg;
      cx.fillRect(-s, py0, S, ph);
      // 毒前沿的一道亮边
      cx.fillStyle = 'rgba(224,255,190,.9)';
      cx.fillRect(-s, py0, S, 1.7);
    }
    cx.globalAlpha = alpha;
  }
  cx.restore();

  const danger = dr > 0.001 && doom >= hp * 0.8;
  cx.lineWidth = danger ? 2.6 : 2;
  if (danger) {
    cx.strokeStyle = 'rgba(214,150,255,' + (0.7 + 0.3 * Math.sin(world.t * 9)).toFixed(3) + ')';
  } else cx.strokeStyle = above ? 'rgba(240,236,255,.78)' : 'rgba(255,150,130,.82)';
  cx.stroke(p);

  /* 格挡（余像）：十字血条【外面再套一圈浅蓝描边】——
     画在血条本体之外（轻微放大），所以不会和上面那圈普通描边打架。
     有格挡时呼吸闪烁，一眼能看出"这一圈是挡伤用的"。 */
  if (block > 0) {
    const pulse = 0.62 + 0.38 * Math.sin(world.t * 6);
    cx.save();
    cx.globalAlpha = alpha * (0.7 + 0.3 * pulse);
    cx.strokeStyle = '#8fd4ff';
    cx.lineWidth = 3.2;
    cx.shadowColor = 'rgba(120,200,255,.9)';
    cx.shadowBlur = 9;
    cx.stroke(p);
    /* 再往外一圈极淡的浅蓝，做出"护罩"的厚度 */
    cx.globalAlpha = alpha * 0.30 * pulse;
    cx.lineWidth = 1.6;
    cx.shadowBlur = 0;
    cx.stroke(p);
    cx.restore();
  }

  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.font = '700 ' + CFG.HP_FONT + 'px "Segoe UI",system-ui,sans-serif';
  // 判断数字所在处（血条中段）的底色：被紫条盖住 / 半血以下 -> 白字黑边，否则黑字白边
  const numStr = String(Math.ceil(hp));
  if (!above || dr > 0.5) {
    cx.lineWidth = 2.6; cx.strokeStyle = 'rgba(0,0,0,.62)'; cx.strokeText(numStr, 0, 1);
    cx.fillStyle = '#ffffff';
  } else {
    cx.lineWidth = 2.0; cx.strokeStyle = 'rgba(255,255,255,.55)'; cx.strokeText(numStr, 0, 1);
    cx.fillStyle = '#141018';
  }
  cx.fillText(numStr, 0, 1);
  cx.restore();
}

/* 灾厄是否正在读条 = 灾厄值已追平生命值（读满 3 秒即斩）且还活着。
   读条期间头顶【不画血条】，改画下面的读条环。 */
function doomChanneling(u) {
  return !!u && u.doom > 0 && u.hp > 0 && !u.dying && u.doom >= u.hp;
}

/* 灾厄读条环（用户 2026 口径）：血条消失，改成一个【比余像分身读条更大的】圆环，
   中间放灾厄标志。分身那枚 R=10，这枚 R=22（直径 44，比十字血条的 62 略小一号，
   刚好占住血条的位置又不压到上面的徽标）。
   进度弧从正上方起顺时针填满，填满 = 处决；剩余时间越长弧越短。 */
function drawDoomChannel(x, y, u, alpha) {
  const R = 22;
  const k = clamp((u.doomT || 0) / DOOM_CHANNEL, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(world.t * 7);
  cx.save();
  cx.globalAlpha = alpha;
  /* 底盘：暗紫圆盘，把血条原来占的位置立起来（也让上面的数字/图标看得清） */
  cx.fillStyle = 'rgba(22,6,38,.88)';
  cx.beginPath(); cx.arc(x, y, R + 4, 0, TAU); cx.fill();
  /* 轨道 */
  cx.lineCap = 'round';
  cx.lineWidth = 5;
  cx.strokeStyle = 'rgba(96,52,140,.5)';
  cx.beginPath(); cx.arc(x, y, R, 0, TAU); cx.stroke();
  /* 读条：正上方起顺时针，越接近处决越满 */
  if (k > 0.001) {
    cx.strokeStyle = '#c07ff0';
    cx.shadowColor = 'rgba(196,124,255,.95)';
    cx.shadowBlur = 8 + 7 * pulse;
    cx.beginPath(); cx.arc(x, y, R, -Math.PI / 2, -Math.PI / 2 + TAU * k); cx.stroke();
    cx.shadowBlur = 0;
  }
  /* 中间的灾厄标志（缺图退化成紫色符文圆点） */
  const im = IMG['pw_doom'];
  if (im) cx.drawImage(im, x - 10, y - 10, 20, 20);
  else {
    cx.fillStyle = '#c07ff0';
    cx.beginPath(); cx.arc(x, y, 9, 0, TAU); cx.fill();
    cx.fillStyle = 'rgba(22,6,38,.9)';
    cx.beginPath(); cx.arc(x, y, 4.2, 0, TAU); cx.fill();
  }
  cx.restore();
}

/* ============================================================
   恶魔之手（黑暗之拥）—— 贴图与动画照反编译原版「夜魇」的屏幕特效还原
   依据：C:\Users\shenl\Desktop\项目\STS2-Decompiled
     pck-extracted/scenes/vfx/cards/nightmare_hands_vfx.tscn
       · 贴图 images/packed/vfx/combat/spooky_hand.png（5 只手，都是同一张图）
       · 节点 modulate = Color(0.833333, 0.5, 1, 0.376471) + 加法混合（ADD）
     MegaCrit.Sts2.Core.Nodes.Vfx.Cards/NSpookyHandVfx.cs
       · 入场：scale 0 → 目标值（0.4~0.5s，TRANS_SPRING + EASE_OUT —— 冲过头再弹回）
       · 悬浮：rotation = 基准 + sin(t·speed)·intensity（speed 3~5、intensity 0.1~0.3），
               中段会卡顿几拍（幅度减半）
       · 退场：scale → 目标值×0.5（TRANS_BACK + EASE_IN），同时 alpha → 0
   本作没有"整屏 5 只手"的结构，改成从墙上的黑洞里伸出 1 只，抓住对手往回拖。
   ============================================================ */

/* 贴图几何常数：全部由 tools/spooky_fit.py 按实测算出，别手改。
   spooky_hand.png 是"白形 + 真 alpha"（不透明区均色 240,240,240），
   所以"乘法染色 + lighter 混合"就等价于原版的 modulate + ADD。 */
const DH = {
  IW: 184, IH: 254,      // 裁掉留白后的贴图尺寸
  U0: 157,               // 贴图顶端（前臂断面）的前臂中心 u —— 手臂接这里
  ROT: -0.20654,         // 前臂相对 +v 的自然倾角：把贴图转正后手臂才是一条直线
  TIPX: 262.6,           // 转正后"沿轴最远的实心像素"距断面的距离（贴图单位）
  LEN: 210,              // 希望手在场地里有多长 → 反推缩放
  TINT: '#d480ff',       // = Color(0.833, 0.5, 1)：淡紫
  A: 0.376,              // = 0.376471：原版 modulate 的 alpha
  /* 纯观感补偿，不影响还原关系：原版同屏 5 只手且互相叠两三层，加法混合下自然更亮；
     本作只画 1 只，照原值在近黑场地上偏暗，整体抬 1.5 倍。 */
  GAIN: 1.5,
  HOLE: 54               // 黑洞沿墙面的半长轴
};
DH.S = DH.LEN / DH.TIPX;

/* 通用贴图染色（RGB 乘一下、保留原 alpha）——与 sbTint 同一套做法 */
function tintTex(key, color) {
  const im = IMG[key];
  return im ? sbTint(im, color) : null;
}

/* 入场回弹曲线（≈ Godot 的 TRANS_SPRING + EASE_OUT）：先冲到约 1.1 再落回 1 */
function springOut(u) {
  if (u >= 1) return 1;
  const c = 1.55, t = u - 1;
  return 1 + (c + 1) * t * t * t + c * t * t;
}

/* 椭圆黑洞：配色与结构照「末日降临 / 灾厄斩杀」的 DoomHole（黑核 → 深紫 → 紫环），
   椭圆再转 90° —— DoomHole 是横躺的（scale(1,0.42)），这里是竖立的（scale(0.42,1)），
   变成墙上一道竖裂缝，手从裂缝里伸出来。 */
function drawDemonHole(ctx, R, k) {
  k = clamp(k, 0, 1);
  if (k <= 0.002) return;
  const r = R * (0.30 + 0.70 * clamp(k * 1.7, 0, 1));
  ctx.save();
  ctx.scale(0.42, 1);
  ctx.globalAlpha = clamp(k * 3, 0, 1);
  const g = ctx.createRadialGradient(0, 0, r * 0.08, 0, 0, r);
  g.addColorStop(0, '#000000');
  g.addColorStop(0.60, '#0b0212');
  g.addColorStop(0.88, 'rgba(120,50,180,.85)');
  g.addColorStop(1, 'rgba(120,50,180,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = clamp(k * 3, 0, 1) * 0.8;
  ctx.strokeStyle = '#a86be0'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, TAU); ctx.stroke();
  ctx.restore();
}

/* ---------- 黑暗之拥：腕口的粒子（世界坐标，不跟手） ----------
   ★ 上一版是把碎屑画在【手贴图的局部坐标】里 —— 于是整簇碎屑粘在手身上，
     手往哪走它跟到哪，看着像"手背糊了一层皮"，而不是从断口迸出来的粒子。
   ★ 现在照 SbMote 的做法：在【世界坐标】里随机生成一颗，
     它这辈子就只按自己的速度飘 + 自己淡出，手缩回去也照飘不误。
     两种手感靠 calm 区分：普通火星飘得快、活得短；calm 的雾团几乎不动、活 0.6~1.15s，
     专门堵在断口上把那个"齐刷刷的平口"糊掉。
   ★ 故意不设 manual：交给引擎统一 update / draw ——
     手死了之后，已经飘在空中的粒子仍会自己飘完、自然销毁。 */
class WristMote extends Effect {
  constructor(x, y, outX, outY, size, calm, spark) {
    super();
    this.x = x; this.y = y;
    const sp = calm ? vrand(3, 12, 'vrand') : vrand(20, 60, 'vrand');   // calm = 基本原地糊住断口
    this.vx = outX * sp + vrand(-34, 34, 'vrand');
    this.vy = outY * sp + vrand(-46, -4, 'vrand');            // 整体略带上飘
    this.drag = calm ? vrand(2.6, 4.0, 'vrand') : vrand(1.7, 3.1, 'vrand');
    this.t = 0;
    this.life = calm ? vrand(0.60, 1.15, 'vrand') : vrand(0.38, 0.88, 'vrand');
    this.size = size;
    this.calm = calm;
    this.spark = spark;                             // 四芒星小火苗（和剑身光尘同一套画法）
    this.ph = vrand(0, TAU, 'vrand');
    this.twA = calm ? 0.30 : 0.45;                  // 闪烁幅度：雾团更稳，火星更闪
    this.twF = calm ? 6 : 13;
    this.amp = calm ? 0.34 : 1.0;                   // 雾团压得很暗：几十颗叠一起才不会糊成白斑
  }
  update(dt) {
    this.t += dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vx *= Math.exp(-this.drag * dt);
    this.vy *= Math.exp(-this.drag * 0.62 * dt);
    if (this.t > this.life) this.dead = true;
  }
  draw(ctx) {
    const k = clamp(this.t / this.life, 0, 1);
    const fade = (1 - k) * (1 - k);                                  // 尾段加速消失
    const tw = 1 - this.twA + this.twA * (0.5 + 0.5 * Math.sin(this.t * this.twF + this.ph));
    const a = fade * tw * this.amp;
    if (a < 0.015) return;
    const r = this.size * (1 - 0.34 * k);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (this.spark) {
      /* 四芒星小火苗：跟剑身光尘同一套画法（一圆底 + 两枚细菱形交叉） */
      const s = this.size * 1.9 * (1 - 0.30 * k);
      sbDisc(ctx, this.x, this.y, s * 0.55, [150, 92, 236], 1.2, 0.22 * a);
      sbStar(ctx, this.x, this.y, s, 0.085, this.ph, [236, 206, 255], 0.72 * a);
      ctx.restore();
      return;
    }
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
    /* 芯偏淡紫而不是纯白 —— 加法混合叠几十颗时，白芯会累加成灰白雾，
       紫芯叠加才还是紫的（和夜魇特效的 modulate 色一致）。 */
    g.addColorStop(0, 'rgba(216,178,255,.46)');
    g.addColorStop(0.30, 'rgba(168,86,240,.36)');
    g.addColorStop(1, 'rgba(104,36,164,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* 在「腕口断面」上随机取一点生成一颗粒子，然后交给世界自己飘。
   断面在手的局部坐标系里是 x=base、y∈[-hw,hw] 那条线；
   局部 (along, across) → 世界 = 手方向·along + 手侧向·across。 */
function wristMoteAt(wx, wy, nx, ny, hw) {
  const along = vrand(-1, 1, 'vrand') * hw * 0.80;          // 沿手方向：稍微有一点厚度
  const across = vrand(-1, 1, 'vrand') * hw * 1.35;         // 横跨手：铺满整个断口宽度（略宽一点更散得开）
  const calm = vchance(0.16);              // 少量雾团专门糊住断面
  const spark = !calm && vchance(0.45);    // 一批带四芒星的"火苗"
  const size = calm ? hw * vrand(0.60, 1.05, 'vrand')
                    : spark ? hw * vrand(0.30, 0.62, 'vrand')
                            : hw * vrand(0.15, 0.40, 'vrand');
  world.effects.push(new WristMote(
    wx + nx * along - ny * across,
    wy + ny * along + nx * across,
    nx, ny, size, calm, spark));
}

/* live = liveState() 的返回值：{ pop 入场回弹, shrink 额外缩放, alpha 总体不透明度,
           hole 洞口张开 0..1, jit 抖动角, k 缩放, base 断面位置, hw 断面半宽 }
   腕口的粒子不在这里画 —— 它们是世界坐标的独立粒子（见 WristMote）。 */
function drawDemonHand(ctx, px, py, ang, len, grip, live) {
  const gripK = clamp(grip, 0, 1);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang);

  const tex = tintTex('sp_demon_hand', DH.TINT);
  const k = DH.S * Math.max(0, live.pop) * clamp(live.shrink, 0.05, 2);
  const base = len - DH.TIPX * k;          // 贴图前臂断面距洞口的距离

  /* 1. 黑洞：跨在墙面上（一半在墙外），手从它前面伸出来 */
  drawDemonHole(ctx, DH.HOLE, live.hole);

  /* 2. 手（原版贴图）：加法混合 + 淡紫染色。
        只画"墙前面"的部分 —— 贴图根部还在墙里时会被这一刀切掉，
        看起来正是手从裂缝里一点点挤出来（先指尖、后掌、最后手腕）。
        贴图的 +v（前臂→指尖）对齐"从墙里伸出去"的法线方向：
        rotate(-90°) 把 +v 转到 +x，再补 DH.ROT 把前臂的自然倾斜摆正，
        这样手臂是一条直线、指尖稳稳落在抓取点上。 */
  if (tex && live.alpha > 0.01) {
    ctx.save();
    ctx.beginPath(); ctx.rect(-2, -4000, 9000, 8000); ctx.clip();
    ctx.translate(base, 0);
    ctx.rotate(-Math.PI / 2 + DH.ROT);
    ctx.rotate(-live.jit);                 // 原版的悬浮抖动
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = DH.A * DH.GAIN * live.alpha * (1 + 0.5 * gripK);
    ctx.drawImage(tex, -DH.U0 * k, 0, DH.IW * k, DH.IH * k);
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- 结算横幅的入场演出 ----------
   原来是"啪"地整块出现（一帧之内条带+文字全到位），很生硬。
   现在按真实时间走一小段（0.5s 量级，不冻结对战）：
     · 全场从 0 渐入一层很淡的黑（0.26）—— 给对局一个收束感
     · 条带：高度从 1.45 倍"压"到 1 倍、横向从 0.94 展到 1、透明度 0 → .72
     · 文字：晚 0.16s 起，淡入 + 从下方 10px 归位 + 字号从 1.12 收到 1
   全部 easeOutCubic，和开场过场（INTRO）一个路子；两者互不干扰。 */
const OVER = { on: false, t: 0, for: null };
const OVER_TL = { barIn: 0.45, textDelay: 0.22, textIn: 0.55, dimIn: 0.40 };
/* 演出状态跟【当前这个 world.over 对象】绑定：换了新的一局（over 变 null 或换对象）
   就从头开始播。这样"无头直接 runFullMatch 完再 draw"也不会被上一次的残留状态卡住。 */
function tickOver(dt) {
  if (world.over) {
    if (OVER.for !== world.over) { OVER.for = world.over; OVER.t = 0; OVER.on = true; }
    OVER.t += dt;
  } else if (OVER.on || OVER.for) { OVER.for = null; OVER.on = false; OVER.t = 0; }
}

function drawOverlayBanner() {
  if (!world.over || !cx) return;
  const W = CFG.AW, H = CFG.AH;
  /* 没有在播（无头验证直接调本函数、或 on/for 与当前 over 对不上）
     就按"演出已完成"画，保证画面上该有的东西一个不少。 */
  const T = (OVER.on && OVER.for === world.over) ? OVER.t : 999;
  const eo = t => 1 - Math.pow(1 - t, 3);                     // easeOutCubic
  const kBar = eo(clamp(T / OVER_TL.barIn, 0, 1));
  const kTxt = eo(clamp((T - OVER_TL.textDelay) / OVER_TL.textIn, 0, 1));
  const kDim = eo(clamp(T / OVER_TL.dimIn, 0, 1));
  cx.save();
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  /* ① 全场压暗 */
  if (kDim > 0) {
    cx.globalAlpha = 0.26 * kDim;
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, W, H);
  }
  /* ② 条带：从大压到正常 + 淡入（原样式 = #08060e × .72，高度占屏 19%、中心在 43.5% 高） */
  const cy = H * 0.435, bh = H * 0.19;
  const hh = bh * (1 + 0.45 * (1 - kBar));
  const bw = W * (0.94 + 0.06 * kBar);
  cx.globalAlpha = 0.72 * kBar;
  cx.fillStyle = '#08060e';
  cx.fillRect((W - bw) / 2, cy - hh / 2, bw, hh);
  /* ③ 文字：写【获胜的那张卡牌】而不是"红方/蓝方"；平局两边都不写。文字统一纯白。 */
  if (kTxt > 0.002) {
    const win = world.over.win;
    const txt = win < 0 ? '平  局' : ('胜者：' + winnerName(win));
    cx.globalAlpha = kTxt;
    cx.font = '700 ' + (34 * (1 + 0.12 * (1 - kTxt))).toFixed(1) +
      'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    cx.lineWidth = 6; cx.strokeStyle = 'rgba(0,0,0,.8)';
    const ty = cy + 10 * (1 - kTxt);
    cx.strokeText(txt, W / 2, ty);
    cx.fillStyle = '#ffffff';
    cx.fillText(txt, W / 2, ty);
  }
  cx.restore();
}
/* ============================================================
   9.5 战斗开始过场 —— 还原《杀戮尖塔 2》的 CombatStartBanner
   ============================================================
   反编译出处（本项目外的参考代码，不在仓库里）：
     · src/Core/Nodes/Combat/NCombatStartBanner.cs   —— 动画时间线与缓动
     · scenes/combat/combat_start_banner.tscn        —— 节点结构与配色
   原版画的是：一条横贯全屏的【暗红条带】+ 居中的【金色大字】，
   两者同时"从大缩到正常 + 淡入"，字停一会儿先淡出，条带最后收走。
   原版数值（1920×1080 设计分辨率）：
     · 条带：全宽，高 16.6%，中心在屏幕 44.9% 高度；Color(16,0,0) × 0.502 × modulate 0.5
             = 屏幕上约 0.251 的暗红；初始 scale 1.2 缩到 1
     · 字：font_size 96、金色 #efc851、黑描边 outline_size 24、居中在 45.6% 高度；
           初始 scale 2.0 缩到 1
     · 缓动全是 Expo Out（文字淡出/条带淡出用 Cubic Out）
   本地化文本取自 pck 的 localization/zhs/gameplay_ui.json → "战斗开始"，

   ⚠ 唯一一处有意偏离原版：原版条带要留到 5.1s，是因为紧接着还有一段

   ⚠ 再说一次更彻底的改：用户要求条带【跟文字一同消失】—— 原先条带要等标题完全
     淡完（2.40s）再过 0.05s 才开始收、收到 2.95s，视觉上就是"字没了、黑底还挂着"。
     现在 titleOut 与 barOut【同一起点、同一时长】（barGap = 0），两者 2.40s 一起没了，
     整段 2.95 → 2.40s。想让条带比字早/晚一点点，把 barGap 调负/调正即可。
   ⚠ 它只是画在画面上的一层演出，不冻结对战。想改成"开场先停顿 3.6s 再开打"说一声。 */
const INTRO = { on: false, t: 0 };
/* 时间线（秒）：0.30 起步 → 条带 0.75 缩入 → 标题 1.30 淡入 / 0.75 缩入

const INTRO_TL = {

     barOut 默认与 titleOut 同长，保证"一同消失"。 */
  titleOut: 0.80, barGap: 0, barOut: 0.80,
  get total() {
    return this.lead + this.titleIn
      + Math.max(this.titleOut, this.barGap + this.barOut);

const easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
function playIntro() { INTRO.on = true; INTRO.t = 0; }
function tickIntro(dt) {

function drawStartIntro() {

  /* 原版设计分辨率 1920×1080（16:9），本作画布是 660×660 正方形（1:1）。

     （于是"四个字占屏宽 20%"这条视觉特征也和原版一样）。
     反例：按高度缩放（k=H/1080）字会涨到占屏宽 35%，直接压在两张卡面上，很挤。
     想让整块横幅更大更小，只调 k 这一个数。 */
  const k = W / 1920;
  const t = INTRO.t, TL = INTRO_TL;
  const prog = (start, dur) => clamp((t - start) / dur, 0, 1);
  /* 文字与条带共用同一个收尾起点 —— 这是"一同消失"的关键，别再给各自算起点。 */
  const tOutStart = TL.lead + TL.titleIn;

  /* --- 条带：暗红横条，围绕自身中心从 1.2 缩到 1 --- */
  const barIn = easeOutExpo(prog(TL.lead, TL.barIn));
  const barOut = easeOutCubic(prog(tOutStart + TL.barGap, TL.barOut));
  /* 原版屏幕上的最终透明度是 ColorRect.color.a(0.502) × modulate.a(0.5) = 0.251 —— 
     但原版的战场是【亮色】的战斗场景，0.251 的暗红压上去就是一条明显的横带；
     本作战场背景是深蓝紫(#1b1627)，同样的 0.251 叠上去几乎看不出边界（实测图上找不到条带）。
     所以这里取 ColorRect 自身的 0.502（原版数值的一半），才还原出"一条看得见的暗红横带"。 */
  const barA = 0.502 * barIn * (1 - barOut);
  const barS = 1.2 - 0.2 * barIn;
  if (barA > 0.002) {
    /* 条带【位置】按屏幕高度定（原版是 anchor 0.366~0.532），【粗细】按 k 走 —— 
       原版条带高 180px，所以半高 90×k。 */
    const cy = H * 0.449, hh = 90 * k;
    cx.save();
    cx.translate(W / 2, cy); cx.scale(barS, barS); cx.translate(-W / 2, -cy);
    cx.fillStyle = 'rgba(16,0,0,' + barA.toFixed(3) + ')';
    cx.fillRect(0, cy - hh, W, hh * 2);
    cx.restore();
  }

  /* --- 标题：金色大字 + 黑描边，围绕屏幕中心从 2 倍缩到 1 --- */
  const titleIn = easeOutExpo(prog(TL.lead, TL.titleIn));
  const titleS = 2.0 - 1.0 * easeOutExpo(prog(TL.lead, TL.titleInScale));
  const titleOut = easeOutCubic(prog(tOutStart, TL.titleOut));
  const titleA = titleIn * (1 - titleOut);
  if (titleA > 0.002) {
    cx.save();
    cx.translate(W / 2, H / 2); cx.scale(titleS, titleS); cx.translate(-W / 2, -H / 2);
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.font = '700 ' + (96 * k).toFixed(1) + 'px "Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif';
    cx.globalAlpha = titleA;
    /* Godot 的 outline_size 是"向外扩 24px"，canvas 的 strokeText 是两侧各半 → 取 2 倍 */
    cx.lineWidth = 48 * k;
    cx.strokeStyle = 'rgba(0,0,0,.5)';
    cx.strokeText('战斗开始', W / 2, H * 0.456);
    cx.fillStyle = '#efc851';
    cx.fillText('战斗开始', W / 2, H * 0.456);
    cx.restore();
  }
}
