<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>杀戮尖塔小球</title>
<!-- 构建标记：正式版 main / 开发者版 dev（见 tools/build.py）。游戏逻辑里可用 __BUILD__ 判断。 -->
<script>window.__BUILD__ = '__BUILD_TAG__';</script>
<!-- 开发者版会在这里插一行可见的版本标记，正式版为空 -->
__BUILD_BADGE__
<style>
:root{
  /* ── 配色：纯色半透明黑底 + 白字（模仿原版 UI）──────────────────
     原版的面板就是"在场景上盖一层半透明黑"，字是纯白，只有标题/强调才用金色。
     所以这里不再用任何带紫的色值：
       --bg   页面最底层（不透明 —— 它下面没东西，半透明只会露出浏览器白底）
       --panel/--bg2  各种背板 —— 半透明黑，有布景时透出布景、没布景时叠黑 = 纯黑
       --line/--line2 描边用低透明白（原版也是白描边，不是彩色）
       --txt  纯白字；--dim 次级字用低透明度白 */
  color-scheme:dark;                  /* 让 <select>、滚动条等原生控件走暗色，不然是白底 */
  --bg:#000; --bg2:rgba(0,0,0,.42); --panel:rgba(0,0,0,.58); --panel2:rgba(0,0,0,.70);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.28);
  --txt:#fff; --dim:rgba(255,255,255,.62); --gold:#e8b25a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;}
#app{max-width:1300px;margin:0 auto;padding:10px 12px 26px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:6px 2px 10px}
/* 标题整体纯白（原来"杀戮尖塔"是高亮金色） */
header h1{margin:0;font-size:19px;letter-spacing:.5px;font-weight:700;color:#fff}
header h1 b{color:#fff}
.grid{display:grid;grid-template-columns:206px minmax(0,1fr) 206px;gap:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px}
.panel h2{margin:0 0 7px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sideL .dot{background:#c8503f;box-shadow:0 0 8px #c8503f}
.sideR .dot{background:#3f8fc8;box-shadow:0 0 8px #3f8fc8}
.bigcard{width:100%;display:block;border-radius:7px}
.cname{font-size:15px;font-weight:700;margin:7px 0 3px;text-align:center;color:var(--gold)}
.ctag{font-size:10px;color:var(--dim);text-align:center;margin-bottom:6px;letter-spacing:.5px}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.thumbs button{padding:0;border:1px solid var(--line);background:rgba(0,0,0,.5);border-radius:5px;
  cursor:pointer;overflow:hidden;line-height:0;transition:border-color .12s,transform .12s}
.thumbs button:hover{border-color:var(--line2);transform:translateY(-1px)}
.thumbs button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.thumbs img{width:100%;display:block}
.stagebox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;
  display:flex;justify-content:center}
canvas{display:block;width:100%;max-width:660px;height:auto;border-radius:6px}

/* ---------- 整页战斗背景布景（设置里选） ----------
   #sceneBg 是一张铺满视口的固定底图（position:fixed 等价 background-attachment:fixed，
   移动端更稳）。竞技场那块 canvas 自己不铺底色，于是它会"透出"正后方这一张 ——
   所以竞技场里的布景和页面四周天然是同一张的同一处，接缝不会错位。

   z-index 为什么不用负数：html 和 body 都写了 background（见文件开头那条规则），
   html 有背景 → body 的背景不再"上交给画布"，而是当成 body 自己的盒子背景画出来；
   而负 z-index 的子元素属于根层叠上下文、在 body 盒子背景【之前】绘制 —— 会被整块盖掉。
   所以这里用 z-index:0 的普通图层 + #app{z-index:1} 压在上面。 */
#sceneBg{position:fixed;inset:0;z-index:0;pointer-events:none;  background-position:center;background-size:cover;background-repeat:no-repeat}
#app{position:relative;z-index:1}
body.scene .stagebox{background:transparent;border-color:transparent}
/* 面板/工具栏本身就是"半透明黑"，有布景时自然会透出布景，不需要为 body.scene 再写一套 */

/* ---------- 设置弹窗 ---------- */
#setMask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(0,0,0,.74)}
#setMask.on{display:flex}
#setBox{width:min(620px,100%);max-height:86vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px 16px}
#setBox h2{margin:0;font-size:15px;color:#fff}
#setBox .sub{font-size:11px;color:var(--dim);margin:3px 0 4px}
#setBox h3{margin:15px 0 7px;font-size:13px;color:var(--gold);font-weight:700}
#setBox select{width:100%;background:rgba(0,0,0,.55);color:var(--txt);border:1px solid var(--line2);
  border-radius:7px;padding:8px;font-family:inherit;font-size:13px}
#setBox optgroup{color:var(--gold);background:rgba(0,0,0,.9);font-style:normal}
#setBox option{color:var(--txt);background:rgba(0,0,0,.9)}
.bggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
/* ⚠ background 必须显式写成 transparent。
   <button> 的 UA 默认背景是 rgb(240,240,240)（浅灰白）；按钮底图的四角是透明的
   （圆角外面），白底就从那儿露出来 —— 看着就是"按钮有一圈白边"。
   工具栏的 button.btn 当初写了 background:transparent 所以没这毛病，这里当初漏了。
   另外这里也**不用九宫格**，理由与 button.btn 那段注释相同。 */
.bggrid button{cursor:pointer;color:#fff6e2;font-family:inherit;font-size:12px;line-height:18px;
  border:0;padding:8px 6px;background-color:transparent;
  background-image:var(--btn-rest);background-size:100% 100%;background-repeat:no-repeat;
  text-shadow:0 1px 2px rgba(0,18,22,.8);transition:color .06s}
.bggrid button:hover{background-image:var(--btn-bright);color:#efc851}
.bggrid button.on{background-image:var(--btn-bright);color:#efc851;
  box-shadow:0 0 0 2px rgba(239,200,81,.55)}
#setBox .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#setBox .note{font-size:11px;color:var(--dim);margin-top:9px;line-height:1.7}
/* 工具栏（开始/暂停/重置/倍速/音效）：原来在页面底部的 <footer>，现在挪到标题下方。
   标签一并从 footer 改成 .toolbar —— 它在顶部，语义上不再是页脚。 */
.toolbar{margin:0 0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px}
/* ── 按钮 = 《杀戮尖塔 2》原版按钮 ─────────────────────────────────────
   底图取自反编译的 images/ui/reward_screen/reward_item_button.png（910×196，
   青灰圆角矩形 + 顶部亮青高光线 + 深色做旧描边），是原版所有按钮共用的那**一张**。
   原版靠 shaders/hsv.gdshader 给同一张底图调明暗（所有按钮 h 都是 1.0，色相不转）：
     常态 s=0.8 / v=0.9      悬停 s=1.1 / v=1.1      （见 NPauseMenuButton.cs）
   这里把两档**预先烘成两张图**（tools/_sts2/build_ui.py），CSS 只负责换图 ——
   不写 filter，免得连文字一起染。
   原版行为一并还原：悬停放大 5.6%、按下 y 下移 3px；
   文字常态 cream #FFF6E2、悬停转 gold #EFC851（StsColors.cs）。

   ⚠ 为什么【整图拉伸】而不是九宫格 border-image（2026-09-23 踩坑后改）：
   一开始用 `border-image-slice:34` 做九宫格，结果按钮上出现一圈"细小的井字纹"——
   九宫格的四条分界线。根因：① 这张图的圆角很大（横向半径约 48px、纵向约 42px），
   slice 取 34 直接把切缝开在圆角中间；② 角块与边块的缩放比天生不同
   （源 34px 的角块 → 8px 目标 = 0.235，而源 842px 的上边块 → 174.7px = 0.208），
   分界处采样相位差 2~4 个源像素，而源图那里恰好是高光线/黑描边这种高对比，
   于是显形。把 slice 按"两方向比例相等"反解（58 48 58 48 / width 10px）只能减轻，
   因为源图的高光线本身就是在圆角处结束的，切缝怎么放都挨着高对比。
   改用整图拉伸后分界线彻底消失 —— 这也正是原版的做法（Godot 里就是整张贴图
   缩放到目标尺寸）。代价是宽高比与图不一致时圆角会被拉成椭圆，
   但按钮就那么高（34px），差异在 1~2px 级，肉眼无感。
   注意 background-origin 默认是 padding-box，所以这里 border 必须为 0
   （高度靠 padding 撑），否则图会被内缩、按钮看着变矮。 */
button.btn{cursor:pointer;color:#fff6e2;font-size:13px;font-family:inherit;
  border:0;padding:8px 14px;line-height:18px;
  background-color:transparent;
  background-image:var(--btn-rest);background-size:100% 100%;background-repeat:no-repeat;
  text-shadow:0 1px 2px rgba(0,18,22,.8);
  transition:color .06s,transform .12s}
button.btn:hover:not(:disabled){background-image:var(--btn-bright);color:#efc851;
  transform:scale(1.055)}
button.btn:active:not(:disabled){transform:scale(1.055) translateY(3px)}
button.btn:disabled{opacity:.42;filter:grayscale(.9);cursor:default}
/* 主按钮（开始战斗 / 完成）：直接用悬停档的明亮底，让它一直显眼 */
button.btn.pri{background-image:var(--btn-bright);color:#efc851}
button.btn.pri:hover:not(:disabled){color:#fff6e2}
/* 倍速选择器：整条用同一张底图，三个格子透明，选中格加一层浅色 + 金字 */
.seg{display:inline-flex;align-items:stretch;vertical-align:middle;padding:8px 0;
  background-image:var(--btn-rest);background-size:100% 100%;background-repeat:no-repeat}
.seg button{cursor:pointer;border:0;background:transparent;color:#fff6e2;font-size:13px;
  padding:0 11px;font-family:inherit;line-height:18px;
  text-shadow:0 1px 2px rgba(0,18,22,.8)}
.seg button:hover{color:#efc851}
.seg button.on{background:rgba(255,255,255,.12);color:#efc851;border-radius:4px}
.hint{font-size:11px;color:var(--dim);margin-left:auto}

/* ---------- 种子：工具栏按钮 + 下拉子界面 + 右下角角标 ----------
   「指定种子」原来只存在于开发者版的面板里，现在下放到正式版做成一个按钮：
   点开是下拉子界面（输入框 / 随机一个 / 用该种子开战），
   子界面里还带「显示种子」开关 —— 打开后当前对局种子以右下角小字常驻显示。 */
.seedwrap{position:relative;display:inline-flex}
.seedpop{position:absolute;left:0;top:calc(100% + 8px);z-index:56;display:none;width:320px;
  background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:11px;
  box-shadow:0 16px 44px rgba(0,0,0,.62)}
.seedpop.on{display:block}
.seedpop .row{display:flex;gap:7px;align-items:center;margin:7px 0}
.seedpop .row>label{font-size:11px;color:var(--dim);white-space:nowrap}
.seedpop input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.55);color:var(--txt);
  border:1px solid var(--line2);border-radius:7px;padding:7px 8px;
  font-family:Consolas,monospace;font-size:12px}
.seedpop .row .btn{padding:7px 10px;font-size:12px}
.seedpop .chk{display:flex;align-items:center;gap:7px;margin:9px 0 2px;font-size:12px;
  cursor:pointer;user-select:none}
.seedpop .chk input{accent-color:var(--gold);margin:0}
.seedpop .note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:7px}
/* 右下角种子角标：小字、低对比、不吃鼠标事件（否则会挡住画布右下角的操作） */
#seedTag{position:fixed;right:10px;bottom:9px;z-index:40;display:none;pointer-events:none;
  font:11px/1.3 Consolas,monospace;color:rgba(255,255,255,.52);
  background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
#seedTag.on{display:block}

/* ---------- 录制模式（PC 专属，按 S 开关；逻辑见「10.3 录制模式」） ----------
   录屏时只要画面，不要任何按钮：
     · 标题 / 工具栏 / 开发者面板（按钮 + 面板）/ 开发者版版本条 / 右下角种子角标 全部隐藏
     · 竞技场放大到几乎占满视口，离边框只留 REC.margin（16px）
     · 两侧只保留双方卡面 + 中英文名，**竖直居中**，并且
       "卡面到网页边缘的距离 = 卡面到竞技场边缘的距离"（见下面 1fr / 1fr 的排法）
   尺寸的单一来源在 fit()：它算出竞技场边长写进 --rec-arena，并按 --rec-card 放大卡面。 */
body.rec{overflow:hidden}
/* ⚠ #app 必须钉在视口上（fixed inset:0），不能只靠 height:100vh。
   开发者版的版本条 #buildBadge 是【body 的子元素】（build.py 注入在 head 里，
   浏览器把它挪到 body 开头），它 27px 高 + 10px 下边距 —— 于是 #app 从 y=37 开始、
   高 100vh，整个竞技场被推下去 37px：**顶部留空 53px、底部反而被切掉 21px**。
   钉成 fixed 之后，不管 body 里还有什么，竞技场都相对视口居中。 */
body.rec #app{position:fixed;left:0;top:0;right:0;bottom:0;max-width:none;padding:0;z-index:2}
body.rec header,body.rec .toolbar{display:none!important}
body.rec #buildBadge{display:none!important}
body.rec #devSlot{display:none!important}
body.rec #seedTag{display:none!important}
/* 三列 = 1fr / 竞技场边长 / 1fr：中间那列由 fit() 写死的 --rec-arena 撑开，
   两侧剩下的空间【平均分】。于是卡面在两侧各自的那条带子里居中 →
   到网页边缘的距离与到竞技场边缘的距离天然相等（带子比卡面窄时就是左右各一个 padding）。 */
body.rec .grid{grid-template-columns:1fr var(--rec-arena,660px) 1fr;height:100vh;gap:0;align-items:center}
body.rec .panel{background:transparent;border-color:transparent}
body.rec .panel h2{display:none!important}
body.rec .thumbs{display:none!important}
/* 卡面：带子宽时按 --rec-card 封顶并居中；带子窄时退回 100%（左右各留 panel 的 padding，仍然对称） */
body.rec .bigcard{width:100%;max-width:var(--rec-card,232px);
  margin-left:auto;margin-right:auto}
body.rec .stagebox{height:100vh;align-items:center;padding:0;border:0;background:transparent}
body.rec canvas{border-radius:0}

/* ---------- 系列赛（PvE / AI vs AI）：覆盖层 / 角色卡 / 卡组陈列 / 比分条 ----------
   覆盖层结构照抄 #setMask（fixed 全屏遮罩 + 居中盒子），内容按阶段整块重绘。
   系列赛进行中两侧选卡面板只读（作背景展示当前局双方卡面）。 */
body.series .panel{pointer-events:none;opacity:.85}
.stagebox{position:relative}          /* #seriesBar 的定位锚 */
#seriesMask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(0,0,0,.78)}
#seriesMask.on{display:flex}
#seriesBox{width:min(880px,100%);max-height:88vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px 18px 18px}
#seriesBox h2{margin:0;font-size:16px;color:#fff}
#seriesBox .sub{font-size:11px;color:var(--dim);margin:3px 0 10px;line-height:1.6}
#seriesBox h3{margin:14px 0 8px;font-size:13px;color:var(--gold);font-weight:700;
  display:flex;align-items:center;gap:8px}
#seriesBox h3 img{width:22px;height:22px;border-radius:4px;display:block}
#seriesBox .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}
#seriesBox .log{font-size:12px;color:var(--dim);line-height:1.9;margin-top:6px;white-space:pre-line}
#seriesBox .note{font-size:11px;color:var(--dim);line-height:1.6}
/* 角色选择：竖版头像卡（选人头像 132×195 + 一行能力说明） */
.charRow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.charCard{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.45);
  padding:7px 7px 8px;text-align:center;transition:border-color .12s,transform .12s}
.charCard:hover{border-color:var(--line2);transform:translateY(-2px)}
.charCard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.charCard img{width:66%;max-width:88px;border-radius:6px;display:block;margin:0 auto 6px}
.charCard .nm{font-size:12px;font-weight:700;color:#fff}
.charCard .ds{font-size:10px;color:var(--dim);line-height:1.5;margin-top:4px;min-height:44px}
/* 卡组陈列：每套一列 3 张缩略卡；被烧毁的卡压灰 + 叉。
   红蓝两侧并排（.sets2col），窄屏退回上下堆叠。 */
.sets2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.setGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.setCol{border:1px solid var(--line);border-radius:9px;padding:7px;background:rgba(0,0,0,.42)}
.setCol .st{font-size:11px;color:var(--dim);text-align:center;margin-bottom:2px}
.setCol .st b{color:var(--txt)}
.setCol .reroll{display:block;margin:0 auto 6px;font-size:10px;padding:4px 8px;line-height:14px}
.setCol.pickable .cardThumb{cursor:pointer}
.setCol.pickable{border-color:var(--line2)}
.cardThumb{position:relative;width:100%;max-width:110px;margin:4px auto;border-radius:5px;
  overflow:hidden;line-height:0;border:1px solid transparent}
.cardThumb img{width:100%;display:block}
.cardThumb.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cardThumb.burned{filter:grayscale(1) brightness(.55)}
.cardThumb.burned::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:26px;color:#ff6b5e;font-weight:700;line-height:1}
@media(max-width:900px){.sets2col{grid-template-columns:1fr}}
/* 比分条：战斗时盖在画布顶部中间 */
#seriesBar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:30;display:none;
  align-items:center;gap:8px;padding:5px 12px;border-radius:8px;
  background:rgba(0,0,0,.66);border:1px solid var(--line2);
  font-size:12px;color:var(--txt);white-space:nowrap}
#seriesBar.on{display:flex;animation:srsBar .3s ease-out both}
#seriesBar img{width:22px;height:22px;border-radius:4px;display:block}
#seriesBar .sc{font-size:15px;font-weight:700;color:var(--gold)}
#seriesBar .sd{color:var(--dim)}

/* ---------- 系列赛衔接动画（一次性标记驱动，见 seriesRender 末尾） ----------
   srsIn = 阶段面板滑入；cardIn = 缩略卡逐张入场（--i 决定先后，只在 anim 渲染播）；
   logIn = 日志逐行浮现；burnFlash = 烧毁卡火光（fxBurnNow 渲染只播一次）；
   srsMask/srsBar = 覆盖层与比分条出现。所有动画都短（0.25~0.45s），不挡操作。 */
@keyframes srsIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes srsMask{from{opacity:0}to{opacity:1}}
@keyframes srsBar{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes cardIn{from{opacity:0;transform:scale(.88) translateY(6px)}to{opacity:1;transform:none}}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes burnFlash{0%{filter:brightness(2.2) sepia(1) hue-rotate(-30deg)}55%{filter:brightness(1.5) sepia(.6)}
  100%{filter:grayscale(1) brightness(.55)}}
#seriesMask.on{animation:srsMask .22s ease-out both}
.srsBody.anim .cardThumb{animation:cardIn .34s ease-out both;animation-delay:calc(var(--i,0)*40ms)}
.srsBody.anim .logLn{animation:logIn .3s ease-out both;animation-delay:calc(var(--i,0)*90ms + .15s)}
.srsBody.anim .stageStrip{animation:srsIn .3s ease-out both}
.srsBody.fxBurnNow .cardThumb.burned{animation:burnFlash .7s ease-out both}
.srsBody.anim{animation:srsIn .32s ease-out both}
/* 阶段进度条：换牌 → 烧牌 → 选牌（只列本次实际存在的阶段） */
.stageStrip{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-size:12px}
.stageStrip .stg{padding:2px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);background:rgba(0,0,0,.4)}
.stageStrip .stg.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px rgba(232,178,90,.4)}
.stageStrip .stg.done{color:rgba(255,255,255,.4);text-decoration:line-through}
.stageStrip .sep{color:var(--dim);font-size:11px}
/* 天意加身勾选框（角色选择屏） */
.srsChk{display:flex;align-items:flex-start;gap:7px;margin:12px 0 2px;font-size:12px;
  line-height:1.6;cursor:pointer;user-select:none}
.srsChk input{accent-color:var(--gold);margin:2px 0 0}
.log .logLn{margin:1px 0}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .sideL{order:2}.stagebox{order:1}.sideR{order:3}
}
</style>
</head>
<body>
<div id="sceneBg"></div>
<div id="app">
  <header>
    <h1><b>杀戮尖塔</b>小球</h1>
    <span id="devSlot"></span>
  </header>

  <div class="toolbar">
    <button class="btn pri" id="btnStart">开始战斗</button>
    <button class="btn" id="btnPause" disabled>暂停</button>
    <button class="btn" id="btnReset">重置</button>
    <span class="seg" id="segSpeed">
      <button data-s="1" class="on">1×</button>
      <button data-s="2">2×</button>
      <button data-s="3">4×</button>
    </span>
    <button class="btn" id="btnSound">声音: 开</button>
    <span class="seedwrap">
      <button class="btn" id="btnSeed">种子</button>
      <!-- 「种子」的子界面：输入种子 + 种子显示开关（逻辑见「10.2 种子」） -->
      <div class="seedpop" id="seedPop">
        <div class="row">
          <label for="seedIn">随机种子</label>
          <input type="text" id="seedIn" placeholder="留空 = 每局随机" autocomplete="off" spellcheck="false">
        </div>
        <div class="row">
          <button class="btn" id="seedRnd" type="button">随机一个</button>
          <button class="btn pri" id="seedPlay" type="button">用该种子开战</button>
        </div>
        <label class="chk"><input type="checkbox" id="seedShow"> 显示种子（网页右下角）</label>
        <div class="note">同一对卡牌 + 同一个种子 → 逐帧完全相同的对局；留空则每局现掷。</div>
      </div>
    </span>
    <!-- 系列赛入口：正式版暂时不开放 —— build.py 会把下面两行标记之间的内容整块删掉，
         开发者版保留。要恢复：删掉 build.py 里的 SERIES_BTN_RE 替换那段即可。 -->
    <!--SERIES_BTN_START-->
    <button class="btn" id="btnSeries">系列赛</button>
    <!--SERIES_BTN_END-->
    <button class="btn" id="btnSettings">设置</button>
    <span class="hint">空格 开始/暂停 · R 重置 · S 录制模式</span>
  </div>

  <div class="grid">
    <aside class="panel sideL" id="panelL"></aside>
    <section class="stagebox"><canvas id="cv"></canvas>
      <!-- 系列赛比分条（战斗阶段显示；.stagebox 是它的定位锚） -->
      <div id="seriesBar"></div>
    </section>
    <aside class="panel sideR" id="panelR"></aside>
  </div>
</div>

<!-- 右下角种子角标（「种子」子界面里的开关打开时才显示；录制模式时隐藏） -->
<div id="seedTag"></div>

<!-- 设置弹窗（内容由 setBuild() 填，见「10.1 设置」） -->
<div id="setMask"><div id="setBox"></div></div>

<!-- 系列赛全屏覆盖层（内容由 seriesRender() 按阶段填，见「10.4 系列赛」；
     与 #setMask 不同：点遮罩空白处【不】关闭 —— 中途误触会丢掉整场进度） -->
<div id="seriesMask"><div id="seriesBox"></div></div>

<script>
/* ============================================================
   0. 资源（由构建脚本注入：图片 dataURI + 音频 base64）
   ============================================================ */
/* SERIES_LOGIC_STUB —— 构建期占位标记（正式版专用）：
   BUILD=main 时 build.py 会把「10.4 系列赛」整段代码删掉（见 SERIES_LOGIC_START/END、
   SERIES_HOOK_START/END、SERIES_BGM_START/END 三对标记），并把这个标记替换成
   一行 `var SERIES = { on: false };` —— 引擎里散布的 if (SERIES.on) 检查于是全部短路。
   开发者版什么都不做，本标记只是一句注释，SERIES 由「10.4 系列赛」正常定义。 */
const ASSET_MAP = __ASSET_MAP__;

/* 系列赛 AI 的「公认常识」：231 个无序卡对 × 500 场的胜场数据
   （tools/bake_winrate.js 烘焙 → build.py 把 __WR_DATA__ 注入成 JSON 常量）。
   玩家不可见：不渲染、不进任何 UI 文案，只有 AI 决策读它。
   占位符没被替换时（无头探针直跑 src/game.html）这里必须是合法 JS：
   用 typeof 探测 —— 未定义就置 null，AI 退化成"不看数据"，探针照常能跑。 */
const WR_DATA = (typeof __WR_DATA__ !== 'undefined') ? __WR_DATA__ : null;

/* ============================================================
   1. 全局配置
   ============================================================ */
const CFG = {
  AW: 660, AH: 660,          // 正方形竞技场
  CARD_W: 106, CARD_H: 150,  // 卡牌视觉尺寸（长方形）
  R: 54,                     // 碰撞箱：球形半径
  SPEED: 150,                // 定速直线速度 px/s
  MAX_TIME: 240,             // 超时平局
  DT_MAX: 1 / 30,
  CROSS: 62,                 // 十字血条尺寸
  HP_FONT: 13
};

/* 灾厄读条时长（秒）—— 用户 2026 口径：灾厄值【大于等于生命值】时不再当场斩杀，
   先读条 DOOM_CHANNEL 秒，读满才处决。这一条是全局规则（谁被叠灾厄都一样），
   所以放在 CFG 外单独给常量，不塞进某张卡的 p（末日降临只是叠灾厄的其中一张）。
   读条期间【血条撤掉】，改画一圈更大的灾厄读条环 + 中间的灾厄图标（见 drawDoomChannel）。 */
const DOOM_CHANNEL = 3.0;

/* 亡灵契约师的死亡延迟（秒）—— 系列赛角色规则：己方本体第一次挨到致死一击时
   不当场死，挂起这条倒计时照常行动；走完才按原路径（普通/灾厄）进入死亡动画。
   和灾厄读条一样属于"全局规则常量"，不塞进某张卡的 p。 */
const NECRO_DELAY = 7.0;

/* ============================================================
   2. 卡牌数据：加卡 = 加一项 + 写一个机制类
   ============================================================ */
const CARDS = [
  {
    id: 'dark_embrace', name: '黑暗之拥', en: 'DARK EMBRACE',
    hp: 1000, speed: 150,
    desc: ['在场地边缘生成恶魔之手拖拽敌人。'],
    mech: 'dark_embrace',
    /* 伤害随"手伸出多远"线性提高：抓到时手伸得越远，砸墙那一下越重。
       dmgMin = 贴着墙抓到（几乎没伸出去）、dmgMax = 伸到对面墙才抓到。 */
    p: { wallCd: 0.45, handSpeed: 1750, retractSpeed: 2500, palmR: 50,
         dmgMin: 130, dmgMax: 270 }
  },
  {
    id: 'knife_trap', name: '刀刃陷阱', en: 'KNIFE TRAP',
    hp: 1000, speed: 158,
    desc: ['相撞时引导所有未命中的匕首攻击敌人。'],
    mech: 'knife_trap',
    /* guideMul：被"相撞"引导回来的刀伤害倍率（18 × 1.5 = 27）。
       guideSpdMul：引导刀的飞行速度倍率（原来是写死的 1.5，现在抽成参数并调快到 2.0）。
       每次发射是【一对】：朝敌人一枚 + 朝正反方向一枚（见 MechKnifeTrap.fire）。
       maxKnives：场上同时存在的刀上限（超过就回收最早的）。
       first/interval：首发延迟 / 之后每隔多久一对（2.0 → 1.85，每 1.85 秒一轮）。
       nudge/nudgeCap：命中的推力 —— 只加一点速度，【方向一点不动】
       （走 Unit.nudge，不是 knock）。刀又密、引导齐射还会在 0.3s 内连中好几刀，
       所以 cap 压住（40 ≈ 基础速度的 26%），只做"背后有人推了一把"的手感。 */
    p: { first: 1.85, interval: 1.85, dmg: 18, spd: 660, recoverDelay: 0.3,
         guideMul: 1.5, guideSpdMul: 2.0, nudge: 16, nudgeCap: 40, maxKnives: 80 }
  },
  {
    id: 'beat_into_shape', name: '锻打成型', en: 'BEAT INTO SHAPE',
    hp: 1000, speed: 146,
    desc: ['每次反弹时铸造君王之剑以提升伤害。'],
    mech: 'forge',
    /* swingRange：近战索敌半径（按两球中心距；命中判定另加 R*0.7 的余量）
       swingCd：挥砍内置冷却（起刀时刻开始计时，所以两次起刀的间隔 = 它）
       bonusPerBounce：每"反弹一次"给君王之剑加的伤害。
       加伤来源只有两个：撞墙、撞【本体】。**撞仆从不算**（仆从是消耗品召唤物，
       撞它不该算在铁砧上捶过一锤）—— 见 MechForge.onBounce 的 other.minion 判断。 */
    p: { forgeDelay: 2.4, baseDmg: 30, bonusPerBounce: 15, orbitR: 96,
         swingRange: 150, swingCd: 2.0, swingTime: 0.34, knock: 250,
         hitForgeCd: 0.30 }
  },
  {
    id: 'end_of_days', name: '末日降临', en: 'END OF DAYS',
    hp: 1000, speed: 152,
    desc: ['召唤陨石随机攻击，留下陨石坑施加灾厄。'],
    mech: 'doom',
    /* knock/knockCap = 380：knock() 内部把 cap 硬夹在 380，这已经是系统允许的最强击退
       （再往上会被 curSpeed 的 560 速度上限吃掉）。 */
    /* dmg 230 → 220（2026 削弱：用户要求"陨石直接命中伤害降低 10 点"）。
       只动【直击】这一项：灾厄圈的 doomRate 66、圈半径、间隔都不受影响。
       ⚠ 直击还有一个专属规则：一发把对手砸进灾厄斩杀线（灾厄 ≥ 生命）时，
         跳过 3 秒读条当场处决（见 impact() 里的 e.doomBlast()）——
         这是"陨石把人砸死"的终结感，别的伤害来源都老老实实走读条。 */
    p: { first: 2.0, interval: 2.6, warn: 0.85, fallSpd: 620, dmg: 220,
         knock: 380, knockCap: 380,
         /* hitR：陨石"直击"伤害判定半径（原来写死成 zoneR*0.9 + R*0.4 ≈ 117，
            现在直接给绝对值 130，免得改坑的半径时把直击范围带着一起动）。
            doomR：灾厄圈的【叠灾厄判定】半径（原来写死成 zoneR + R*0.5 = 133，
            现在抽成显式 125 —— 判定比画出来的圈略大一点，是刻意的宽容）。
            doomRate：灾厄圈每秒叠的灾厄值（42 → 50.4 → 66）
            zoneR：灾厄圈画出来的半径 —— 92 → 106（≈ +15%） */
         hitR: 130, doomR: 125, zoneR: 106, zoneDur: 4.6, doomRate: 66 }
  },
  {
    id: 'voltaic', name: '电流相生', en: 'VOLTAIC',
    hp: 1000, speed: 150,
    desc: ['召唤并发射数量翻倍的闪电球充能球。'],
    mech: 'voltaic',
    /* gapMin/gapMax：从"召唤出电球"到"发射出去"的【总】间隔，
       每次随机 3.6~4.8s（其中最后 chargeDelay 秒是停摆蓄力，见 MechVoltaic.summon）。 */
    p: { first: 1.2, gapMin: 3.6, gapMax: 4.8, orbitR: 92, orbR: 17,
         /* 环绕灼烧：每秒 dpsTick 次、每次 orbitDmg 点
            （30×1 → 20×3 → 10×1 → 【现在】10×3，总 dps 30 → 60 → 10 → 30） */
         dpsTick: 10, orbitDmg: 3,
         shotDmg: 8, shotGap: 0.07, maxOrbs: 64,   // maxOrbs：数量翻倍的上限（1→2→4→…→64）
         /* 出膛后一路直线，不再追踪（原来会随目标位置逐帧修正航向） */
         /* 击退：经历 10/60 → 30/180 → 45/270 两轮加强后，
            受控 A/B 实测「推力越大胜率越低」（被推开的对手脱离直线弹道、命中数下降），
            故【回退到最原始值】10/60。想再加强请改这里，但先看 _knock_ab 的结论。 */
         shotKnock: 10,      // 单发击退量（一轮齐射几十发，靠下面的 cap 兜住总量）
         shotKnockCap: 60,   // 电球击退最多把目标加速叠到多少（不封顶会被顶到速度上限）
         // 发射速度曲线：出膛一记冲刺 -> 平滑回落到巡航速度
         shotSpd: 760,      // 巡航速度（末端）
         shotBoost: 680,    // 出膛瞬时加速量（峰值 ≈ 760+680×0.6 ≈ 1168）
         shotRise: 0.09,    // 冲到峰值的时间常数（秒）
         shotFall: 0.30,    // 回落到巡航的时间常数（秒）
         chargeDelay: 0.6,  // 停摆（停止环绕）到齐射之间的蓄力间隔
         freezeExtra: 0.2 }
  },

  /* ---------------- 新 10 张（第二行 + 第三行）---------------- */
  {
    id: 'pillage', name: '劫掠', en: 'PILLAGE',
    hp: 1000, speed: 152,
    desc: ['蓄力撞击命中时立即释放下一击，前摇与伤害提高。'],
    mech: 'pillage',
    /* charge0：初始蓄力时长；每命中一次连段 +1，前摇 = charge0 + 连段数 × comboAdd；
       comboAdd：每次连击增加的蓄力时间；comboCd：连段之间插入的固定冷却；
       dmg 首击伤害，step 每命中一次叠加量；
       dashImpulse：突进瞬间一次性大加速冲量（此后快速自然衰减 → 变速运动）；
       dashT 突进最长持续时间（超时算扑空）；missCd 扑空后的冷却；
       spdCap：突进期间的单卡速度上限（默认 700 会把峰值砍掉，突进时放开到 900）。 */
    p: { first: 1.4, charge0: 0.25, comboAdd: 0.25, comboCd: 0.75, dmg: 50, step: 50,
         dashImpulse: 980, dashT: 1.9, spdCap: 900,
         missCd: 5.5, knock: 220, knockCap: 320 }
  },
  {
    id: 'expose', name: '暴露', en: 'EXPOSE',
    hp: 1000, speed: 150,
    desc: ['发射光束造成伤害和易伤，反射的光束效力减弱。'],
    mech: 'expose',
    /* ticks：每秒伤害判定次数；四段光束独立判定（无反弹/1/2/3 反弹）。
       每次命中 tick 还叠加 1 层易伤（5 次/秒）。第 3 次反弹段伤害 dmgBounce3=4。
       lowDmg/lowCd：一次光束打出的【总伤害】（四段、对所有敌方单位的实际伤害合计）
                     低于 lowDmg 时，视为"这一炮基本打空"，本次冷却额外砍掉 lowCd 秒。
                     面板 14/14/10/6、5Hz 下，75 ≈ 只照到对手 4 个 tick（约 0.8 秒）。 */
    p: { first: 2.2, cdMin: 6, cdMax: 7, dur: 2.7, ticks: 5, lowDmg: 75, lowCd: 1.8,
         dmgNoBounce: 14, dmgBounce1: 14, dmgBounce2: 10, dmgBounce3: 6 }
  },
  {
    id: 'charge', name: '冲锋！！', en: 'CHARGE!!',
    hp: 1000, speed: 148,
    desc: ['消耗生命召唤仆从作战，自身血量越低仆从撞击越重。本体状态越差仆从越英勇。'],
    mech: 'charge',
    /* castT：召唤蓄力时长；hpCost：召唤消耗的生命；maxMinions：仆从上限；mHp/mR：仆从血量与碰撞半径。
       仆从撞人不掉血、贴身闲逛也不掉血 —— 只有被敌方机制/索敌命中才掉血。

       【仆从 AI：没有状态机，也不接管移动】（2026-09-23 用户要求"完全重构"）
       仆从就是一个普通单位 —— 以 CFG.SPEED 漂移、撞墙反弹、和别人按体积弹开，
       和场上任何一张卡的行为完全一致。它唯一多做的一件事：
         索敌范围（senseR）内看到敌人 → 朝它加一发【冲撞速度】(ramSpd)，之后就交给物理。
       这一发速度（以及撞上后的反弹速度 bounce）靠引擎统一的 boost 衰减自然耗完；
       两笔都耗完（boost < ramEnd）= "这一下冲撞结束了"，又变回普通单位。
       ramCd：两次冲撞之间的冷却（从"冲撞开始"计时）。沿革：2.4 → 【现在】2.1
              （2026-09-23 用户要求"冷却减少 0.3 秒"加强冲锋）。
       ramEnd：判定"冲撞速度已耗完"的 boost 阈值。
       mDmg：撞击伤害；ramSpd/ramSpdCap：冲撞冲量与其封顶；bounce/bounceCap：撞上后的反弹冲量。
       dmgBonus / cdCut：本体"已损失生命比例"的线性加成上限 —— 濒死时仆从撞击伤害 +100%、
              冲撞冷却 -0.6s（2026-09-23 用户要求"自身血量降低最多令仆从增加100%伤害"，
              此前 dmgBonus 是 0.6 = +60%；2026-09-27 用户要求冷却最多缩短 0.6 秒）。
              ⚠ 这两项都必须经 AI 的 curDmg()/curCd() 读取才生效：curCd() 一度只定义
              未被调用（冷却恒为 ramCd），2026-09-27 接回 MinionBrain.update。
       数值沿革：mHp 100 → 300、mDmg 50 → 40（2026-09-23 用户要求"仆从生命值改成 300，

/* ============================================================
   3. 工具
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- 随机数：两条互不干扰的流 ----------
   sim：一切会改变对战走向的随机（初速方向、各机制的间隔/相位、卡位）。
        【种子只控制这一条流】——同一张卡 + 同一个种子 → 逐帧完全相同的对局，
        所以"种子重现"和"批量预演"才成立。
   vis：纯观感随机（粒子、飘字抖动、音高微扰、屏幕抖动）。
        渲染帧率、特效数量都不该影响输赢，所以它单独一条流；
        它每步的消耗只取决于世界状态，所以每局开头跟着复位一次即可。 */
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* 种子 → 32 位无符号数：数字（含纯数字串）直接取整，其余文本走 32 位 FNV 散列。
   【纯数字串必须按数字处理】预演表格里记的种子是散列后的 32 位数字，用户把它
   抄回种子框 / 开发者面板时拿到的是字符串。以前字符串一律走 FNV：同一个
   "123456789" 当数字与当字符串散列出两个不同种子 —— 于是"点记录行重现"
   （传数字）与"把这条种子抄进种子框播放"（传字符串）跑出完全不同的两局。 */
function seedHash(v) {
  if (typeof v === 'number' && isFinite(v)) return (Math.floor(v) >>> 0) || 1;
  const s = String(v === undefined || v === null ? '' : v);
  if (/^-?\d+$/.test(s.trim())) return (Math.floor(+s) >>> 0) || 1;
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) || 1;
}
const RNG = { sim: mulberry32(1), vis: mulberry32(0x9E3779B9), seed: 1 };
/* 重置【对战随机流】：一次对局的全部随机都由它决定。 */
function setSimSeed(v) { RNG.seed = seedHash(v); RNG.sim = mulberry32(RNG.seed); return RNG.seed; }
/* 观感流也跟着一起复位（另起一条互不相关的种子）：
   它虽然不影响输赢，但粒子数、飘字抖动都在取它 —— 不复位的话，
   "同一局跑两遍"连画面都对不上（第一遍残留的粒子相位会把第二遍带偏）。
   观感流每步的消耗只取决于世界状态，所以复位之后同种子＝逐帧逐粒子都一样。 */
function resetVisualRng(seed) { RNG.vis = mulberry32((seed ^ 0x5BF03635) >>> 0); }
/* 随机种子：默认每局都换一个新的（真人玩时每局都不一样） */
function makeSeed() { return (Math.random() * 4294967296) >>> 0; }
/* 取一个 [0,1) 对战随机数。site 只用于调试（RNG.log 里标出是谁取的），不影响数值。 */
function srand(site) { const r = RNG.sim(); if (RNG.log) RNG.log(0, site, r); return r; }
function vrand(a, b, site) { const r = RNG.vis(); if (RNG.log) RNG.log(1, site, r); return a === undefined ? r : a + r * (b - a); }
function vr(site) { const r = RNG.vis(); if (RNG.log) RNG.log(1, site, r); return r; }
const vchance = (p, site) => vr(site) < p;
const rand = (a, b, site) => { const r = srand(site); return a === undefined ? r : a + r * (b - a); };
/* 把角度差折到 [-π, π]：两个角度之间"最近的那个转向"。
   凡是要从 A 角转到 B 角的地方都必须过这一道，否则会绕远路转一整圈。 */
const wrapPi = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;

function rrPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function addRRC(p, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  p.moveTo(x + r, y);
  p.lineTo(x + w - r, y); p.arcTo(x + w, y, x + w, y + r, r);
  p.lineTo(x + w, y + h - r); p.arcTo(x + w, y + h, x + w - r, y + h, r);
  p.lineTo(x + r, y + h); p.arcTo(x, y + h, x, y + h - r, r);
  p.lineTo(x, y + r); p.arcTo(x, y, x + r, y, r);
  p.closePath();
}
/* 十字（+）形状路径：单一非自交轮廓（12 个顶点 + 圆角）。
   早先用"两个矩形叠在一起"拼路径，fill 得到并集没问题，但 stroke 会把两个矩形
   各自的轮廓都描出来 —— 中心就会出现横矩形的上下边、竖矩形的左右边，看着像
   "矩形的交叉线"。改成一条连通的闭合轮廓后，描边只走外缘，中心是干净的一块。 */
function crossPath(size, t, rad) {
  const s = size / 2, h = t / 2;
  const r = Math.max(0, Math.min(rad == null ? 3 : rad, (s - h) / 2 - 0.01));
  const V = [
    [h, -h], [s, -h], [s, h], [h, h],
    [h, s], [-h, s], [-h, h], [-s, h],
    [-s, -h], [-h, -h], [-h, -s], [h, -s]
  ];
  const N = V.length, p = new Path2D();
  p.moveTo((V[0][0] + V[1][0]) / 2, (V[0][1] + V[1][1]) / 2);
  for (let i = 1; i <= N; i++) {
    const c = V[i % N], n = V[(i + 1) % N];
    p.arcTo(c[0], c[1], n[0], n[1], r);
  }
  p.closePath();
  return p;
}

/* ============================================================
   4. 资源加载
   ============================================================ */
const IMG = {}, GREY = {}, WHITE = {}, SND = {};
let sndReady = false;

function tinted(img, filter) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || 1; c.height = img.naturalHeight || 1;
  const g = c.getContext('2d');
  try { g.filter = filter; } catch (e) { }
  g.drawImage(img, 0, 0);
  return c;
}
function loadAll(done) {
  const names = Object.keys(ASSET_MAP.img);
  let left = names.length;
  if (!left) { done(); return; }
  names.forEach(n => {
    const im = new Image();
    const fin = () => { if (--left === 0) done(); };
    im.onload = () => {
      IMG[n] = im;
      if (n.indexOf('card_') === 0) {
        GREY[n] = tinted(im, 'grayscale(1) brightness(1.1)');
        WHITE[n] = tinted(im, 'brightness(0) invert(1)');
      }
      fin();
    };
    im.onerror = fin;
    im.src = ASSET_MAP.img[n];
  });
}

/* soundOn = 用户手动开关（工具栏那个"声音: 开/关"，它同时管音效和背景音乐）。
   sfxMute = 【预演静音】批量预演是"后台跑数据"、一帧都不画，音效只会变成一片噪声。
   两者分开存：预演结束后用户自己的音效选择不受影响。
   开关挂在 makeHeadless() / endHeadless() 这一对唯一的进出口上（见下方"无渲染对战"）。 */
let AC = null, masterGain = null, soundOn = true, sfxMute = false;
const lastPlay = {};
function b64buf(b64) {
  const bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for (let i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
function loadSound() {
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.8; masterGain.connect(AC.destination);
    Object.keys(ASSET_MAP.snd).forEach(k => {
      try {
        AC.decodeAudioData(b64buf(ASSET_MAP.snd[k]),
          b => { SND[k] = b; sndReady = true; }, () => { });
      } catch (e) { }
    });
  } catch (e) { sndReady = false; }
}
function sfx(name, vol, rate, minGap) {
  if (sfxMute || !soundOn || !sndReady || !SND[name] || !AC) return;
  vol = vol === undefined ? 1 : vol;
  rate = rate === undefined ? 1 : rate;
  minGap = minGap === undefined ? 0.045 : minGap;
  const now = AC.currentTime;
  if (lastPlay[name] !== undefined && now - lastPlay[name] < minGap) return;
  lastPlay[name] = now;
  try {
    const s = AC.createBufferSource(); s.buffer = SND[name]; s.playbackRate.value = rate;
    const g = AC.createGain(); g.gain.value = vol;
    s.connect(g); g.connect(masterGain); s.start();
  } catch (e) { }
}
function resumeAudio() { if (AC && AC.state === 'suspended') AC.resume(); }

/* ============================================================
   5. 世界 / 单位
   ============================================================ */
const world = {
  units: [], effects: [], nums: [], t: 0, running: false, over: null, shake: 0, speedMul: 1,
  /* seed = 本局随机种子（决定全部对战随机）；决定论对局的唯一开关。
     autoStop = 打完自动停下（开发者模式"重现"时用，省得手动暂停）。
     stats = 两方指标，见 newStats()；onDamage 由 stepPhysics 每步装上。 */
  seed: 0, autoStop: false, stats: null, onDamage: null,
  /* 索敌：本队（本体+自己的仆从）之外、最近的存活目标。
     仆从（冲锋召唤）因此和正常单位一样能被索敌、被攻击；
     仆从自己索敌时同样按最近优先（通常是对面本体卡）。
     ⚠ 【灵魂风暴的灵魂】明确不可被索敌（用户口径）：灵魂是飘着的一次性衍生物，
     对手的刀/剑/陨石/雷都不该把它当"目标"来挑。
     但注意 enemiesOf() 里【仍然包含灵魂】—— "被攻击波及"要能打到它（打到就消散）。 */
  enemyOf(u) {
    let best = null, bd = Infinity;
    for (const o of this.units) {
      if (o === u || !o.alive || o.finished || o.team === u.team || o.soul) continue;
      const d = Math.hypot(o.x - u.x, o.y - u.y);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  },
  /* 全部敌方存活单位（本体 + 仆从 + 灵魂）。命中判定要"范围内的每个敌人"都吃时用它，
     不要只查 enemyOf() —— 那样召唤出仆从后，离得远的那一个会被穿透/漏判。
     ⚠ 灵魂【在里面】：它不可被索敌（enemyOf 跳过），但"被攻击波及"要能打到它 ——
       打到就直接消散（SoulUnit.damage 覆盖，用户 2026 口径）。 */
  enemiesOf(u) {
    return this.units.filter(o => o !== u && o.alive && !o.finished && o.team !== u.team && !o.dying);
  },
  /* 敌方【本体】（非仆从、非余像分身）。
     余像的反伤要"锁定敌方本体"，不能被"是谁打的我"带偏（用户 2026 口径）。
     找不到（理论上不会）就退回最近的敌人。 */
  bodyOf(u) {
    for (const o of this.units) {
      if (o === u || o.team === u.team || o.minion || o.replica) continue;
      if (!o.alive || o.finished || o.dying) continue;
      return o;
    }
    return this.enemyOf(u);
  },
  /* ---------- 对局记录（开发者模式的"精彩对局"筛选靠它） ---------- */
  newStats() {
    return {
      dt: 0, dpsT: 0,
      /* 爆发分两种口径：
         dmgWin = 3 秒滑窗内的累计伤害（"短时间爆发"）
         dmgHit = 单次命中的最大伤害（"单次爆发"，一次砸下去多疼）
         两个峰值都单独记时刻，方便在结果表里标出"什么时候打的"。 */
      dmgWin: 0, burst: 0, burstAt: 0,
      dmgHit: 0, hit: 0, hitAt: 0,
      lowHp: 0, lowAt: 0, comeback: false, lastDmgAt: -1,
      /* behindMax = 【本局被对手拉开过的最大血量差】（按比例，0~1）。
         每步在两方都活着时比较，记下自己落后对手最多的那一次 ——
         赢了以后它就是"逆转血量差"的幅度（预演筛选的排序指标之一）。 */
      behindMax: 0
    };
  },
  /* 每个固定步长调一次：维护 3 秒滑窗，峰值分别落到 burst（窗） */
  burstTick(dt) {
    for (const s of this.stats) {
      s.dt += dt;
      s.dpsT += dt;
      if (s.dpsT >= 0.25) {
        s.dpsT %= 0.25;
        if (s.dmgWin > s.burst) { s.burst = s.dmgWin; s.burstAt = s.dt; }
      }
      s.dmgWin *= Math.exp(-dt / 3);
    }
  },
  /* 真实扣血回调（记在【造成伤害的那一方】头上；毒/灾厄这类无来源伤害不计入爆发）。
     每场对局开始时由 stepPhysics 装上。 */
  onDamageHook(v, src) {
    if (!src || !src.stat || src.minion) return;
    src.stat.dealt += v;
    const w = this.units;
    for (let i = 0; i < 2; i++) {
      const u = w[i];
      if (u !== src || !this.stats[i]) continue;
      const s = this.stats[i];
      s.dmgWin += v; s.lastDmgAt = s.dt;
      if (v > s.dmgHit) { s.dmgHit = v; s.hit = v; s.hitAt = s.dt; }   // 单次爆发
      const h = u.hp / u.maxHp;
      if (h < s.lowHp) { s.lowHp = h; s.lowAt = s.dt; }
      if (h < 0.35) s.comeback = true;      // 曾被压到 35% 以下 → 之后赢了才算反杀
      return;
    }
  }
};

class Unit {
  constructor(card, team) {
    this.card = card; this.team = team;
    this.maxHp = card.hp; this.hp = card.hp;
    this.baseSpeed = card.speed;
    /* 开局站位：左右关于场地中线对称（x 各占 1/4、3/4），高度都压在正中线上。
       以前 y 是 ±70 随机，两边一高一低，开局画面看着不对称。 */
    this.x = team === 0 ? CFG.AW * 0.25 : CFG.AW * 0.75;
    this.y = CFG.AH * 0.5;
    const a = rand(0, TAU);
    this.dx = Math.cos(a); this.dy = Math.sin(a);
    this.alive = true; this.finished = false;
    this.flash = 0; this.bouncePop = 0; this.freeze = 0; this.boost = 0;
    this.doom = 0; this.dying = null;
    /* doomT = 灾厄读条进度（秒）。灾厄值 ≥ 生命值 时开始累加，读满 DOOM_CHANNEL(3s)
       就处决；中途血量回到灾厄之上（回血）就清零 —— 读条期间一切照常，只是头顶
       的血条换成读条环（见 drawDoomChannel / doomChanneling）。 */
    this.doomT = 0;
    /* dieT = 【挨到致命一击的那一刻】（world.t）。⚠ 不是 world.over.t：
       over 要等 0.9s（灾厄 1.7s）的阵亡动画播完、endCheck 才置上，
       比真正的致死时刻晚了将近一秒 —— 开发者模式的「空悲切」分析必须用这个。 */
    this.dieT = null;
    /* 新状态（层数在「每秒减 1 层」的语义下当作剩余秒数用）：
       vuln 易伤：受到的伤害 +50%（向下取整）   weak 虚弱：造成的伤害 -25%（向下取整）
       poison 毒素：每 2 秒扣一次 = 当前毒素值的血，然后毒素 -50（见 stepPhysics 状态块）
       focus 集中：引雷针专属，每层伤害 +10、雷击间隔上下限各 -0.1s（不衰减）
       slamT 摔击窗口：违逆的冲击波把人拍出去后短暂生效，窗口内撞墙按速度吃额外伤害 */
    this.vuln = 0; this.weak = 0; this.poison = 0; this.focus = 0; this.slamT = 0;
    this.vulnT = 0; this.weakT = 0; this.poisonT = 0;
    /* invulT = 无敌帧倒计时（>0 时免疫一切 damage() 伤害）。
       这是引擎级的通用能力，目前【没有任何卡牌在用】——
       冲锋的仆从原来在"被本体指派的冲撞"期间靠它免伤，2026-09-23 重构时连同
       那条机制一起删掉了。保留此字段供后续卡牌使用（用时记得自己续期）。 */
    this.invulT = 0;
    /* guard = 【空悲切】护体（只在开发者模式的预演分析里打开，见 8.2）：
       免疫一切致死来源 —— damage()、失去生命(loseHp)、毒素、环绕灼烧、灾厄斩杀。
       和 invulT 分开存：invulT 是"有时长的无敌帧"（每步被倒计时减掉），
       guard 是个开关，由 GRACE 分析器在窗口内自己开关。 */
    this.guard = false;
    /* slowT = 减速倒计时（>0 时移速 ×0.7，即减速 30%）。
       目前由暴露的光束使用：被照射期间持续刷新，离开光束 0.3 秒后恢复。 */
    this.slowT = 0;
    /* grabbed = 正被几只恶魔之手抓住（>0 就是"被拎着"）。
       被抓期间：不参与任何碰撞（墙/对手都穿过去），也不能发起攻击或触发机制
       —— 否则被拖着走的过程中还会一路反弹起锤、挥剑、扔刀，观感和数值都乱。
       用计数不用布尔：极端情况下可能同时被两只手抓住，一只松了不能立刻解禁。 */
    this.grabbed = 0;
    /* block = 格挡值（余像的分身碎裂时给本体 +50）。
       引擎级通用能力：damage() 里【先扣格挡、扣完才掉血】。
       与易伤/虚弱同一条通路（会被它们放大/缩小），但灾厄斩杀、毒素、扣血类
       （loseHp）都【无视格挡】—— 和原版一致：格挡只挡"伤害"，不挡"失去生命"。
       显示：十字血条多一圈浅蓝描边 + 血条上方一枚盾牌徽标（见 drawCrossHP /
       drawUnitHUD 的 'block' 状态徽标）。 */
    this.block = 0;
    /* 系列赛角色效果字段（第 10.4 节；经典单局恒为 falsy，零开销）：
       fxNecro/fxDefect/fxRegent = 该本体有没有对应角色的效果（resetMatch 后挂）；
       necroPend/necroT/necroDoomPath = 亡灵契约的死亡延迟状态；
       regentCd = 储君撞击叠 debuff 的触发间隔。 */
    this.fxNecro = false; this.fxDefect = false; this.fxRegent = false;
    this.necroPend = false; this.necroT = 0; this.necroDoomPath = false;
    this.regentCd = 0;
    /* stat = 本局统计（登场方才会被记；仆从/衍生物不参与对局指标） */
    this.stat = { dealt: 0, taken: 0, healed: 0, minHp: 1 };
    this.imgKey = 'card_' + card.id;
    this.mech = new MECHS[card.mech](this, card.p);
  }
  curSpeed() {
    if (this.freeze > 0 || this.dying) return 0;
    /* spdCap：单卡速度上限（默认 700）。目前只有劫掠突进期间临时放开 ——
       否则冲量加得再大也会被全局 700 砍掉，看不到"更快"。 */
    const cap = this.spdCap === undefined ? 700 : this.spdCap;
    const s = Math.min(cap, this.baseSpeed + this.boost);
    return this.slowT > 0 ? s * 0.7 : s;   // 被光束照射：减速 30%
  }
  /* damage(amount, kind, src)：
     src = 伤害来源单位（可选）。虚弱先对来源打折、易伤再对受击方加成，
     两步都向下取整；层数只代表状态剩余时长（每秒减 1 层），比例固定。
     【返回值】= 本次实际扣掉的血（含各种加成/减免后的最终值）；
     被无敌帧或"已经死了"挡掉时返回 undefined（调用方按 0 处理）。
     暴露的光束靠它累加"这一炮总共打了多少"。 */
  damage(amount, kind, src) {
    if (!this.alive || this.dying) return;
    if (this.guard) return;                         // 空悲切护体：免疫本次伤害
    if (this.invulT > 0) return;                    // 无敌帧：免疫本次伤害
    /* ⚠ 入口先把伤害取整（用户口径："不要出现非整数伤害机制"）。
       有的调用点会经过倍率（刀刃陷阱的引导刀 = dmg × guideMul(1.5)），
       一旦出现半整数，血量就会变成 37.5、屏幕上的伤害数字也跟着变成小数。
       这里统一 Math.round 到 ≥1，后面的虚弱/易伤/冲撞减伤照旧各自 floor。 */
    let v = Math.max(1, Math.round(amount));
    if (src && src.alive && src.weak > 0) v = Math.floor(v * 0.75);
    if (this.vuln > 0) v = Math.floor(v * 1.5);
    /* 冲撞减伤（全局规则）：所有卡牌在自己突进/猛扑期间受到的伤害 -75%。
       劫掠 = state 'dash'，蛇咬 = state 'pounce'；至少保留 1 点，
       避免电球这类 3 点小额连击在冲撞期间被整段抹成 0。 */
    const mst = this.mech && this.mech.state;
    if (mst === 'dash' || mst === 'pounce') v = Math.max(1, Math.floor(v * 0.25));
    /* 故障机器人（系列赛角色）：敌方本体血量不低于 75% 期间，己方本体受到的伤害 -75%。
       取整口径与冲撞减伤一致（floor、至少保 1 点），不用浮点比较
       （hp×4 ≥ maxHp×3 ⟺ hp/maxHp ≥ 75%）。灼烧/毒素走的是"直扣 hp"的旁路、
       不经过 damage()，天然不吃这条 —— 与"DoT 不吃乘区"的既有口径一致。 */
    if (this.fxDefect && SERIES.on) {
      const foe = world.units[1 - this.team];
      if (foe && foe.hp * 4 >= foe.maxHp * 3) v = Math.max(1, Math.floor(v * 0.25));
    }
    /* 格挡：先扣格挡、扣完才掉血（余像的分身碎裂给本体 +50）。
       返回的仍是"实际造成的伤害"，不受格挡影响（对局统计口径不变）。 */
    if (this.block > 0) {
      const used = Math.min(this.block, v);
      this.block -= used;
      v -= used;
      if (this.block <= 0) {
        this.block = 0;
        sfx('frost_orb_passive', 0.5, 1.5, 0.05);      // 原版破盾音效
        burst(this.x, this.y, 8, { c: '#9fd4ff', s0: 50, s1: 190 });
      }
      if (v <= 0) { this.flash = 0.10; return 0; }    // 全被格挡吃掉：不掉血、不弹伤害数字
    }
    this.hp = Math.max(0, this.hp - v);
    this.flash = 0.16;
    this.stat.taken += v;
    if (world.onDamage) world.onDamage(v, src);
    world.nums.push(new DmgNum(this.x + vrand(-14, 14, 'vrand'), this.y - 26, String(v), kind || 'hit'));
    if (this.hp <= 0) this.kill();
    /* ⚠ 这里【不再】当场 killByDoom：生命被削到灾厄值以下只是"开始读条"，
       真正的处决交给 stepPhysics 里的灾厄读条（读满 DOOM_CHANNEL 秒才斩，
       见那段注释）。当场斩会把 3 秒读条整个跳过去。 */
    else sfx(v >= 40 ? 'heavy_attack' : 'blunt_attack', 0.5, vrand(0.94, 1.08, 'vrand'), 0.02);
    return v;
  }
  /* 获得格挡（cap 只是防止无限叠加刷出天文数字）。 */
  addBlock(v) {
    if (!this.alive || this.dying || !(v > 0)) return;
    this.block = Math.min(9999, this.block + v);
    world.nums.push(new DmgNum(this.x + vrand(-14, 14, 'vrand'), this.y - 46, '格挡+' + v, 'block'));
    sfx('frost_orb_passive', 0.75, 1.15, 0.05);       // 原版获得格挡的音效
    world.effects.push(new Ring(this.x, this.y, 14, 62, 0.34, 'rgba(150,215,255,.85)', 3));
  }
  /* 【重置】格挡为指定值 —— 余像每次召唤分身时用（用户 2026 口径：
     "每次分身将格挡重置为 20，而不是叠加"）。
     和 addBlock 的区别：这里不看当前值、直接赋成 v（不叠加）；
     值变小时也照样赋（"重置"就该能压下去）。
     silent=true：只改数值、不弹"格挡 0"数字也不放音效 —— 余像分身消失时
     本体"立刻失去格挡"用它（掉格挡不需要像拿格挡那样报数，见 ReplicaUnit.disperse）。 */
  setBlock(v, silent) {
    if (!this.alive || this.dying) return;
    const nv = Math.max(0, Math.min(9999, v));
    if (nv === this.block) return;
    this.block = nv;
    if (silent) return;
    world.nums.push(new DmgNum(this.x + vrand(-14, 14, 'vrand'), this.y - 46, '格挡 ' + nv, 'block'));
    sfx('frost_orb_passive', 0.75, 1.15, 0.05);       // 原版获得格挡的音效
    world.effects.push(new Ring(this.x, this.y, 14, 62, 0.34, 'rgba(150,215,255,.85)', 3));
  }
  /* 直接失去生命（祭品的献祭这类自伤）：
     【不吃格挡、不吃易伤、不结算虚弱】，也不计入对局爆发统计 —— 与原版
     "HpLoss" 的口径一致（原版 Offering 的 ValueProp.Unblockable|Unpowered）。 */
  loseHp(v, silent) {
    if (!this.alive || this.dying || !(v > 0)) return;
    if (this.guard) return;                         // 空悲切护体：连"失去生命"也拦掉
    const real = Math.min(this.hp, v);
    this.hp = Math.max(0, this.hp - v);
    this.flash = Math.max(this.flash, 0.10);
    /* silent=true：连伤害数字都不弹（灵魂风暴的灵魂自动扣血用 —— 灵魂是一次性
       衍生物、每 0.5 秒掉 10 点，弹数字会糊满屏幕）。 */
    if (!silent) world.nums.push(new DmgNum(this.x + vrand(-14, 14, 'vrand'), this.y - 26, '-' + real, 'hurt'));
    if (this.hp <= 0) this.kill();
  }
  heal(v) {
    if (!this.alive || this.dying) return;
    const real = Math.min(this.maxHp - this.hp, v);
    if (real <= 0) return;
    this.hp += real;
    /* 【治疗打断灾厄读条】（用户 2026 口径）：治疗把生命值抬到灾厄值之上 →
       读条立刻清零，头顶 HUD 也随之从读条环换回十字血条（doomChanneling 现算现判）。
       这里和 stepPhysics 每步开头那句"doom < hp 就清零"是同一条规则，放两份是因为
       同一微步里可能"先治疗、后又挨打掉回灾厄线"—— 只靠每步开头那一次检查的话，
       那一微步会带着旧进度继续读；在这里当场清零，读条就真的"被打断重来"。 */
    if (this.doomT && this.hp > this.doom) this.doomT = 0;
    this.stat.healed += real;
    world.nums.push(new DmgNum(this.x + vrand(-14, 14, 'vrand'), this.y - 26, '+' + real, 'heal'));
  }
  addDoom(v) {
    if (!this.alive || this.dying || !(v > 0)) return;
    this.doom = Math.min(9999, this.doom + v);
    /* 叠到"追平生命值"只是【进入 3 秒读条】（见 stepPhysics 的灾厄读条段），
       不当场斩 —— 这是 2026 的口径改动，别在这里补 killByDoom。 */
  }
  /* 【直击即决】把"这一击是否直接把生命值打进了灾厄斩杀线"变成立即处决。
     用户 2026 口径：末日降临的【陨石直击】这样一刀砸进斩杀线时，跳过 3 秒读条、
     当场结算灾厄；否则读条期间对手可能回血跑掉，"陨石把人砸死"的终结感就没了。
     ⚠ 只有明确要"直击即决"的伤害来源才调这个（目前只有 meteorImpact）——
       其它伤害来源（暗黑球 / 刀刃 / 血肉轮盘…）仍然老老实实走读条。
     返回 true = 真的处决了（调用方据此跳过击退之类的后续处理）。 */
  doomBlast() {
    if (!this.alive || this.dying) return false;
    if (!(this.doom > 0 && this.doom >= this.hp)) return false;
    this.killByDoom();
    return !!this.dying;
  }
  kill() {
    if (this.guard) return;                         // 空悲切护体：兜住所有走 kill() 的致死路线
    /* 亡灵契约师（系列赛角色）：第一次致死不立刻死 —— 挂起 7 秒亡灵倒计时，
       期间照常行动，再挨多少次致命一击都无效；到点按原路径进入死亡动画。
       ⚠ dieT 在挂起的这一刻就写（致命一击确实落下了）—— endCheck 靠它比"谁先挨刀"，
         若等到倒计时走完才写，"对方先死完了而自己还在亡灵期"会被误判成自己赢。
       ⚠ 续死那一下由 seriesTickFx 先把 fxNecro 摘掉再调 kill()/killByDoom()，
         否则会在这里无限续期。 */
    if (this.fxNecro && SERIES.on) {
      if (!this.necroPend) {
        this.necroPend = true; this.necroDoomPath = false; this.necroT = NECRO_DELAY;
        this.dieT = world.t;
        markDecided(this);                          // 致命一击落下 → "剩余血量"拍快照
        world.nums.push(new DmgNum(this.x, this.y - 46, '死亡延迟 ' + NECRO_DELAY + ' 秒', 'info'));
        sfx('doom_apply', 0.8, 0.85);
        burst(this.x, this.y, 12, { c: '#b9a0ff', s0: 60, s1: 220 });
      }
      return;
    }
    if (!this.dying) {
      /* 亡灵契约的"续死"不重写 dieT：挂起那一刻才是真正的挨刀时刻，
         重写成到期时刻会让"双方都挨过刀、一方还在亡灵期"的先后关系错乱。 */
      if (this.dieT === null) this.dieT = world.t;
      markDecided(this);                            // 致命一击落下 → 给"剩余血量"拍快照
      this.dying = { t: 0, doom: false }; world.shake = 12;
      /* 【余像的收尾】本体一倒下，分身立刻失效 —— 放在这里而不是只靠
         MechAfterimage.update：stepPhysics 的机制循环写的是
         `if (u.alive && !u.dying) u.mech.update(dt)`，本体一进 dying 状态
         机制就不再被轮询，那条"本体阵亡 → 分身消散"的分支根本来不及跑，
         分身会带着 alive 留在场上继续被索敌、继续撑到本局结束。 */
      this.invalidateReplica();
    }
  }
  /* 「挂了分身」的单位（目前只有余像）在自己阵亡时调这个把分身收掉。
     ⚠ 实现在【机制】上（MechAfterimage.invalidateReplica），这里必须显式转发：
     如果基类只写个空实现 `invalidateReplica() { }`，它就会把机制上那个同名方法
     盖住 —— 单位自己的方法解析不会走到 mech 上（踩过一次：钩子挂上了，
     但基类空实现先命中，分身根本不散）。 */
  invalidateReplica() {
    const m = this.mech;
    if (m && typeof m.invalidateReplica === 'function') m.invalidateReplica();
  }
  killByDoom() {
    if (this.dying) return;
    /* 空悲切护体：灾厄也斩不动 —— 用户口径「灾厄也不能反杀」。
       （灾厄值照常累加，护体一摘、下一次判定就会照旧处决。） */
    if (this.guard) return;
    /* 亡灵契约师：灾厄处决同样延迟 7 秒，到期按灾厄路径死（见 kill() 里的注释）。 */
    if (this.fxNecro && SERIES.on) {
      if (!this.necroPend) {
        this.necroPend = true; this.necroDoomPath = true; this.necroT = NECRO_DELAY;
        this.dieT = world.t;
        markDecided(this);
        world.nums.push(new DmgNum(this.x, this.y - 46, '死亡延迟 ' + NECRO_DELAY + ' 秒', 'info'));
        sfx('doom_apply', 0.8, 0.85);
        burst(this.x, this.y, 12, { c: '#b9a0ff', s0: 60, s1: 220 });
      }
      return;
    }
    if (this.dieT === null) this.dieT = world.t;    // 亡灵契约续死不重写（同 kill() 的口径）
    markDecided(this);                              // 灾厄处决也是"分出胜负那一刻"
    this.dying = { t: 0, doom: true };
    this.doom = this.hp;
    world.shake = 10;
    sfx('doom_apply', 0.95, 0.9);
  }
  /* 加速的公共部分：只叠 boost（临时加速，随后自然衰减），不碰方向。
     cap 只封顶、不会压低已有的加速；380 是引擎允许的上限。 */
  pushBoost(accel, cap) {
    const top = (cap === undefined) ? 380 : Math.min(380, cap);
    this.boost = Math.max(this.boost, Math.min(this.boost + accel, top));
    this.bouncePop = 1.2;
  }
  /* 击退：临时加速，随后自然衰减（不会永久拉满速度）。
     cap = 本次击退最多把加速叠到多少（默认 380，即原有上限）。
     电球那种"单发伤害很小、但一轮会连着命中几十发"的击退必须给个小 cap，
     否则几十发叠起来会直接把对手顶到速度上限。cap 只封顶，不会压低已有的加速。 */
  knock(dirx, diry, accel, cap) {
    const L = Math.hypot(dirx, diry) || 1;
    this.dx = dirx / L; this.dy = diry / L;
    this.pushBoost(accel, cap);
  }
  /* 【象征性推一下】：只加一点点速度，方向原封不动。
     小刀这种高频命中不能用 knock() —— 它会顺手把 dx/dy 设成传入方向，
     等于"命中即转向"的硬控（推得再小也照样能把人掰到刀飞的方向上）。 */
  nudge(accel, cap) { this.pushBoost(accel, cap); }
}

/* ============================================================
   6. 通用效果
   ============================================================ */
class Effect { constructor() { this.dead = false; } update(dt) { } draw(ctx) { } }

class DmgNum extends Effect {
  constructor(x, y, text, kind) {
    super(); this.x = x; this.y = y; this.v = text; this.kind = kind; this.t = 0; this.life = 0.9;
  }
  update(dt) { this.t += dt; this.y -= 44 * dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const k = 1 - this.t / this.life;
    const isNum = /^\d+$/.test(this.v);
    const big = isNum && +this.v >= 40;
    ctx.save();
    ctx.globalAlpha = clamp(k * 1.8, 0, 1);
    ctx.font = '700 ' + (this.kind === 'info' ? 15 : big ? 21 : 16) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let c = '#ffe9c9';
    if (this.kind === 'doom') c = '#c07ff0';
    else if (this.kind === 'light') c = '#8fe4ff';
    else if (this.kind === 'info') c = '#ffd08a';
    else if (this.kind === 'heal') c = '#8fe89a';
    else if (this.kind === 'poison') c = '#a8e05f';
    else if (this.kind === 'gold') c = '#ffd700';
    else if (this.kind === 'block') c = '#9fd4ff';
    else if (this.kind === 'hurt') c = '#ff8f8f';
    else if (this.kind === 'soul') c = '#8ff0dd';
    else if (big) c = '#ffd36a';
    ctx.lineWidth = 3.4; ctx.strokeStyle = 'rgba(12,8,20,.9)';
    ctx.strokeText(this.v, this.x, this.y);
    ctx.fillStyle = c; ctx.fillText(this.v, this.x, this.y);
    ctx.restore();
  }
}

class Spark extends Effect {
  /* 纯观感：粒子去向/寿命/大小一律走 vis 流，不占对战随机的额度 */
  constructor(x, y, o) {
    super(); o = o || {};
    this.x = x; this.y = y;
    const a = vrand(0, TAU, 'vrand'), s = vrand(o.s0 || 60, o.s1 || 240, 'vrand');
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
    this.t = 0; this.life = vrand(0.22, 0.5, 'vrand'); this.r = vrand(1.6, 3.6, 'vrand'); this.c = o.c || '#ffd9a0';
  }
  update(dt) {
    this.t += dt; this.x += this.vx * dt; this.y += this.vy * dt;
    this.vx *= 0.94; this.vy *= 0.94;
    if (this.t > this.life) this.dead = true;
  }
  draw(ctx) {
    const k = 1 - this.t / this.life;
    ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = this.c;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * k, 0, TAU); ctx.fill(); ctx.restore();
  }
}
function burst(x, y, n, o) { for (let i = 0; i < n; i++) world.effects.push(new Spark(x, y, o || {})); }

class Ring extends Effect {
  constructor(x, y, r0, r1, life, color, w) {
    super(); this.x = x; this.y = y; this.r0 = r0; this.r1 = r1;
    this.t = 0; this.life = life; this.c = color; this.w = w || 3;
  }
  update(dt) { this.t += dt; if (this.t > this.life) this.dead = true; }
  draw(ctx) {
    const k = this.t / this.life, r = lerp(this.r0, this.r1, k);
    ctx.save(); ctx.globalAlpha = (1 - k) * 0.9;
    ctx.strokeStyle = this.c; ctx.lineWidth = this.w * (1 - k * 0.6);
    ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, TAU); ctx.stroke(); ctx.restore();
  }
}

/* ============================================================
   7. 五种专属机制
   ============================================================ */
const MECHS = {};

/* ---------- 7.1 黑暗之拥 ---------- */
class DemonHand extends Effect {
  constructor(unit, sx, sy, nx, ny, maxLen, p) {
    super();
    this.u = unit; this.nx = nx; this.ny = ny; this.p = p;
    this.sx = sx; this.sy = sy; this.maxLen = maxLen;
    this.len = 0; this.state = 'out'; this.grab = null; this.t = 0; this.manual = true;
    this.age = 0; this.backLen0 = 1; this.pAcc = 0;
    /* reach = 抓到手那一刻"手伸出去多远"的比例（0=贴着墙抓到，1=伸满整个场地才抓到），
       结算伤害时按它把 dmgMin~dmgMax 插值。抓不到就一直保持 0。 */
    this.reach = 0;
    /* 原版 NSpookyHandVfx 的随机手感，按洞口坐标播种 → 同一次挥手内恒定：
       抖动速度 3~5、幅度 0.10~0.30 rad，中途还会卡顿几拍（幅度减半） */
    const a1 = Math.abs(Math.sin(sx * 0.0173 + sy * 0.0291));
    const a2 = Math.abs(Math.sin(sx * 0.0411 + sy * 0.0077));
    this.jSpeed = 3 + a1 * 2;
    this.jAmp = 0.10 + a2 * 0.20;
    this.jT = 0;
    this.stutFrom = 0.5 + a2 * 0.7;
    this.stutTo = this.stutFrom + 0.05 * (2 + Math.floor(a1 * 5));
  }
  get tipX() { return this.sx + this.nx * this.len; }
  get tipY() { return this.sy + this.ny * this.len; }
  /* 松手：把"被抓计数"减回去。必须在【每一条】判死的路线上都调一次，
     否则对手会永久卡在"无碰撞、不能攻击"的状态里。 */
  release() {
    if (this.grab) {
      this.grab.grabbed = Math.max(0, this.grab.grabbed - 1);
      this.grab = null;
    }
  }
  /* 兜底：手若被别处判死（清场 / 外部移除），移除时也保证解禁一次。 */
  onDead() { this.release(); }
  /* 这一抓的砸墙伤害：抓到手时手伸得越远越高（dmgMin~dmgMax 线性）。 */
  dmgNow() {
    const p = this.p;
    return Math.round(lerp(p.dmgMin, p.dmgMax, clamp(this.reach, 0, 1)));
  }
  update(dt) {
    const p = this.p;
    /* 施法者已经倒下：手跟着消失，并且【先解禁被抓的对手】——
       不然 mech.update 停了，这只手再也不会被轮询到，对手会永久卡在无碰撞状态。 */
    if (!this.u.alive || this.u.dying) { this.release(); this.dead = true; return; }
    this.age += dt;
    this.jT += dt * this.jSpeed;
    if (this.state === 'out') {
      this.len += p.handSpeed * dt;
      const e = world.enemyOf(this.u);
      if (e && !e.dying) {
        const dx = this.tipX - e.x, dy = this.tipY - e.y, rr = p.palmR + CFG.R * 0.9;
        if (dx * dx + dy * dy < rr * rr) {
          this.grab = e; e.grabbed++; this.state = 'back'; this.backLen0 = Math.max(1, this.len);
          /* 伤害只看"抓到时手伸了多远"：越远越重（手伸到对面墙 ≈ 满值） */
          this.reach = clamp(this.len / Math.max(1, this.maxLen), 0, 1);
          sfx('dark_orb_evoke', 0.8, 0.92);
          burst(e.x, e.y, 16, { c: '#b57bea', s0: 80, s1: 300 });
        }
      }
      if (this.len >= this.maxLen) { this.len = this.maxLen; this.state = 'hold'; this.t = 0; }
    } else if (this.state === 'hold') {
      this.t += dt;
      if (this.t > 0.1) { this.state = 'back'; this.backLen0 = Math.max(1, this.len); }
    } else {
      this.len -= p.retractSpeed * dt;
      if (this.grab && this.grab.alive && !this.grab.dying) {
        /* 把被抓的对手拖回来。tipX 在收到底时会等于墙面上那个点（比如左墙 x=3），
           不夹一下的话对手会被拖到只剩半张卡在屏幕里。夹到"整张卡仍贴着墙"为止，
           观感是"被按在墙上"，而不是"被墙吃掉一半"。 */
        this.grab.x = clamp(this.tipX, CFG.R, CFG.AW - CFG.R);
        this.grab.y = clamp(this.tipY, CFG.R, CFG.AH - CFG.R);
        if (this.len <= 0) {
          const e = this.grab;
          world.shake = 16;
          /* 摔在墙上：落点要【朝场地内侧】偏移一个身位，反弹方向也朝内。
             以前写的是 sx - nx*(R+8)、dx = -nx（都朝墙外），结果被摔的单位会
             先飞到场地外（左墙算出来是 x=-59），下一帧才被撞墙判定拽回来 ——
             那一帧它会整张卡闪在场外。 */
          e.x = this.sx + this.nx * (CFG.R + 8);
          e.y = this.sy + this.ny * (CFG.R + 8);
          e.dx = this.nx; e.dy = this.ny;
          e.damage(this.dmgNow(), 'hit', this.u);
          e.bouncePop = 1.3;
          sfx('heavy_attack', 0.95, 0.85);
          burst(e.x, e.y, 24, { c: '#c98bf0', s0: 120, s1: 380 });
          this.release();                 // 先解禁，再判死：不然对手会卡一帧"无碰撞"
          this.dead = true;
        }
      } else if (this.len <= 0) this.dead = true;
      if (this.grab && !this.grab.alive) { this.release(); this.dead = true; }
    }
    /* 腕口粒子：手还在外面就一直往外撒（退场淡出时停） */
    this.emitDust(dt);
  }
  /* 这一帧的"活的"参数：draw 和粒子生成【共用同一套算法】，不然粒子会和断面错位。 */
  liveState() {
    const back = (this.state === 'back');
    const holding = !!(this.grab && this.grab.alive && !this.grab.dying);
    // 抓中立刻攥紧；没抓到、只是回缩时手指也会自然收拢
    const grip = this.grab ? 1 : (back ? 0.55 : 0.15);
    /* 退场照原版：缩放收到一半 + alpha 归零。
       但"抓着人往回拖"的时候必须保持实体，否则看不出是谁在拖。 */
    const closing = back && !holding;
    const fadeT = closing ? clamp(1 - this.len / this.backLen0, 0, 1) : 0;
    const stut = (this.age > this.stutFrom && this.age < this.stutTo);
    const pop = springOut(clamp(this.age / 0.26, 0, 1));
    const shrink = closing ? 1 - 0.50 * fadeT : 1 - 0.06 * grip;
    const k = DH.S * Math.max(0, pop) * clamp(shrink, 0.05, 2);
    return {
      pop: pop, shrink: shrink, k: k, grip: grip, closing: closing,
      base: Math.max(0, this.len) - DH.TIPX * k,  // 腕口断面距洞口（负 = 断面还埋在墙里）
      hw: 17 * k,                                 // 腕口半宽（世界单位）
      alpha: closing ? 1 - fadeT : 1,
      hole: closing ? 1 - fadeT : clamp(this.age * 4, 0, 1),
      jit: Math.sin(this.jT) * this.jAmp * (stut ? 0.5 : 1),
      t: this.age
    };
  }
  /* 腕口粒子：世界坐标、撒出去就不管了。
     手退场淡出中、或断面还没探出墙面时不撒 —— 那时断口本来也看不见。 */
  emitDust(dt) {
    const L = this.liveState();
    if (L.closing || L.alpha <= 0.05 || L.base <= 6) { this.pAcc = 0; return; }
    const rate = (this.state === 'out') ? 130 : 78;   // 伸出时最密，之后转成余烬
    this.pAcc += dt * rate;
    let n = Math.floor(this.pAcc);
    if (n > 5) n = 5;                                 // 一帧最多补 5 颗，掉帧也不刷屏
    this.pAcc -= n;
    const wx = this.sx + this.nx * L.base, wy = this.sy + this.ny * L.base;
    for (let i = 0; i < n; i++) wristMoteAt(wx, wy, this.nx, this.ny, L.hw);
  }
  draw(ctx) {
    const L = this.liveState();
    drawDemonHand(ctx, this.sx, this.sy, Math.atan2(this.ny, this.nx),
      Math.max(0, this.len), L.grip, L);
  }
}
class MechDarkEmbrace {

/* ---------- 7.2 刀刃陷阱 ---------- */
class Knife extends Effect {
  constructor(owner, x, y, ang, p) {
    super();
    this.owner = owner; this.x = x; this.y = y; this.ang = ang; this.p = p;
    this.spd = p.spd; this.dmg = p.dmg; this.state = 'fly'; this.delay = 0;
    this.hitMinions = new Set();      // 已穿过的仆从（弹幕穿过，同一发只打一次）
    this.target = null;               // 引导目标：和刀刃陷阱相撞的那个敌人（见 MechKnifeTrap.onUnitHit）
  }
  update(dt) {
    /* 引导目标：和刀刃陷阱【相撞的那个敌人】（onUnitHit 传入，见 onUnitHit）。
       没有记录到碰撞对象（或它已死）时，退回旧的"最近敌人"口径。 */
    const t = (this.target && this.target.alive && !this.target.dying)
      ? this.target : world.enemyOf(this.owner);
    if (this.state === 'recover') {
      if (this.delay > 0) { this.delay -= dt; return; }
      if (!t || !t.alive || t.dying) { this.state = 'fly'; return; }
      this.ang = Math.atan2(t.y - this.y, t.x - this.x);
      /* 引导刀飞得更快（guideSpdMul 倍巡航速度）—— 快速扑向敌人 */
      const gs = this.spd * this.p.guideSpdMul;
      this.x += Math.cos(this.ang) * gs * dt;
      this.y += Math.sin(this.ang) * gs * dt;
    } else if (this.state === 'fly') {
      this.x += Math.cos(this.ang) * this.spd * dt;
      this.y += Math.sin(this.ang) * this.spd * dt;
    } else return;

    /* 命中判定对【每个】敌方单位（本体+仆从）：飞刀撞到谁都算，不再只看最近的 */
    for (const e of world.enemiesOf(this.owner)) {
      const dx = e.x - this.x, dy = e.y - this.y;
      if (dx * dx + dy * dy < CFG.R * CFG.R) {
        /* 余像的分身：敌人的飞刀扎到分身 → 分身碎裂（刀本身照常插墙/消失） */
        cloneHitBy(e);
        /* 被"相撞"引导过来的刀（recover）伤害 ×guideMul（1.5，18×1.5=27）——
           显式 round 一次（damage() 入口也会兜底取整，这里是双保险）。 */
        const guided = (this.state === 'recover');
        const dmg = guided ? Math.round(this.dmg * this.p.guideMul) : this.dmg;
        /* 【弹幕穿过仆从】打一次伤害后继续飞，仆从不再当"挡刀的肉盾"
           （同一发对同一个仆从只结算一次）。命中本体仍按原样：刀消失。 */
        if (e.minion) {
          if (this.hitMinions.has(e)) continue;
          this.hitMinions.add(e);
          e.damage(dmg, 'hit');
          /* 推一下：只加一点速度，**不改方向**（用 nudge 不是 knock） */
          e.nudge(this.p.nudge, this.p.nudgeCap);
          burst(this.x, this.y, 8, { c: '#ffe6b8', s0: 60, s1: 200 });
          sfx('slash_attack', 0.55, vrand(0.95, 1.1, 'vrand'), 0.02);
          /* 【修复"引导刀卡在仆从身上"】recover（引导）状态的瞄准目标是
             world.enemyOf() = 【最近的敌人】，仆从也算 —— 刀扑到仆从身上后，
             每帧都重新朝它瞄准，就一直贴着这只仆从飞（伤害已被上面的去重拦住），
             永远到不了墙、也到不了本体，观感就是"卡在仆从身上"。
             修复（2026-09-23 用户要求）：给仆从造成一次伤害后，直接按【当前方向】
             直线飞走（recover → fly，不再引导）；之后该插墙照样插墙 ——
             下面的贴墙判定对两种状态都生效。 */
          if (this.state === 'recover') this.state = 'fly';
          continue;
        }
        e.damage(dmg, 'hit');
        /* 推一下：只加一点速度，**不改方向**（用 nudge 不是 knock） */
        e.nudge(this.p.nudge, this.p.nudgeCap);
        burst(this.x, this.y, 8, { c: '#ffe6b8', s0: 60, s1: 200 });
        sfx('slash_attack', 0.55, vrand(0.95, 1.1, 'vrand'), 0.02);
        this.dead = true; break;
      }
    }
    const m = 9;
    let hx = null;
    if (this.x < m) hx = [1, 0, m, this.y];
    else if (this.x > CFG.AW - m) hx = [-1, 0, CFG.AW - m, this.y];
    else if (this.y < m) hx = [0, 1, this.x, m];
    else if (this.y > CFG.AH - m) hx = [0, -1, this.x, CFG.AH - m];
    if (hx) {
      this.x = hx[2]; this.y = hx[3];
      this.state = 'stuck';
      /* 插在边框上：保留「飞到边框那一刻」的角度（不再改成垂直于墙面），
         并且此后完全静止（绘制时也不再加晃动）。 */
      sfx('card_exhaust', 0.25, vrand(1.1, 1.35, 'vrand'), 0.05);
    }
  }
  draw(ctx) {
    const im = IMG['sp_knife_thrown'];
    if (!im) return;
    const w = 48, h = w * (im.naturalHeight / im.naturalWidth);
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.ang);          // 插墙后也保持原角度、不晃动（按需求去掉抖动）
    ctx.shadowColor = 'rgba(255,225,170,.75)'; ctx.shadowBlur = 7;
    ctx.drawImage(im, -w / 2, -h / 2, w, h);
    ctx.restore();
  }
}
class MechKnifeTrap {
  constructor(u, p) { this.u = u; this.p = p; this.cd = p.first; this.cd2 = 0; this.knives = []; }
  update(dt) {
    this.cd -= dt;
    /* 被抓着时不再拔刀：飞刀也算"攻击"，被拎着走的时候不该还能扔。
       cd 照常走，松手后立刻恢复节奏。 */
    if (this.cd <= 0) {
      this.cd += this.p.interval;
      if (this.u.grabbed <= 0) this.fire();
    }
    if (this.cd2 > 0) this.cd2 -= dt;
    if (this.knives.length) {
      this.knives = this.knives.filter(k => !k.dead);
      // 上限保护：场上刀过多时回收最早的（每次一对之后产出翻倍，上限提到 80）
      while (this.knives.length > this.p.maxKnives) this.knives.shift().dead = true;
    }
  }
  fire() {
    const e = world.enemyOf(this.u); if (!e) return;
    const a = Math.atan2(e.y - this.u.y, e.x - this.u.x);
    /* 一次两枚：朝敌人一枚 + 朝【正反方向】一枚（同时出膛，共用一次音效）。
       背向那枚多半直接插在身后的墙上，等于给"相撞引导"多备了弹药。 */
    for (const ang of [a, a + Math.PI]) {
      const k = new Knife(this.u, this.u.x, this.u.y, ang, this.p);
      world.effects.push(k); this.knives.push(k);
    }
    sfx('dagger_throw', 0.75, vrand(0.95, 1.08, 'vrand'));
  }
  /* 本体被撞到 → 把所有插墙刀引导向【撞上来的那个敌人】（2026-09-23 用户要求：
     不是"离小刀最近的敌人" —— 那会选错目标；就以这次相撞的对象为准）。
     ⚠ 2026-09-30 用户口径：只有【敌方】相撞才触发引导。onUnitHit 对友方也会发
     （友方实心），典型场景：祭品撞上自己召出来的刀刃陷阱 —— 以前只是"不更新目标"，
     插墙刀照样全部放飞，朝敌人方向那半边直接扑回敌人身上，看起来就像被引导了。
     现在友方/无效单位一律整个不触发。 */
  onUnitHit(e) {
    if (this.cd2 > 0) return;
    if (!e || !e.alive || e.dying || e.team === this.u.team) return;
    const stuck = this.knives.filter(k => k.state === 'stuck');
    if (!stuck.length) return;
    this.cd2 = 0.9;
    /* 引导刀的起飞延迟。【必须走对战随机流】：延迟决定每把刀什么时候扑到敌人身上，
       直接改变命中时刻与伤害节奏；用观感流掷会随帧率漂移，整局就分叉了。 */
    stuck.forEach(k => {
      k.state = 'recover'; k.delay = rand() * this.p.recoverDelay;
      k.target = e;                                  // 这一批刀都瞄准同一个撞上来的敌人
    });
    sfx('card_deal', 0.5, 1.45);
  }
  statusText() {
    const n = this.knives.filter(k => k.state === 'stuck').length;
    return n ? { t: '插墙刀 ' + n, c: '#c7e39a' } : null;
  }
}
MECHS.knife_trap = MechKnifeTrap;

/* 君王之剑「剑格 → 剑尖」的长度（场地单位）。

   SB.RB[1] = -947 是【剑尖】在烘图局部坐标里的 y，SB.K = 0.17 是"每局部单位
   对应多少场地单位"，而 drawSovereignBlade 的锚点 (ax,ay) 就是局部原点（剑格）——
   所以剑尖在锚点正前方 |−947| × 0.17 ≈ 161 处。
   2026 修订：追踪之刃原来把这个长度写死成 tipOff=320，画出来的剑却只有 161 长，
   于是整把剑被画在插剑点后方约 159px 处（"剑浮在半空、没插在墙上"）。
   现在画与判定共用这一个常量，永远对得上。 */
const SB_TIP_OFF = Math.abs(SB.RB[1]) * SB.K;

/* 剑身横截面色带：第 1 项是局部 x 位置，第 2 项是颜色。
   数值照参考图逐像素实测，但上棱那一半先减掉高光层(Blade2)将叠加的量，避免过曝洗白。 */
const SB_BANDS = [                // x 全部随 RB 一起 ×0.88
  [  -88, 'rgba(96,168,245,0)'    ],
  [  -77.4, 'rgba(100,178,250,.42)' ],
  [  -73.9, '#6ceef8' ],   // 上青边
  [  -58.1, '#6ceef8' ],
  [  -54.6, '#2a67c0' ],
  [  -51, '#11406e' ],   // 亮蓝上棱（+高光 ≈ 实测 #1950a6）
  [  -40.5, '#134780' ],
  [  -26.4, '#14497f' ],
  [  -15, '#11406e' ],
  [  -9.7, '#1a559c' ],
  [  -6.2, '#5fd2e8' ],   // 青白中线（锐边）
  [    0.9, '#66d8ee' ],
  [    3.5, '#0f3862' ],   // 深藏青下棱
  [   29.9, '#154a83' ],
  [   35.2, '#103a68' ],
  [   52.8, '#0f3762' ],
  [   58.1, '#6ceef8' ],   // 下青边
  [   73.9, '#6ceef8' ],
  [   77.4, 'rgba(100,178,250,.42)' ],
  [   88, 'rgba(96,168,245,0)'    ]
];

/* 按 tint 色把贴图 RGB 乘一下、保留原 alpha（等价原版的 modulate）。
   multiply 会把透明区也刷实，所以再用 destination-in 把原 alpha 盖回来。 */
function sbTint(im, color) {
  const cache = im.__tint || (im.__tint = {});
  if (cache[color]) return cache[color];
  const w = im.naturalWidth, h = im.naturalHeight;
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const g = t.getContext('2d');
  g.drawImage(im, 0, 0);
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = color; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(im, 0, 0);
  cache[color] = t;
  return t;
}

/* 把贴图的「形状」压成单一颜色（保留 alpha）——用来做发光/描边的轮廓层。
   原版很多部件是纯白贴图 + modulate 上色，用这个等价替代。 */
function sbFlat(key, color) {
  const im = IMG[key]; if (!im) return null;
  const cache = im.__flat || (im.__flat = {});
  if (cache[color]) return cache[color];
  const w = im.naturalWidth, h = im.naturalHeight;
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const g = t.getContext('2d');
  g.fillStyle = color; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(im, 0, 0);
  cache[color] = t;
  return t;
}

/* 黑底白形遮罩（如 outline_mask）→ 黑底 + 指定色形状的一张图。
   黑底在加法混合下等于透明，所以可以直接 'lighter' 叠上去，得到「只有形状发光」的效果。 */
function sbMask(key, color) {
  const im = IMG[key]; if (!im) return null;
  const cache = im.__masked || (im.__masked = {});
  if (cache[color]) return cache[color];
  const w = im.naturalWidth, h = im.naturalHeight;
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const g = t.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  g.drawImage(im, 0, 0);                     // 白形提到黑底上
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = color; g.fillRect(0, 0, w, h);// 再按目标色着色
  cache[color] = t;
  return t;
}

/* 原版有幾张贴图是「完全不透明的黑底 + 白色形状」（outline / shine 的 alpha 全 = 255）。
   这种图直接画会在烘图里留一块不透明黑矩形，必须把亮度搬进 alpha 通道才叠得对。
   图片是 dataURI 加载的，画布不会被污染，getImageData 安全；万一被拒就退回不透明方案。 */
function sbLuma(key, color, gain) {
  const im = IMG[key]; if (!im) return null;
  const ck = (color || '#fff') + '|' + (gain || 1);
  const cache = im.__luma || (im.__luma = {});
  if (ck in cache) return cache[ck];
  const w = im.naturalWidth, h = im.naturalHeight;
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const g = t.getContext('2d');
  g.drawImage(im, 0, 0);
  let data;
  try { data = g.getImageData(0, 0, w, h); }
  catch (e) { cache[ck] = null; return null; }
  const d = data.data;
  let cr = 255, cg = 255, cb = 255;
  const m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(color || '');
  if (m) { cr = +m[1]; cg = +m[2]; cb = +m[3]; }
  const gn = gain || 1;
  for (let i = 0; i < d.length; i += 4) {
    let a = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) * gn;
    d[i] = cr; d[i + 1] = cg; d[i + 2] = cb; d[i + 3] = a > 255 ? 255 : a;
  }
  g.putImageData(data, 0, 0);
  cache[ck] = t;
  return t;
}

/* 剑身本体：把「横截面渐变色带」刷进剑身剪影里，做出原版那种双色棱面 + 青边。 */
function sbBladeLayer(K) {
  const b = SB.RB;
  const w = Math.max(2, Math.ceil((b[2] - b[0]) * K));
  const h = Math.max(2, Math.ceil((b[3] - b[1]) * K));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, w, 0);
  for (let i = 0; i < SB_BANDS.length; i++) {
    grd.addColorStop(clamp((SB_BANDS[i][0] - b[0]) / (b[2] - b[0]), 0, 1), SB_BANDS[i][1]);
  }
  g.fillStyle = grd;
  g.fillRect(0, 0, w, h);
  /* 沿剑长再压一层：剑尖那头暗、近剑格那头亮（原版近剑格被爆闪洗白，越往尖越沉） */
  const lg = g.createLinearGradient(0, 0, 0, h);
  lg.addColorStop(0.00, '#5f666e');
  lg.addColorStop(0.26, '#9aa0a6');
  lg.addColorStop(0.62, '#ffffff');
  lg.addColorStop(1.00, '#ffffff');
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = lg;
  g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-in';   // 剪影 = 剑身贴图自身的 alpha
  g.drawImage(IMG['sp_sb_blade'], 0, 0, w, h);
  return c;
}

/* 把整把剑烘成一张位图（只在分辨率变化时重做一次）。
   层序照 tscn 的节点顺序：剑身 → 高光 → 描边 → 装饰 → 剑柄 → 剑格爆闪。
   加法混合用 'lighter'（对应原版 canvas_item_material_additive_shared）。 */
function sbBake() {
  const K = SB.KB;                           // 设备像素 / 局部单位
  const B = SB.BOX;
  const M = Math.ceil(46 * K);               // 模糊 / 外发光留边
  const c = document.createElement('canvas');
  c.width = Math.ceil((B[2] - B[0]) * K) + 2 * M;
  c.height = Math.ceil((B[3] - B[1]) * K) + 2 * M;
  const g = c.getContext('2d');
  if (g.imageSmoothingQuality) g.imageSmoothingQuality = 'high';
  const AX = M - B[0] * K, AY = M - B[1] * K;   // 剑格锚点在这张图里的像素位置

  /* 把一个部件按局部矩形画上去。o 可带：
     tint 乘色 / flat 单色剪影 / mask 黑底白形遮罩 / luma 亮度转 alpha / col 配 flat|mask|luma 的颜色 /
     gain luma 增益 / a 透明度 / add 加法 / blur 模糊(局部单位) / grow 等比放大 / growX growY 分轴放大 /
     rot 绕自身中心旋转 / dx dy 额外偏移 */
  function put(key, box, o) {
    o = o || {};
    const im = o.luma ? sbLuma(key, o.col, o.gain)
             : o.mask ? sbMask(key, o.col)
             : o.flat ? sbFlat(key, o.col)
             : o.tint ? sbTint(IMG[key], o.tint) : IMG[key];
    if (!im) return;
    const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
    const hw = (box[2] - box[0]) / 2 * (o.growX || o.grow || 1) * K;
    const hh = (box[3] - box[1]) / 2 * (o.growY || o.grow || 1) * K;
    g.save();
    if (o.add) g.globalCompositeOperation = 'lighter';
    if (o.a != null) g.globalAlpha = o.a;
    if (o.blur) g.filter = 'blur(' + (o.blur * K).toFixed(2) + 'px)';
    g.translate(AX + cx * K + (o.dx || 0) * K, AY + cy * K + (o.dy || 0) * K);
    if (o.rot) g.rotate(o.rot);
    g.drawImage(im, -hw, -hh, hw * 2, hh * 2);
    g.restore();
  }

  /* --- 1. 剑身外发光：剪影横向微放大 + 模糊，蓝青加法（剑身本体随后会盖回来，只在外缘可见） --- */
  put('sp_sb_blade', SB.RB, { flat: 1, col: 'rgb(80,160,255)', a: .16, add: 1, growX: 1.06, blur: 4.5 });
  put('sp_sb_blade', SB.RB, { flat: 1, col: 'rgb(140,220,255)', a: .34, add: 1, growX: 1.03, blur: 1.6 });
  /* 原版 BladeGlow 是暖橙加法，压低后只当一层薄暖光 */
  put('sp_sb_glow', SB.RG, { luma: 1, col: 'rgb(255,150,40)', a: .13, add: 1, blur: 3 });

  /* --- 2. 剑身本体（横截面双色棱面 + 青边） --- */
  g.drawImage(sbBladeLayer(K), AX + SB.RB[0] * K, AY + SB.RB[1] * K);

  /* --- 3. 白芯高光（原版 Blade2：modulate(0.141,0.337,1) × alpha 0.25，加法） --- */
  put('sp_sb_shine', SB.RS, { luma: 1, col: 'rgb(36,86,255)', a: .25, add: 1, blur: 1.5 });

  /* --- 4. 描边（原版 BladeOutline2 = 黑底白形遮罩，只在青边外沿补一道细亮线） --- */
  put('sp_sb_outline', SB.RO, { luma: 1, col: 'rgb(70,185,255)', a: .13, add: 1, blur: 2.6 });
  put('sp_sb_outline', SB.RO, { luma: 1, col: 'rgb(190,255,255)', a: .13, add: 1 });

  /* --- 5. 剑身星形装饰 --- */
  put('sp_sb_deco', SB.RD, {});

  /* --- 6. 剑格 + 剑柄 --- */
  put('sp_sb_hilt', SB.RH, {});
  put('sp_sb_hilt2', SB.R2, {});

  /* --- 7. 剑格爆闪：白核 + 长芒 + 四芒星（原版 middle spike / Spikes / light 粒子） --- */
  const bb = SB.BB, bx = AX + bb[0] * K, by = AY + bb[1] * K;
  g.save();
  g.globalCompositeOperation = 'lighter';
  sbDisc(g, bx, by, 122 * K, [56, 148, 255], 1.7, .60);
  sbDisc(g, bx, by, 50 * K, [124, 206, 255], 1.3, .74);
  sbDisc(g, bx, by, 21 * K, [238, 252, 255], 0.9, .92);
  g.restore();
  const RA = [[0, 1.85, .84], [0.34, 1.15, .70], [-0.34, 1.15, .70],
              [0.92, 0.85, .52], [-0.92, 0.85, .52],
              [1.5708, 1.00, .46], [-1.5708, 0.72, .34],
              [2.20, 0.62, .26], [-2.20, 0.62, .26]];
  for (let i = 0; i < RA.length; i++) {
    const s = RA[i][1];
    put('sp_sb_spike', [bb[0] - 9 * s, bb[1] - 124 * s, bb[0] + 9 * s, bb[1] + 124 * s],
        { flat: 1, col: 'rgb(214,242,255)', a: RA[i][2], add: 1, rot: RA[i][0], blur: 1.2 });
  }
  g.save();
  g.globalCompositeOperation = 'lighter';
  sbStar(g, bx, by, 168 * K, .016, 0, [170, 225, 255], .60);
  sbStar(g, bx, by, 112 * K, .020, Math.PI / 4, [140, 205, 255], .34);
  sbStar(g, bx, by, 54 * K, .038, 0, [255, 255, 255], .90);
  /* 剑身上近剑格处零散的金色小点（原版 YellowDots 粒子） */
  for (let i = 0; i < 16; i++) {
    const a = i * 2.399, rr = 9 + (i % 4) * 15;
    sbDisc(g, bx + Math.cos(a) * rr * K, by - (170 + Math.sin(a) * rr * 2.6) * K,
           (3.4 + (i % 3) * 1.5) * K, [255, 196, 60], 0.9, .86);
  }
  g.restore();
  SB.cv = c; SB.ax = AX; SB.ay = AY; SB.kb = K;
}

/* 光斑：径向渐变，亮度按 (1-d)^power 衰减，加法叠加 */
function sbDisc(g, x, y, r, rgb, power, alpha) {
  if (r <= 0.4 || alpha <= 0.004) return;
  const grad = g.createRadialGradient(x, y, 0, x, y, r);
  for (let i = 0; i <= 5; i++) {
    const d = i / 5, a = Math.pow(1 - d, power) * alpha;
    grad.addColorStop(d, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a.toFixed(3) + ')');
  }
  g.fillStyle = grad;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}

/* 四芒星 = 两枚细菱形交叉。size = 全长，waist = 腰宽/全长 */
function sbStar(g, x, y, size, waist, ang, rgb, alpha) {
  if (size <= 2 || alpha <= 0.004) return;
  const L = size / 2, w = size * waist / 2;
  g.save();
  g.translate(x, y);
  if (ang) g.rotate(ang);
  g.globalAlpha = alpha;
  g.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
  for (let i = 0; i < 2; i++) {
    g.beginPath();
    g.moveTo(L, 0); g.lineTo(0, w); g.lineTo(-L, 0); g.lineTo(0, -w);
    g.closePath(); g.fill();
    g.rotate(Math.PI / 2);
  }
  g.restore();
}

/* ---------- 剑身边的光尘（世界坐标粒子） ----------
   旧做法是把四芒星画在剑的**局部坐标**里，于是它们跟着剑转、跟着剑走，很假。
   现在改成在世界坐标里生成：在剑身随机取一点冒出来，之后**不再跟随剑**，
   就留在原地向上飘一小段（约 20~40 单位）然后淡出。
   SbMote 故意【不设 manual】—— 由引擎统一 update / draw：
   这样剑消失后，已经飘在空中的光尘仍会自己飘完、自然销毁（不会再出现"滞留"）。 */
class SbMote extends Effect {
  constructor(x, y, size) {
    super();
    this.x = x; this.y = y;
    this.vx = vrand(-11, 11, 'vrand');            // 轻微横移
    this.vy = -vrand(26, 58, 'vrand');            // 向上飘（整段行程约 20~30 世界单位）
    this.drag = vrand(1.2, 2.1, 'vrand');         // 阻尼：越飘越慢
    this.t = 0; this.life = vrand(0.55, 1.05, 'vrand');
    this.size = size;                   // 星芒全长（世界单位）
    this.ph = vrand(0, TAU, 'vrand');             // 闪烁相位
  }
  update(dt) {
    this.t += dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vx *= Math.exp(-this.drag * dt);
    this.vy *= Math.exp(-this.drag * 0.55 * dt);   // 上飘衰减慢一些，留出"飘一小段"的观感
    if (this.t > this.life) this.dead = true;
  }
  draw(ctx) {
    const k = clamp(this.t / this.life, 0, 1);
    const fade = (1 - k) * (1 - k);                          // 尾段加速消失
    const tw = 0.5 + 0.5 * Math.sin(this.t * 12 + this.ph);  // 一闪一闪
    if (fade < 0.02 || tw < 0.06) return;
    const s = this.size * (1 - 0.3 * k);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    sbDisc(ctx, this.x, this.y, s * 0.62, [150, 210, 255], 1.2, .24 * fade * tw);
    sbStar(ctx, this.x, this.y, s, .085, this.ph, [255, 255, 255], .85 * fade * tw);
    ctx.restore();
  }
}

/* 在「剑附近」随机取一点生成一颗光尘。
   局部 → 世界的换算与 drawSovereignBlade 的 ctx.rotate(ang + PI/2) 对齐：
   局部 -y 是剑尖方向（世界角 ang），局部 +x 是侧向。P 由 Sword.pose() 给出。 */
function sbMoteAt(P, alongMin, alongMax, lateral) {
  const lx = vrand(-lateral, lateral, 'vrand');
  const ly = -vrand(alongMin, alongMax, 'vrand');
  const th = P.ang + Math.PI / 2, K = SB.K * P.sc;
  world.effects.push(new SbMote(
    P.x + (lx * Math.cos(th) - ly * Math.sin(th)) * K,
    P.y + (lx * Math.sin(th) + ly * Math.cos(th)) * K, vrand(5, 10, 'vrand')));
}
/* 沿剑身（局部 40~930 单位，即剑格到剑尖之间）撒 n 颗 */
function sbMoteAlongBlade(P, n) { for (let i = 0; i < n; i++) sbMoteAt(P, 40, 930, 26); }

function drawSovereignBlade(ctx, ax, ay, ang, sc) {
  if (!IMG['sp_sb_blade']) return;
  if (!SB.cv || SB.kb !== SB.KB) sbBake();
  if (!SB.cv) return;
  const K = SB.K * sc;                  // 场地单位 / 局部单位（含本次缩放）
  const P = K / SB.KB;                  // 烘图设备像素 → 场地单位
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(ang + Math.PI / 2);        // 旋转后局部 -y（剑尖）指向 ang
  ctx.drawImage(SB.cv, -SB.ax * P, -SB.ay * P, SB.cv.width * P, SB.cv.height * P);
  /* 剑身外的光尘不在这里画了 —— 改成世界坐标粒子 SbMote（见 sbMoteAlongBlade），
     这样它们不会跟着剑转、跟着剑走。 */
  ctx.restore();
}

class Sword extends Effect {
  constructor(u, p) {
    super();
    this.u = u; this.p = p; this.ang = -Math.PI / 2;
    this.dmg = p.baseDmg; this.cd = 0; this.swing = 0; this.spin = 1.35;
    this.birth = 0; this.hit = false; this.manual = true;
    this.emit = 0;                    // 光尘发射计时器
    /* 挥砍：startAng 起手角，swingArc 这一刀要扫过的角度（已折到 [-π,π]，取最近转向）。
       以前是存 targetAng 直接插值，两个角度差可能接近一整圈 → 偶尔甩得飞快。 */
    this.startAng = this.ang; this.swingArc = 0;
  }
  /* 剑此刻的位置 / 朝向 / 粗细。update 与 draw 共用同一份算法，
     保证光尘是从「画出来的那把剑」的身上冒出来的。 */
  pose() {
    const p = this.p;
    let ang = this.ang, r = p.orbitR, boost = 0;
    if (this.swing > 0) {
      const k = clamp(1 - this.swing / this.p.swingTime, 0, 1);
      const ease = Math.sin(k * Math.PI);
      /* smoothstep：起步和收刀都带缓动，中段最快 —— 一刀读起来才像"劈"。
         以前是 clamp(k*1.6) 的线性插值，0.19s 就走完，起收都是硬切。 */
      const s = k * k * (3 - 2 * k);
      ang = this.startAng + this.swingArc * s;
      r = p.orbitR + 30 * ease;
      boost = 0.10 * ease;
    }
    /* 剑身随「锻打」进度长大：铸出瞬间弹出，之后每一锤再粗一分 */
    const sc = clamp(this.birth * 2.2, 0, 1)
             * (1 + Math.min(this.dmg - p.baseDmg, 240) / 960 + boost);
    return { ang: ang, sc: sc, x: this.u.x + Math.cos(ang) * r, y: this.u.y + Math.sin(ang) * r };
  }
  update(dt) {
    if (this.birth < 0.6) this.birth += dt;
    if (this.cd > 0) this.cd -= dt;
    const e = world.enemyOf(this.u);
    if (this.swing > 0) {
      this.swing -= dt;
      /* 挥砍期间不做自由环绕：这一帧的角度由 pose() 算，环绕角交给收刀时接上 */
      if (this.swing <= 0) {
        /* 收刀：把"自由环绕角"接到这一刀结束的角度上。
           以前挥砍期间环绕角还在自己转，收刀瞬间剑会从刀尾位置跳回环绕角
           —— 那一跳是最刺眼的来源。 */
        this.ang = this.startAng + this.swingArc;
        this.swing = 0;
      }
      /* 被恶魔之手抓着时不出刀：既不判定伤害，也不起新的一刀（挥到一半就只是空挥完） */
      if (!this.hit && !this.u.grabbed && e && e.alive && !e.dying) {
        const d = Math.hypot(e.x - this.u.x, e.y - this.u.y);
        if (d < this.p.swingRange + CFG.R * 0.7) {
          this.hit = true;
          e.knock(e.x - this.u.x, e.y - this.u.y, this.p.knock);
          e.damage(this.dmg, 'hit');
          /* 这一记近战击退【算作一次碰撞】：照球-球碰撞那套回调通知双方机制
             —— 刀刃陷阱就是靠 onUnitHit 把插在墙上的刀引导过来的。
             刻意【不】调 onBounce：那是"锻打加伤"的通路，在这里调等于凭空多给一锤
             （真正的球-球碰撞两件事都会发生，这里只补"碰撞"这一半）。 */
          if (e.mech && e.mech.onUnitHit) e.mech.onUnitHit(this.u);
          if (this.u.mech && this.u.mech.onUnitHit) this.u.mech.onUnitHit(e);
          world.shake = 9;
          burst(e.x, e.y, 18, { c: '#ffd9a0', s0: 120, s1: 380 });
          sfx('heavy_attack', 0.8, vrand(0.95, 1.06, 'vrand'), 0.02);
        }

      this.ang += dt * this.spin;
